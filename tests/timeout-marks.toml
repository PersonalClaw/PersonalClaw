# Every per-test timeout under tests/, with the cap it sets and why the test needs it.
#
# The suite's default cap is `--timeout` in pyproject.toml's addopts. A test that needs another
# one carries `pytest.mark.timeout(N)`, and that mark is listed here by its site: the file and the
# scope it sits in (see tests/timeout_marks.py). The CI contract row
# `every-timeout-mark-is-listed-with-its-reason` fails on a mark this list lacks, an entry whose
# mark is gone, a cap that differs, and an entry with no reason. Adding an entry is the reviewed
# act; a mark that is deleted takes its entry with it. Main's CI contract over a head runs with
# main's entries for the files it lays over the head, and the head's for the rest
# (tools/ci/contract.py's overlaid_marks).

