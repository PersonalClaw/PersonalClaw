# The imports `python -m tools.ci select` cannot read (#3945 item 9): every call outside
# tests/rails whose module or file is not a literal the parser can fold. Each site is one of:
#
#   prefix = "a.b"   it may import any module under a.b, so its module is selected on any
#                    change there;
#   named = true     it loads a module or a file its module already imports or names in a
#                    literal, so the graph's edges already reach it;
#   outside = true   it loads only code outside this repository: a third-party package, an app
#                    in the apps repository, a file the test wrote.
#
# An unlisted site selects the whole suite, and tests/rails/test_select_dynamic_imports_tree.py
# fails until it is listed. `call` is the call as `ast.unparse` writes it.

