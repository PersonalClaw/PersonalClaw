# Every program a workflow or a local action downloads and then runs, pinned by its exact URL
# and SHA-256. Dependabot cannot move these: the pin-refresh job (#4585) reads this file to say
# when one is stale, and a person makes the reviewed edit. Each entry's user holds the same URL,
# SHA-256 and version as literals, and tests/rails/test_ci_tier_workflow_steps_tree.py holds the
# two equal. Nothing here is re-hosted or shipped: each one is fetched from its upstream, for CI
# alone. See docs/maintainers/ci.md, "How to pin".

[[download]]
name = "ffmpeg"
# The setup action's "Install the pinned ffmpeg build" step, for the Linux suite (python-suite),
# whose toolchain names ffmpeg: ffmpeg and ffprobe, for the tests that build and read a video.
used_by = ".github/actions/setup/action.yml"
url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz"
sha256 = "41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380"
version = "n8.1.3-27-g8dca1586f4-20261031"
upstream = "FFmpeg-Builds/FFmpeg-Builds (formerly BtbN/FFmpeg-Builds), the static builds ffmpeg.org's download page links"
provenance = "release autobuild-2026-10-31-12-59; the asset uploaded 2026-10-31T12:59:33Z by github-actions[bot], from that repository's Build FFmpeg workflow; the SHA-256 is GitHub's own digest of the asset"
license = "GPL (the static gpl variant, for libx264 and libopus): run in CI only, never re-hosted or shipped"
pinned = 2026-11-19
refresh = "a newer month-end autobuild-YYYY-MM-DD-HH-MM release (month-end tags are kept for years, daily ones for weeks): its linux64-gpl asset, that asset's digest from `gh api repos/FFmpeg-Builds/FFmpeg-Builds/releases/tags/<tag>`, and its version, changed together here and in the setup action, its two cache keys included"
