# The installer smoke, in a bare container: the checkout's wheel, the staged installer and the
# served one-liner, each a script under tools/ci/ run as `sh <script>`, in turn. It reads PyPI and
# the installer the website serves as they are the night it runs, so it is live, as the nightly
# audit is, and its evidence is never reused, by TTL or by tree.
[[job]]
id = "install-smoke"
tiers = ["breadth"]
inputs = [":(glob)**"]
external_inputs = ["package-index"]
toolchain = ["uv"]
cache = []
security = "ordinary"
live = true
python = "3.13.16"
timeout_min = 20
script = [
  "tools/ci/install_smoke_current.sh",
  "tools/ci/install_smoke_staged.sh",
  "tools/ci/install_smoke_served.sh",
]
container = "ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794"

# The dependency audit every night on main, where a new advisory lands without a commit. The
# same command as `audit`, under breadth's cap.
[[job]]
id = "audit-nightly"
tiers = ["breadth"]
inputs = [":(glob)**"]
external_inputs = ["advisory-feed", "package-index"]
toolchain = ["uv", "node"]
cache = ["uv"]
security = "ordinary"
live = true
python = "3.12.15"
timeout_min = 20
needs_node = true
install_exemptions = [
  { install = "uv pip install --python {runner_temp}/audit-venv/bin/python pip-audit==2.10.1", reason = "the auditor runs in a venv of its own, apart from the graphs it audits; its version is pinned" },
]
command = [
  { argv = ["uv", "venv", "{runner_temp}/audit-venv"] },
  { argv = ["uv", "pip", "install", "--python", "{runner_temp}/audit-venv/bin/python", "pip-audit==2.10.1"] },
  { argv = ["{runner_temp}/audit-venv/bin/python", "-m", "tools.ci", "audit", "run", "--pip-audit", "{runner_temp}/audit-venv/bin/python", "--work", "{runner_temp}/audit"] },
]

[[job]]
id = "client"
tiers = ["change", "merge"]
inputs = [":(glob)**"]
external_inputs = ["package-index"]
toolchain = ["uv"]
cache = ["uv"]
security = "ordinary"
python = "3.12.15"
timeout_min = 5
junit = ["reports/junit-client.xml"]
install_exemptions = [
  { install = "uv pip install --python .venv-client packages/personalclaw-client-py[dev]", reason = "the client is not part of core's uv workspace and has no lock of its own" },
]
