# CI's supply-chain policy, read by tools/ci/supply_chain.py and held by the supply-chain rows
# of tests/rails/test_ci_supply_chain_contract.py. See docs/maintainers/ci.md, "Supply chain", for how to pin, how a
# refresh arrives, and how to add or renew an exception.

# Each Node release line CI or an image may run, and the date it reaches end of life, from the
# Node.js release schedule (github.com/nodejs/Release, schedule.json). A Node on a line past its
# date, or on a line not listed here, fails. Add a line when the repository moves to it; leave
# past lines in place, so a pin on one fails on its date.
[node_end_of_life]
"20" = 2026-04-30
"22" = 2027-04-30
"24" = 2028-04-30
"26" = 2029-04-30

# Audited writes. Every write permission a job holds, its own or inherited from the top of its
# workflow, must be listed here with the steps that use it and why. So must every actions/checkout
# that keeps its credentials (permission = "persist-credentials"); there are none. A step is
# named by its `name:`, or by its action without the ref when it has none; a credential entry
# names each checkout that keeps its credentials by a `name:` no other checkout in its job
# shares. Anything unlisted fails, and an entry that matches nothing fails.
[[audited_write]]
workflow = "dco.yml"
job = "dco"
permission = "pull-requests: write"
steps = ["Explain how to fix DCO"]
reason = "Posts or updates the one comment that names each commit, and the title, that breaks a provenance rule (sign-off, tool marks, skip markers) and how to fix it."

[[audited_write]]
workflow = "pr-feedback.yml"
job = "lint-help"
permission = "pull-requests: write"
steps = ["Post the remediation"]
reason = "Posts or updates the one comment that carries a failed CI run's lint remediation, fork pull requests included."

[[audited_write]]
workflow = "release.yml"
job = "pypi"
permission = "id-token: write"
steps = ["pypa/gh-action-pypi-publish"]
reason = "Trusted Publishing: PyPI exchanges the job's OIDC token for an upload of personalclaw, behind the release environment."

[[audited_write]]
workflow = "release.yml"
job = "pypi-client"
permission = "id-token: write"
steps = ["pypa/gh-action-pypi-publish"]
reason = "Trusted Publishing of personalclaw-client, behind the release-client environment."

[[audited_write]]
workflow = "release.yml"
job = "images"
permission = "packages: write"
steps = ["docker/login-action", "Push the layout, every digest kept"]
reason = "Pushes the two multi-platform images and their attestations to GHCR, from the layouts release-artifacts.yml built and smoked, every digest kept."

[[audited_write]]
workflow = "release.yml"
job = "notes"
permission = "contents: write"
steps = ["Create GitHub Release"]
reason = "Creates the tag's GitHub Release and attaches its distributions, SBOMs and desktop installers."

[[audited_write]]
workflow = "release.yml"
job = "attest"
permission = "id-token: write"
steps = ["actions/attest-build-provenance"]
reason = "Signs the wheel's and sdist's build-provenance attestations with the job's OIDC identity."

[[audited_write]]
workflow = "release.yml"
job = "attest"
permission = "attestations: write"
steps = ["actions/attest-build-provenance"]
reason = "Stores those attestations on the repository."

[[audited_write]]
workflow = "breadth.yml"
job = "report"
permission = "issues: write"
steps = ["settle the legs and write the record", "open, update or close the leg issues"]
reason = "Keeps one issue per red nightly leg, titled `breadth: <leg> is red`, and nothing else; it writes issues only on main."

[[audited_write]]
workflow = "flake-report.yml"
job = "report"
permission = "issues: write"
steps = ["report, and on main write the weekly issue"]
reason = "Edits the one open issue titled `Weekly CI health` that the workflow's own account opened, or opens it once; it writes the issue only on main, and nothing else."

[[audited_write]]
workflow = "settings-report.yml"
job = "report"
permission = "issues: write"
steps = ["read the settings and compare, and on main write the drift issue"]
reason = "Opens or edits the one open issue titled `Repository settings drift` that the workflow's own account opened, and closes it when a run finds no drift; it writes the issue only on main, and no setting."

[[audited_write]]
workflow = "image-pins.yml"
job = "check"
permission = "issues: write"
steps = ["check the pinned images, and on main write the refresh issue"]
reason = "Opens or edits the one open issue titled `Pinned images to refresh` that the workflow's own account opened, and closes it when every pin is current; it writes the issue only on main, and no file."

# Exceptions. One waives exactly one violation of one rule (scope) in one file, and expires at
# most 30 days after the day it is written or renewed. Renewing is a new expiry with a new
# reason. An expired entry, one more than 30 days out, one that matches nothing or more than one
# violation, and one missing a field all fail. `file`, `scope` and `reference` are the
# violation's own, as the row prints them; on the expiry day CI goes red, which is the point.
# There are none.
