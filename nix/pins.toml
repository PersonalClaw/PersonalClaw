# uv.lock's entries at v0.2.1, the release nix/personalclaw.nix packages, for the packages
# the Nix channel builds from the lock's own wheels instead of taking from nixpkgs (see
# nix/python.nix). Written by scripts/nix_pins.py and checked against that tag by CI: to pin
# another package, add it to PINS there and run `python3 scripts/nix_pins.py`.

# croniter: the release asks for croniter>=2.0,<3, the cron grammar its expression corpus was
# measured against, and nixpkgs carries 6.x.
[[package]]
name = "croniter"
version = "2.0.7"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "python-dateutil" },
    { name = "pytz" },
]
sdist = { url = "https://files.pythonhosted.org/packages/3d/70/240ea4efb2e03b513d820e8da48b784258cbc88770b4b061931cf0269cf8/croniter-2.0.7.tar.gz", hash = "sha256:1041b912b4b1e03751a0993531becf77851ae6e8b334c9c76ffeffb8f055f53f", size = 49655, upload-time = "2024-07-16T15:21:23.156Z" }
wheels = [
