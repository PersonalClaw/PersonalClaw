# Dependency review (#4585): GitHub's dependency comparison between a pull request's base and
# head, read over the API, failing on a dependency the pull request adds or moves to with a
# known vulnerability.
#
# Feedback only (#3908): it runs on `pull_request`, so it is the head's own copy, and gates
# nothing. The merge verdict reads the same dependency-graph comparison itself and judges it by
# this action's rule with these settings, so the head cannot change what judges it. It never checks
# out the pull request's code: the action reads the base and head commits from the event and asks
# the dependency-graph API to compare them, with a read-only token. There is no checkout here at
# all; do not add one.
name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per pull request: a new head cancels the review of the old one. The group is
# `dependency-review-pr-`, not the `dependency-review-` main's pull_request_target copy ran in:
# on the pull request that moved it, both copies ran, and in one group each cancelled the other.
concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
