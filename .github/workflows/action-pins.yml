# Every action the workflows pin by commit SHA is still the release its comment names.
#
# A `uses: owner/repo@<sha> # vX.Y.Z` line runs the SHA; the comment is what a reviewer reads.
# Dependabot keeps both moving together, but nothing else checks that they still agree: a tag
# that moves upstream, or a comment edited without its SHA, leaves the two describing different
# code. `tools/ci/action_pins.py` reads each distinct release once from the GitHub API, follows an
# annotated tag to its commit, and fails on a mismatch, a tag that is gone, a pin with no release
# comment, and any answer the API could not give (unresolved is never a pass).
#
# Read-only: the token reads public tags, and the job holds `contents: read` and nothing else.
# Weekly, for a tag that moves upstream; and on every pull request that changes a workflow, a
# local action or this check, so a pin whose comment names another release fails before it
# merges. On a pull request an answer the API could not give is a warning, so an API blip
# cannot turn it red; a mismatch fails there too. One API call per release, about thirty.
# See docs/maintainers/ci.md, "Supply chain".
name: Action pins

on:
  schedule:
    # Wednesdays, off the hour and away from the slots the other scheduled workflows hold.
    - cron: "29 6 * * 3"
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - tools/ci/action_pins.py
  workflow_dispatch:

concurrency:
  group: action-pins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sha-matches-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pinned SHA is its release tag's commit
        # The token is here only for the API's rate limit; every call is a GET of a public tag.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci/action_pins.py --unresolved-warns .
          else
            python3 tools/ci/action_pins.py .
          fi
