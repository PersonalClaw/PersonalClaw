# Release — triggered by a version tag (v*). Builds the ONE artifact set every install channel
# projects from (wheel with prebuilt web/dist + multi-arch images + the unsigned Linux desktop
# AppImage/deb + the unsigned macOS dmgs) through release-artifacts.yml, which also smokes each and
# writes their digest-bound manifest, and only then publishes: to PyPI via Trusted Publishing (no
# stored tokens), the images to GHCR from the layouts that were smoked, the GitHub Release, and
# provenance. Publish jobs sit behind the `release` / `release-client` environments
# (owner-approved manual gate). Job ids.
name: Release

on:
  push:
    tags: ["v*"]
  # A dispatch builds the ref it is run on: `artifacts` builds as `$GITHUB_REF_NAME`. On a branch
  # nothing publishes: the build refuses the branch at its first step, `artifacts` fails, and
  # every job that publishes waits on it, while gateway-dashboard and the two desktop builds,
  # which need nothing, run. On a tag it is that tag's release, run with the workflow as it is at
  # the tag. The weekly rehearsal (release-rehearsal.yml) runs all of the build on main instead.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own: an installed Python
  # that is exactly the version asked for wins over a download by default (see breadth.yml's env).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  artifacts:
    # Every artifact, built and smoked, and their manifest (#3911): the wheel and sdist with the
    # wheel's SBOM, the gateway image's dashboard, both images for both arches to OCI layouts,
    # the dmg, the AppImage and the deb. The one copy of the release's build, which the weekly
    # rehearsal runs too. Every job below waits on all of it, so nothing publishes before every
    # artifact has passed. Its files are kept 30 days: as long as the `release` approval may wait.
    uses: ./.github/workflows/release-artifacts.yml
    permissions:
      contents: read
      # Its manifest job reads this run's own job logs: what built each artifact.
      actions: read
    with:
      ref: ${{ github.ref_name }}
      retention-days: 30

  pypi:
    # personalclaw → PyPI via Trusted Publishing. Owner-approved via the `release`
    # environment gate. No stored token (OIDC).
    needs: [artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The client package ships from its own source tree/job — keep only the
      # personalclaw distributions here.
      - name: Keep only personalclaw distributions
        run: |
          find dist -maxdepth 1 -type f ! -name 'personalclaw-*' -delete
          ls -la dist
      # skip-existing: a re-run of an already-published tag no-ops instead of
      # failing on PyPI's no-re-upload rule (idempotent releases).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  pypi-client:
    # personalclaw-client → PyPI, SEPARATE environment (release-client): PyPI's
    # pending-publisher tuple (owner, repo, workflow, environment) must be unique
    # per project, so the two packages use distinct environments (both owner-gated).
    # The client is published; this job is the seam it fills in
    # (it builds + publishes packages/personalclaw-client-py).
    #
    # LOCKSTEP VERSIONING: the client's version always
    # equals core's — bumped in every release-prep commit whether or not the client
    # changed (enforced by tests/test_version_consistency.py). skip-existing is
    # belt-and-suspenders for re-runs of a tag whose client already published:
    # an already-on-PyPI version no-ops instead of failing the job.
    needs: [artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-client
    permissions:
      id-token: write
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv + build the client
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          prune-cache: true
      - name: Build client sdist + wheel
        # uv build, not --system pip: the runner python is PEP-668 externally managed.
        run: |
          uv build packages/personalclaw-client-py --out-dir dist-client
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-client/
          skip-existing: true

  images:
    # Multi-arch GHCR images (amd64 + arm64), pushed from the OCI layouts `artifacts` built, each
    # tag with every digest kept: `skopeo copy --all --preserve-digests` fails rather than change
    # a byte, and each tag must then name the index the manifest records. So what a user pulls is
    # the image that was smoked, and nothing is built here. `artifacts` runs `gateway-dashboard`
    # and both arches' smokes first, so NOTHING is pushed until the image built from this commit
    # is proven to serve a dashboard — `personalclaw-web` included, because
    # `deploy/compose/compose.yaml` pulls both and half a published pair is worse than none.
    # Auth = GITHUB_TOKEN (no extra secret).
    needs: [artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [gateway, web]
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image's layout, as it was smoked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-layout-${{ matrix.name }}
          path: ${{ runner.temp }}/layout
      - name: The image's index, as the manifest records it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-index-${{ matrix.name }}
          path: ${{ runner.temp }}/index
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Which tags this release may MOVE is a property of the tag, not a constant.
      # Stable publishes `:X.Y.Z`, the moving minor `:X.Y` and `:latest`;
      # a prerelease publishes `:X.Y.Z-rc.N` and ONLY `:beta`. The tag list is
      # rendered by the same `scripts/release_tags.py` the tag-parse test asserts,
      # so a `tags:` block can no longer say something the test does not check —
      # the hardcoded `:latest` that used to sit here moved `latest` onto every
      # release candidate. `:X.Y` and `:beta` are the tags `self_update.select_image`
      # resolves for the `stable`/`beta` channels and `docs/guides/containers.md`
      # documents; before this step nothing created them.
      - name: Plan this tag's image tags
        id: imagetags
        env:
          IMAGE: ghcr.io/personalclaw/personalclaw-${{ matrix.name }}
        run: |
          python3 scripts/release_tags.py --ref "$GITHUB_REF_NAME" --image "$IMAGE"
          python3 scripts/release_tags.py --ref "$GITHUB_REF_NAME" --image "$IMAGE" \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Push the layout, every digest kept
        env:
          LAYOUT: ${{ runner.temp }}/layout/personalclaw-${{ matrix.name }}.oci.tar
          INDEX: ${{ runner.temp }}/index/personalclaw-${{ matrix.name }}.index.json
          TAGS: ${{ steps.imagetags.outputs.image_tags }}
        run: |
          set -euo pipefail
          skopeo --version
          # The index's own digest: the one the manifest records, and each tag must name.
          want="sha256:$(sha256sum "$INDEX" | cut -d' ' -f1)"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            skopeo copy --all --preserve-digests "oci-archive:$LAYOUT" "docker://$ref"
            got="sha256:$(skopeo inspect --raw "docker://$ref" | sha256sum | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$ref names $got, not the index that was smoked and recorded, $want"
              exit 1
            fi
            echo "$ref: $got"
          done <<< "$TAGS"

  notes:
    # GitHub Release with notes drawn from CHANGELOG.md for this version. It waits on
    # `artifacts`, so the AppImage, the deb and the dmg attach here and a broken desktop
    # build blocks the release (the images-smoke precedent).
    needs: [artifacts, pypi, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The wheel's SBOM, which `build` keeps out of `dist/` so it never reaches PyPI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-sbom
          path: wheel-sbom/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-sbom-*
          path: image-sboms/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Pattern, not a literal name: `desktop-linux` AND each `desktop-mac-<arch>` land here so
          # the `gh release create ... desktop-dist/*` glob below attaches every desktop
          # installer. Mirrors the image-sbom step above. A literal name silently cut the
          # release without the dmg when desktop-mac was added.
          pattern: desktop-*
          path: desktop-dist/
          merge-multiple: true
      # This version's CHANGELOG section, resolved by `build` (compared as a version).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create GitHub Release
        # The stability flags come from `scripts/release_tags.py` via the build job,
        # not from a shell suffix test. The expression that used to sit here
        # — `[ "$REF" != "${REF%rc*}" ] && echo --prerelease` — only ever recognized
        # `rc`, so `v0.3.0-beta.2` was published as a full, non-prerelease Release and
        # `stable`'s `select_target` then offered it to every user as an upgrade.
        # A stable tag now claims `--latest` explicitly; a prerelease gets
        # `--prerelease` and never `--latest`.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_FLAGS: ${{ needs.artifacts.outputs.gh_release_flags }}
        run: |
          # Unquoted on purpose: GH_RELEASE_FLAGS is a closed set of whole flags
          # (`--latest` | `--prerelease`) from the parser above and MUST word-split.
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* wheel-sbom/* image-sboms/* desktop-dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $GH_RELEASE_FLAGS

  website-follow:
    # A published core release is an OBLIGATION on personalclaw.dev: the website
    # publishes a released version, so its pins and its own version must follow
    # this tag. Nudge that repo's release-follow workflow so the obligation is
    # raised immediately instead of waiting for its daily schedule.
    #
    # Best-effort by design (`continue-on-error`): the website is a separate repo
    # with its own enforcement (a strict parity job on every PR/push plus the daily
    # watchdog), so a missing token or a dispatch hiccup must never fail or hold up
    # a core release. Requires a PAT with `actions: write` on personalclaw.dev in
    # the `WEBSITE_DISPATCH_TOKEN` secret of the `website-follow` environment;
    # without it this logs and moves on.
    #
    # An ENVIRONMENT secret, not a repository one. A repository secret reaches every
    # workflow a branch of this repository runs, a pull request's included; an
    # environment's reaches only a job that names the environment and passes its
    # deployment rule. The maintainer creates `website-follow` with a rule that admits
    # `v*` tags only, so the token is readable by a tag's release run and nothing else.
    needs: [notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: website-follow
    continue-on-error: true
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: Ask personalclaw.dev to re-check release parity
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No WEBSITE_DISPATCH_TOKEN configured — skipping the website nudge."
            echo "personalclaw.dev still catches this via its daily release-follow watchdog."
            exit 0
          fi
          gh workflow run release-follow.yml --repo PersonalClaw/personalclaw.dev \
            || echo "Dispatch failed; the website's daily watchdog will still catch it."

  attest:
    # Build-provenance attestations on the wheel and the sdist (zero key management — GitHub
    # OIDC). It needs only `artifacts`, whose `dist` it attests. It used to need `notes` as well,
    # so when v0.2.0's desktop-linux failed and `notes` was skipped, this was skipped with it,
    # and the wheel PyPI had already published got no build provenance on GitHub.
    needs: [artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
