# PR feedback relay — post CI's remediation into the PR conversation, including fork PRs.
#
# WHY THIS WORKFLOW EXISTS. `ci.yml` runs on `pull_request`, and a `pull_request` run from a
# FORK is handed a read-only GITHUB_TOKEN no matter what its `permissions:` block asks for.
# So the remediation comment could never be posted from inside CI on exactly the PRs that
# needed it. Measured across every fork PR this repo has had — #678, #680, #1210, #1211 —
# zero `lint-help` comments were ever posted, and the only visible signal was a red job.
#
# `workflow_run` fires in the BASE repo's context after CI finishes, where the token is
# genuinely write-capable, so the comment can be posted from here for fork and same-repo
# PRs alike through one path.
#
# SAFETY. This workflow never checks out the PR's code and never runs it. It reads two
# small text files from an artifact CI produced and calls the issues API. The artifact is
# untrusted INPUT: the violations text is inserted inside a fenced block, and the PR number
# is parsed as an integer and rejected unless it is one. Treat any change here that starts
# executing artifact content as a pwn-request and don't make it.
name: PR feedback

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read           # download the artifact from the CI run
  pull-requests: write    # post/update the remediation comment

jobs:
  lint-help:
    # Only a FAILED CI run can carry remediation. A success uploads no artifact, and the
    # download step below would find nothing anyway — this just avoids the pointless run.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download the lint feedback CI left behind
        id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true   # most CI failures are test/web, which upload nothing
        with:
          name: lint-feedback
          path: feedback
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post the remediation
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'feedback';
            if (!fs.existsSync(`${dir}/pr.txt`) || !fs.existsSync(`${dir}/violations.md`)) {
              core.info('no lint feedback in this run — nothing to post');
              return;
            }
            // The artifact is untrusted input. The PR number must be an integer; anything
            // else and we post nowhere rather than guessing at a target.
            const issue_number = Number.parseInt(fs.readFileSync(`${dir}/pr.txt`, 'utf8').trim(), 10);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed('lint-feedback carried no usable PR number');
              return;
            }
            const violations = fs.readFileSync(`${dir}/violations.md`, 'utf8').trim();
            if (!violations) { core.info('empty violations — nothing to post'); return; }

            const marker = '<!-- lint-help -->';
            const body = [
              marker,
              "### `lint` is failing",
              "",
              "Most of this is auto-fixable. From the repo root:",
              "```bash",
              "source .venv/bin/activate   # or: uv sync --extra dev",
              "make format                 # black + isort, rewrites the files",
              "make lint                   # must print no errors before you push",
              "```",
              "Commit the reformatting and push. `make format` handles the `black` and",
              "`isort` sections below. `flake8` and `mypy` findings (a too-long line, an",
              "unused import, a type error) need an edit.",
              "",
              "Run `npm install` once in your clone and the `pre-commit` hook formats staged",
              "Python at commit time, so this stops happening.",
              "",
              "<details><summary>What CI saw</summary>",
              "",
              violations,
              "",
              "</details>",
            ].join("\n");

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
