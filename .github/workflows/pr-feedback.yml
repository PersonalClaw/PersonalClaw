# PR feedback relay — post CI's remediation into the PR conversation, including fork PRs.
#
# WHY THIS WORKFLOW EXISTS. `pr.yml` runs on `pull_request`, and a `pull_request` run from a FORK
# is handed a read-only GITHUB_TOKEN no matter what its `permissions:` block asks for.
# So the remediation comment could never be posted from inside CI on exactly the PRs that
# needed it. Measured across every fork PR this repo has had — #678, #680, #1210, #1211 —
# zero `lint-help` comments were ever posted, and the only visible signal was a red job.
#
# `workflow_run` fires in the BASE repo's context after PR finishes, where the token is
# genuinely write-capable, so the comment can be posted from here for fork and same-repo
# PRs alike through one path. run-job leaves the `lint-feedback` artifact for the catalogue's
# lint_feedback job, static, and pr.yml's stage job uploads it.
#
# SAFETY. This workflow never checks out the PR's code and never runs it. It checks out the
# default branch's copy of `scripts/ci_pr_feedback.mjs` and nothing else, downloads the artifact
# PR produced outside that checkout, and calls the API. The artifact is untrusted INPUT
# (docs/maintainers/ci.md, "Trust boundary"): the pull request comes from the API, as the one
# open pull request whose head is the run's head commit, and the artifact's `pr.txt` is only
# cross-checked against it; the violations text is fenced by the script itself. Treat any change
# here that starts executing artifact content as a pwn-request and don't make it.
name: PR feedback

on:
  workflow_run:
    workflows: ["PR"]
    types: [completed]

# Read-only at the top, so a job added here later holds no write it was never audited for. The
# one write is granted on the job that posts the comment (tools/ci/supply-chain.toml).
permissions:
  contents: read
  actions: read           # download the artifact from the CI run

jobs:
  lint-help:
    # Only a FAILED CI run can carry remediation. A success uploads no artifact, and the
    # download step below would find nothing anyway — this just avoids the pointless run.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A job's `permissions:` replaces the workflow's, so the two reads are named again here.
    permissions:
      contents: read
      actions: read           # download the artifact from the CI run
      pull-requests: write    # post/update the remediation comment
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # The default branch's copy of the relay, and only that file. No `ref:`: under
      # `workflow_run` the default branch is what GitHub checks out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci_pr_feedback.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the lint feedback CI left behind
        id: dl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # most CI failures are test/web, which upload nothing
        with:
          name: lint-feedback
          # Outside the checkout, so nothing the candidate's run wrote sits beside the relay.
          path: ${{ runner.temp }}/feedback
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post the remediation
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FEEDBACK_DIR: ${{ runner.temp }}/feedback
        with:
          script: |
            const { relay } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci_pr_feedback.mjs`);
            await relay({ github, context, core, dir: process.env.FEEDBACK_DIR });
