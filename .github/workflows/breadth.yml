      - name: Upload JUnit results (security corpus, macOS)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-security-corpus-macos
          path: reports/junit-security-corpus-macos.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/security-macos__1.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-security-macos-1
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/security-macos__1.json"

  canary:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg canary/${{ matrix.shard }}
    # The next hosted Ubuntu image, ahead of the move to it: the suite on ubuntu-26.04 and
    # 3.12, run every night. A red is the image's news, not a gate: `continue-on-error`.
    # It differs from the ubuntu-24.04 leg only in image and Python, so pytest keeps its own
    # temporary folders: RUNNER_TEMP is under the runner's home, where the suite's home guard
    # refuses a test's folders and paths print as `~/...`.
    # The label is GitHub's (the runner-images list names it); an actionlint older than it
    # does not know it, and this repository runs none.
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.15"]
        shard: [1, 2, 3, 4]
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      PY: ${{ matrix.python }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
      # setup-uv only names the interpreter (UV_PYTHON); `uv python find` never downloads one.
      # Every step below that runs `uv python find` needs it present, carried shard or not, so
      # a scratch venv is made on it first: that downloads the managed interpreter setup-uv
      # names, as `uv sync` would, and nothing else.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # This shard's test files, from the plan freshness made once for the run.
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files
        id: shard
        run: >-
          "$(uv python find "$PY")" -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg canary --shard ${{ matrix.shard }}/4
          --out "$RUNNER_TEMP/shard.txt"
      - name: this shard's inputs, as its runner reports them
        env:
          SHARD_FILES: ${{ steps.shard.outputs.digest }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)" \
            --external "shard_files=${SHARD_FILES:?no shard list}"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq &&
                   sudo apt-get install -y --no-install-recommends tmux ;;
            macOS) brew install tmux ;;
            *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          tmux -V
      - name: pytest (canary shard ${{ matrix.shard }})
        id: pytest
        continue-on-error: true
        run: uv run pytest -n auto --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-canary.xml
      - name: Upload JUnit results (canary · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-canary-${{ matrix.python }}-shard${{ matrix.shard }}
          path: reports/junit-canary.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/canary__${{ matrix.shard }}.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-canary-${{ matrix.shard }}
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/canary__${{ matrix.shard }}.json"

  install-smoke:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg install-smoke/1
    # ── The front door, finally EXECUTED ────────────────────────────────────────────────────
    # `curl -fsSL https://personalclaw.dev/install | sh` is the first thing a new user runs, and
    # until now NOTHING in CI ran it. `deploy/website/install.sh`'s own header claimed this job
    # already existed (the workflow then named "runs it in a bare ubuntu container weekly").
    # It did not:
    # measured 2026-09-06, this workflow had four jobs — matrix, audit, security-corpus (now `security`),
    # coverage — and grepping .github/workflows/ for `website/install`, `install.sh` or
    # `personalclaw.dev/install` returned nothing. The ninth absent-vs-declared-false in this
    # repo, and the cheapest kind to write: a claim of coverage costs one comment line.
    #
    # THREE LEGS, each its own step so the red NAMES the owner:
    #   · CURRENT CHECKOUT installs the wheel this tree builds and runs the setup a fresh user is
    #     told to run, before the release reaches PyPI. Red = this tree's package or setup broke.
    #   · STAGED is the file we edit. Served-only coverage would let a broken edit sit green
    #     until the website published it, which is the same blind spot in a new costume —
    #     test-what-we-lint is how a one-line installer error once survived three weeks.
    #     Red = we broke the installer.
    #   · SERVED is what users actually get. It is the only leg that can catch a bad wheel on
    #     PyPI, `uv tool install` regressing, or the site serving a file that does not install —
    #     none of which live in this repo, and all of which break the front door.
    #     Red = the site or PyPI regressed.
    #
    # WHETHER THE SERVED BYTES ARE THE RIGHT BYTES is not asked here. The website publishes the
    # installer from the core release it pins, so its own scheduled release-follow check is
    # where the served file is compared with that release's installer. Core main runs ahead of
    # every release: the same comparison here was red between each installer edit and the next
    # website deploy, with nothing wrong on either side.
    #
    # WHY NOT THE PR GATE. The legs reach personalclaw.dev, astral.sh and PyPI. A ≤10-min merge
    # gate that fails when someone else's CDN hiccups trains people to re-run red checks, which
    # is worse than no check. The half that CAN gate every PR is offline and does:
    # tests/test_website_installer.py pins sha256(install.sh) to install.sh.sha256, so editing
    # the installer without updating the pin reds in `lint`/`test` at lint speed. Network here,
    # forcing function there.
    #
    # THE PUBLIC LEGS ARE `!cancelled()`, not fail-fast: "the staged installer is broken" and
    # "the served one-liner is broken" are different pages for different people, and one must
    # not mask the other.
    #
    # A FETCH FAILURE IS `unproven`, NOT A PASS. Skipping, warning, or `continue-on-error` on the
    # served leg would reproduce the defect the whole job answers: this repo has read absence as
    # a negative eight times, most recently a tmux-gated test class that never ran once and
    # whose skip was counted as a pass. An inconclusive run must cost a red.
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # A bare image, deliberately: the one-liner's whole promise is that it works on a machine
    # with nothing on it. A GitHub runner has python, uv-adjacent tooling and a warm PATH, so
    # running there would prove something easier than what we ship.
    # The bare-current-Ubuntu leg: ubuntu:26.04, which `ubuntu:latest` named when this was
    # pinned, as its linux/amd64 manifest (this runner's platform) of index
    # sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7. #4585's
    # scheduled refresh keeps it on the current Ubuntu release, as a reviewed change.
    container: ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794
    # Two `uv tool install`s plus a uv bootstrap. 20 covers a cold PyPI; it must not sit on a
    # runner for the default 360 when a host is black-holing packets.
    timeout-minutes: 20
    env:
      PY: "3.13.16"
    steps:
      - name: Runner identity
        # The container's own system, beside the runner image the job's set-up log names.
        run: |
          . /etc/os-release
          echo "container ${PRETTY_NAME} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # A bare ubuntu image ships neither curl nor CA roots — installing them IS part of asserting the
      # bare-machine claim. A failure here is an infrastructure red before any installer ran, and
      # is legible as such because it is its own step.
      - name: bare-container prerequisites (curl · CA roots)
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13.16"
          prune-cache: true
      # The two public-installer legs below necessarily install the latest published release.
      # This source-tree leg closes the pre-publication gap: install the wheel this checkout
      # builds, remove every system timezone search path, and run the setup command a fresh user
      # is told to run. `TZ` is an authored IANA name here, so persisting it proves zoneinfo
      # loaded the package's Python tzdata fallback rather than an OS database. It names the
      # installer's Python (`PC_PYTHON`) as the installer does: uv ignores the upper bound of
      # requires-python, so a bare install here would build on the newest Python uv downloads.
      - name: smoke — current checkout install + setup timezone
        run: |
          set -eu
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-current"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-current"
          HOME="$RUNNER_TEMP/home-current"
          PERSONALCLAW_HOME="$RUNNER_TEMP/personalclaw-home-current"
          TZ="America/Los_Angeles"
          PYTHONTZPATH=""
          export UV_TOOL_DIR UV_TOOL_BIN_DIR HOME PERSONALCLAW_HOME TZ PYTHONTZPATH
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR" "$HOME" "$PERSONALCLAW_HOME"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          uv tool install --python 3.13 .
          personalclaw setup
          grep -F '"timezone": "America/Los_Angeles"' "$PERSONALCLAW_HOME/config.json"
      # ── Leg 1: the staged file, which is the one we can fix ─────────────────────────────────
      # UV_TOOL_DIR / UV_TOOL_BIN_DIR are redirected into RUNNER_TEMP for two reasons: the smoke
      # must not install over whatever else the job has, and the two legs must not silently
      # satisfy each other — a shared tool dir would let leg 2 pass by finding leg 1's binary.
      # Distinct dirs per leg is what makes the second leg a real second measurement.
      #
      # UV_TOOL_BIN_DIR goes on PATH BEFORE the installer runs so the script's own
      # `have personalclaw` / offer_setup tail is exercised rather than skipped — with no TTY,
      # `[ -t 0 ]` is false, so it must print the non-interactive line and exit 0, never hang.
      - name: smoke — the STAGED installer (deploy/website/install.sh)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-staged"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-staged"
          export UV_TOOL_DIR UV_TOOL_BIN_DIR
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          sh deploy/website/install.sh
          # Installing proves a wheel downloaded. Running it proves the front door opens.
          personalclaw --version
      # ── Leg 2: the actual one-liner, verbatim, as a user pastes it ──────────────────────────
      # Written as the documented `curl … | sh` pipeline on purpose: piping into sh is the thing
      # being asserted (no TTY on stdin, a partial transfer must install nothing). Running the
      # downloaded file as an argument instead would test a path no user takes.
      #
      # `set -o pipefail` is why a 404 or a TLS failure cannot pass: without it the pipeline's
      # status is sh's, and sh happily exits 0 having executed an empty or truncated body — a
      # green check for having installed nothing. That is the exact shape of failure this job
      # exists to end, so it must not be reintroduced by the job itself.
      - name: smoke — the SERVED one-liner (https://personalclaw.dev/install)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          set -o pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-served"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-served"
          export UV_TOOL_DIR UV_TOOL_BIN_DIR
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
                 https://personalclaw.dev/install | sh; then
            echo "::error title=install one-liner unproven::unproven — the served one-liner did" \
                 "not complete. If personalclaw.dev or PyPI is unreachable this run proved" \
                 "NOTHING; it is red rather than green because an unanswered question is not a" \
                 "passing answer. Re-run once reachability is confirmed."
            exit 1
          fi
          personalclaw --version
      # The container has no git, so the tree is freshness's, the one this run checks out. The
      # served installer is hashed from a file a checked curl wrote: a failed read is recorded
      # `unreadable` and the leg goes red, never a digest of nothing. The night is an input:
      # this leg's outside state moves daily, so a later night's green closes its issue and a
      # same-night rerun's green is a flake.
      - name: this leg's inputs (the container image, and the installer served today)
        if: always()
        env:
          TREE: ${{ needs.freshness.outputs.tree }}
          NIGHT: ${{ needs.freshness.outputs.night }}
        run: |
          if curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/served-install.sh" https://personalclaw.dev/install; then
            installer=$(sha256sum "$RUNNER_TEMP/served-install.sh" | cut -d' ' -f1)
          else
            installer=unreadable
          fi
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "${TREE:?freshness named no tree}" \
            --image "ubuntu:26.04" \
            --image-version "sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794" \
            --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" --node none \
            --external "installer_sha256=$installer" --external "night=${NIGHT:?freshness named no night}"
          if [ "$installer" = unreadable ]; then
            echo "::error title=installer unreadable::the served installer could not be read, so this leg's inputs are not known: red"
            exit 1
          fi
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/install-smoke__1.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-install-smoke-1
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/install-smoke__1.json"

  audit:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg audit/1
    # The dependency audit ci.yml's `audit` runs on a pull request (tools/ci/audit.py), every
    # night on main, where a new advisory lands without a commit: red on a tool that did not
    # run and on an unwaived high or critical finding, and that red opens the leg's issue.
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PY: "3.12.15"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pip-audit is not in uv.lock, so it is named as an exact release, and nothing refreshes
      # it yet: moving it is a reviewed edit of this line. A venv of its own, with the project
      # never installed into it, so what it audits is only the exported locks.
      - name: pip-audit, in a venv of its own
        run: |
          uv venv "$RUNNER_TEMP/audit-venv"
          uv pip install --python "$RUNNER_TEMP/audit-venv/bin/python" pip-audit==2.10.1
      - name: audit the graphs core ships
        run: >-
          "$RUNNER_TEMP/audit-venv/bin/python" -m tools.ci audit run
          --pip-audit "$RUNNER_TEMP/audit-venv/bin/python" --work "$RUNNER_TEMP/audit"
      # The advisories the audit reads move daily, so the night is an input: a later night's
      # green closes its issue, and a same-night rerun's green is a flake.
      - name: this leg's inputs, as its runner reports them
        if: always()
        env:
          NIGHT: ${{ needs.freshness.outputs.night }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)" \
            --external "night=${NIGHT:?freshness named no night}"
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/audit__1.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-audit-1
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/audit__1.json"

  report:
    # Last: settles every leg, writes the run's record under its digest, and keeps the leg
    # issues. It writes issues only on main; a dispatch on another ref says what it would do.
    needs: [freshness, ubuntu, macos, rails-macos, collection-parses, arm, coverage-shard, coverage, security, security-macos, canary, install-smoke, audit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write   # one issue per red leg; nothing else
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every shard's entry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: breadth-leg-*
          path: ${{ runner.temp }}/legs
          merge-multiple: true
      - name: settle the legs and write the record
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/breadth_evidence.py report --repo "$GITHUB_REPOSITORY"
          --legs "$RUNNER_TEMP/legs" --run-id "$GITHUB_RUN_ID"
          --tree "$(git rev-parse 'HEAD^{tree}')"
          --record "$RUNNER_TEMP/evidence/record.json"
          --actions "$RUNNER_TEMP/actions.json"
          --ref "$GITHUB_REF" --attempt "$GITHUB_RUN_ATTEMPT"
      # Whatever failed after the record was written, the record is kept: a night's red must
      # reach the chain the next night reads.
      - name: Upload the evidence record, named by its digest
        if: ${{ always() && steps.report.outputs.digest != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-evidence-${{ steps.report.outputs.digest }}
          path: ${{ runner.temp }}/evidence/record.json
          if-no-files-found: error
          retention-days: 90
      - name: open, update or close the leg issues
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.report.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 tools/ci/breadth_evidence.py issues --repo "$GITHUB_REPOSITORY"
          --actions "$RUNNER_TEMP/actions.json" --run-url "$RUN_URL" --digest "$DIGEST"
