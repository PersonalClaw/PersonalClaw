        run: uv run pytest --no-cov -n 2 -q --splits 6 --group ${{ matrix.shard }} --splitting-algorithm least_duration --junitxml=reports/junit-macos.xml
      - name: Upload JUnit results (macos-26-3.12 · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
