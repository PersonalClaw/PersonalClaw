  shard-union:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg shard-union/1
    # #3923: each suite leg's shards together collected that leg's planned suite, each test id
    # once: none missing, none extra, none twice. `shards check` already holds every file to
    # one shard on every run; this is the net under it, at the level of test ids. A shard or a
    # collection that uploaded no ids is red, never absent. It holds the five legs whose red
    # is the run's; the canary's union is `shard-union-canary`, advisory as the canary is.
    needs: [freshness, ubuntu, macos, arm, coverage-shard, planned-ids-ubuntu, planned-ids-macos, planned-ids-arm, planned-ids-coverage-shard, random-order, planned-ids-random-order]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PY: "3.13.16"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
