    name: breadth-leg ubuntu-24.04-arm-3.13/${{ matrix.shard }}
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.16"]
        shard: [1, 2, 3, 4]
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
