          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/security__1.json"

  security-macos:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg security-macos/1
    # The security corpus on macOS, nightly: the same files as `security`, which runs them on
    # Linux. No suite shard collects them (tools/ci/shards.py JOB_OWNED), so without this leg
    # nothing would run them on macOS. It runs 3.13, test-macos's Python, and `security` runs
    # 3.12, so the corpus runs on each Python requires-python allows. Methodology:
    # docs/security/scanner-testing.md.
    # It waits for the macos suite, whose shards hold one macOS runner at a time, instead of
    # taking another beside them; it runs whatever the suite concluded.
    needs: [freshness, macos]
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 25
    # No PERSONALCLAW_HOME — see the matrix job. The corpus writes only to tmp_path.
