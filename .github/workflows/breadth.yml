        run: uv venv "$RUNNER_TEMP/shard-python"
      - name: this shard's inputs, as its runner reports them
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)"
      # A missing id file is the union's red to name; a download that fails outright fails
      # the job, which is red too.
      - name: every shard's and every planned collection's ids
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-ids-*'
          path: ${{ runner.temp }}/ids
          merge-multiple: true
      - name: each leg's shards collected its planned suite, each id once
        id: union
        run: >-
          "$(uv python find "$PY")" -m tools.ci shards union --dir "$RUNNER_TEMP/ids"
