          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13.16"
          enable-cache: true
          prune-cache: true
      # As the macos leg: `uv python find` never downloads, so the managed interpreter is made first.
