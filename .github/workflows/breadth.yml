# Breadth — nightly, and on dispatch. The platforms and checks a pull request's run does not
# cover: other Pythons, arm64, macOS on 3.12, coverage, and the checks that may not be reused.
# A pull request's run (ci.yml) is its tree's one expensive execution, on Ubuntu/3.12 and
# macOS/3.13; this is what is left (#3913).
#
# EVERY RUN WRITES A DIGEST-BOUND EVIDENCE RECORD. Each shard records the exact inputs it ran on
# (the tree, the runner image and its version, the architecture, Python, uv and Node, and any
# external input), and `report` writes one canonical record of every shard, uploaded as
# `breadth-evidence-<sha256 of the record>` and kept 90 days (tools/ci/breadth_evidence.py).
# Whatever relies on a record names it by run id and digest, and a reader refuses a record that
# does not hash to that digest. The release gate reads records, never this run's summary.
#
# ON MAIN, A TREE-KEYED SHARD SKIPS ONLY ON IDENTICAL INPUTS. `freshness` reads the newest record
# on main, verified under its digest, and each shard compares it with its own runner's inputs:
# equal in every one, it carries that result forward, red or green, naming the record; any
# difference, and it runs. A red is never run again on the same inputs to turn it green (#3904).
#
# OFF MAIN NOTHING IS REUSED. On a tag or a release branch no earlier result is read or carried:
# every leg executes on every dispatch, so the record is what that dispatch measured. Within one
# run, a key red on any attempt stays red on a rerun, whatever its inputs, and a release accepts
# a run only when no attempt of it recorded a red. A re-dispatch is a new measurement; whether an
# earlier dispatch of the same commit was red is the release gate's question (#3911).
#
# LEGS THAT MAY NOT BE REUSED RUN EVERY NIGHT: the security corpus, the next-Ubuntu canary, the
# installer smoke and the audit. A TTL, once the catalogue declares one (#3909), is per job.
#
# `report` keeps one issue per red leg (a platform and Python), titled `breadth: <leg> is red`,
# found by that exact title. A green on changed inputs closes it; a green on the inputs the red
# ran on is a flake, recorded red, and the issue stays open with both runs.
name: Breadth

on:
  schedule:
    - cron: "37 9 * * *"  # nightly, off the hour and clear of the other workflows' slots
  # On any ref: the release gate (#3911) dispatches it on a tag's commit.
  workflow_dispatch: {}

# One run per ref at a time, and a run in flight is never cancelled: a later dispatch waits.
concurrency:
  group: breadth-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own. When an installed
  # Python is exactly the version asked for, uv's default preference picks it over a download:
  # the macos-26 image's python.org 3.13.16 at /usr/local/bin was picked that way, sqlite-vec
  # does not load in it, and every vector-index test failed on those legs alone.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  freshness:
    # On main, the newest record on main, verified under its digest, as the map each shard
    # reads; a record that does not verify, or none, is an empty map, and every shard runs. Off
    # main the map is always empty: nothing is reused there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the earlier runs and their record artifacts
    outputs:
      # The tree every job of this run checks out, for a leg whose container has no git.
      tree: ${{ steps.tree.outputs.tree }}
      # The night this run belongs to, from its created_at, which every attempt keeps: a
      # rerun's green on a red's inputs is a flake, whatever its attempt's clock says.
      night: ${{ steps.night.outputs.night }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tree this run checks out
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: the night this run belongs to
        id: night
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          python3 tools/ci/breadth_evidence.py night --created-at "$created"
      # On main, main's earlier runs. Off main none is read: every leg executes.
      - name: the newest earlier record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/breadth_evidence.py previous --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF"
          --out "$RUNNER_TEMP/previous/previous.json"
      - name: Upload the earlier results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-previous
          path: ${{ runner.temp }}/previous/previous.json
          if-no-files-found: error
          retention-days: 1
      # One shard plan for the run (#3923): every suite leg's test files, split into whole-file
      # shards by each file's median first-attempt seconds in the telemetry record of main's
      # three newest collected breadth runs (#3948; tools/ci/shards.py), made once so every shard
      # of a leg reads the same buckets. After the earlier results, so a planning failure never
      # touches reuse. With no record yet, or one that cannot be read, every file weighs the same
      # and the plan is still whole.
      #
      # ON MAIN THE EARLIER PLAN IS KEPT. A shard's list digest is one of its inputs, so a plan
      # made afresh each night, from durations that move a few percent, would hand every shard
      # other files and no tree-keyed shard would ever carry (measured: two green main runs
      # hours apart planned 885-949 of each shard's files differently). So `--keep-from-main`
      # reuses the newest earlier main run's plan for every leg it still plans whole: the same
      # test files in the same N. A changed file set, or no readable earlier plan, plans afresh.
      - name: plan the suite's shards, once for every leg of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then keep="--keep-from-main breadth.yml"; fi
          # shellcheck disable=SC2086 # $keep is two words or none
          python3 -m tools.ci shards plan --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" $keep \
            --leg ubuntu:breadth.yml:junit-ubuntu-:4 \
            --leg macos:breadth.yml:junit-macos-:6 \
            --leg arm:breadth.yml:junit-arm-:4 \
            --leg coverage-shard:breadth.yml:junit-coverage-shard-:6 \
            --leg canary:breadth.yml:junit-canary-:4 \
            --out "$RUNNER_TEMP/shard-plan/plan.json"
      - name: every collectable file is in exactly one shard of each leg
        run: python3 -m tools.ci shards check --plan "$RUNNER_TEMP/shard-plan/plan.json"
      # Kept a week, so the next night's freshness can keep it, however late that run starts.
      - name: Upload the shard plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan/plan.json
          if-no-files-found: error
          retention-days: 7

  ubuntu:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg ubuntu-24.04-3.13/${{ matrix.shard }}
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.16"]
        shard: [1, 2, 3, 4]
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      PY: ${{ matrix.python }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
      # setup-uv only names the interpreter (UV_PYTHON); `uv python find` never downloads one.
      # Every step below that runs `uv python find` needs it present, so
      # a scratch venv is made on it first: that downloads the managed interpreter setup-uv
      # names, as `uv sync` would, and nothing else.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # This shard's test files, from the plan freshness made once for the run: the leg is the
      # job's id and N its matrix size, as the plan names them. Their digest is one of the
      # shard's inputs, so the record names the very files it measured.
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files
        id: shard
        run: >-
          "$(uv python find "$PY")" -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg ubuntu --shard ${{ matrix.shard }}/4
          --out "$RUNNER_TEMP/shard.txt"
      - name: this shard's inputs, as its runner reports them
        env:
          SHARD_FILES: ${{ steps.shard.outputs.digest }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)" \
            --external "shard_files=${SHARD_FILES:?no shard list}"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq &&
                   sudo apt-get install -y --no-install-recommends tmux ;;
            macOS) brew install tmux ;;
            *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          tmux -V
      - name: pytest (shard ${{ matrix.shard }})
        id: pytest
        continue-on-error: true
        run: uv run pytest -n auto --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-ubuntu.xml
      - name: Upload JUnit results (ubuntu-24.04-3.13 · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-ubuntu-${{ matrix.python }}-shard${{ matrix.shard }}
          path: reports/junit-ubuntu.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/ubuntu-24.04-3.13__${{ matrix.shard }}.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-ubuntu-24.04-3.13-${{ matrix.shard }}
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red.
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/ubuntu-24.04-3.13__${{ matrix.shard }}.json"

  macos:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg macos-26-3.12/${{ matrix.shard }}
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.12.15"]
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      PY: ${{ matrix.python }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
      # setup-uv only names the interpreter (UV_PYTHON); `uv python find` never downloads one.
      # Every step below that runs `uv python find` needs it present, so
      # a scratch venv is made on it first: that downloads the managed interpreter setup-uv
      # names, as `uv sync` would, and nothing else.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # This shard's test files, from the plan freshness made once for the run: the leg is the
      # job's id and N its matrix size, as the plan names them. Their digest is one of the
      # shard's inputs, so the record names the very files it measured.
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files
        id: shard
        run: >-
          "$(uv python find "$PY")" -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg macos --shard ${{ matrix.shard }}/6
          --out "$RUNNER_TEMP/shard.txt"
      - name: this shard's inputs, as its runner reports them
        env:
          SHARD_FILES: ${{ steps.shard.outputs.digest }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)" \
            --external "shard_files=${SHARD_FILES:?no shard list}"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq &&
                   sudo apt-get install -y --no-install-recommends tmux ;;
            macOS) brew install tmux ;;
            *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          tmux -V
      - name: pytest (shard ${{ matrix.shard }})
        id: pytest
        continue-on-error: true
        run: uv run pytest -n 2 --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-macos.xml
      - name: Upload JUnit results (macos-26-3.12 · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-macos-${{ matrix.python }}-shard${{ matrix.shard }}
          path: reports/junit-macos.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/macos-26-3.12__${{ matrix.shard }}.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-macos-26-3.12-${{ matrix.shard }}
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red.
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/macos-26-3.12__${{ matrix.shard }}.json"

  rails-macos:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg rails-macos-26-3.12/1
    # The rails (tests/rails, #3928) run once per CI run, on Linux, in ci.yml's `rails` job, and in
    # no suite shard. A rail that depends on the OS (path separators, a case-insensitive file
    # system) would lose macOS coverage with that, so this leg runs the same set on macOS nightly.
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      PY: "3.12.15"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
          prune-cache: true
      # As the macos leg: `uv python find` never downloads, so the managed interpreter is made first.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # Read only on main: off main nothing is reused, and decide reads no map.
      - name: the earlier record's results
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breadth-previous
          path: ${{ runner.temp }}/previous
      - name: this shard's inputs, as its runner reports them
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)"
      # Run, or carry the earlier result when every recorded input matches exactly; a crashed
      # decision leaves the shard to run (see the macos leg).
      - name: run, or carry the earlier result
        id: decide
        continue-on-error: true
        run: >-
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py decide --key "rails-macos-26-3.12/1"
          --inputs "$RUNNER_TEMP/inputs.json"
          --previous "$RUNNER_TEMP/previous/previous.json" --ref "$GITHUB_REF"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --out "$RUNNER_TEMP/entry/rails-macos-26-3.12__1.json"
      - name: Install (locked)
        if: ${{ steps.decide.outputs.run != 'false' }}
        run: uv sync --locked --extra dev
      - name: pytest (every rail, tests/rails)
        id: pytest
        if: ${{ steps.decide.outputs.run != 'false' }}
        continue-on-error: true
        run: uv run pytest -n 2 --dist worksteal -q tests/rails --junitxml=reports/junit-rails-macos.xml
      - name: Upload JUnit results (rails on macos-26-3.12)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-rails-macos
          path: reports/junit-rails-macos.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: ${{ always() && steps.decide.outputs.run != 'false' }}
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/rails-macos-26-3.12__1.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-rails-macos-26-3.12-1
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/rails-macos-26-3.12__1.json"

  collection-parses:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg collection-parses/1
    # #3927: no code of ours parses the source tree while pytest collects. The only parses of it
    # before the source index's warm-up (tests/source_index.py) are pytest's assertion rewrite
    # and Hypothesis's own constants scan, which this leg excuses by module and function. One
    # whole-suite collection in one process, with tests/collection_parse_guard.py counting every
    # ast.parse named as a file under the index's roots, or of a whole .py file under them.
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PY: "3.13.16"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13.16"
          enable-cache: true
          prune-cache: true
      # As the macos leg: `uv python find` never downloads, so the managed interpreter is made first.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # Read only on main: off main nothing is reused, and decide reads no map.
      - name: the earlier record's results
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breadth-previous
          path: ${{ runner.temp }}/previous
      - name: this shard's inputs, as its runner reports them
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)"
      # Run, or carry the earlier result when every recorded input matches exactly; a crashed
      # decision leaves the shard to run (see the macos leg).
      - name: run, or carry the earlier result
        id: decide
        continue-on-error: true
        run: >-
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py decide --key "collection-parses/1"
          --inputs "$RUNNER_TEMP/inputs.json"
          --previous "$RUNNER_TEMP/previous/previous.json" --ref "$GITHUB_REF"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --out "$RUNNER_TEMP/entry/collection-parses__1.json"
      - name: Install (locked)
        if: ${{ steps.decide.outputs.run != 'false' }}
        run: uv sync --locked --extra dev
      - name: pytest (collect the whole suite, counting parses of the source tree)
        id: pytest
        if: ${{ steps.decide.outputs.run != 'false' }}
        continue-on-error: true
        env:
          PYTHONPATH: tests
        run: uv run pytest --collect-only -qq -n0 -p collection_parse_guard tests --junitxml=reports/junit-collection-parses.xml
      - name: Upload JUnit results (collection parses)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-collection-parses
          path: reports/junit-collection-parses.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: ${{ always() && steps.decide.outputs.run != 'false' }}
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/collection-parses__1.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-collection-parses-1
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red, ran or carried: a carried red is still red (#3904).
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/collection-parses__1.json"

  arm:
    # report holds each key to this job's latest attempt, by this name.
    name: breadth-leg ubuntu-24.04-arm-3.13/${{ matrix.shard }}
    needs: [freshness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.16"]
        shard: [1, 2, 3, 4]
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      PY: ${{ matrix.python }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          prune-cache: true
      # setup-uv only names the interpreter (UV_PYTHON); `uv python find` never downloads one.
      # Every step below that runs `uv python find` needs it present, so
      # a scratch venv is made on it first: that downloads the managed interpreter setup-uv
      # names, as `uv sync` would, and nothing else.
      - name: the uv-managed Python this shard runs on
        run: uv venv "$RUNNER_TEMP/shard-python"
      # This shard's test files, from the plan freshness made once for the run: the leg is the
      # job's id and N its matrix size, as the plan names them. Their digest is one of the
      # shard's inputs, so the record names the very files it measured.
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files
        id: shard
        run: >-
          "$(uv python find "$PY")" -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg arm --shard ${{ matrix.shard }}/4
          --out "$RUNNER_TEMP/shard.txt"
      - name: this shard's inputs, as its runner reports them
        env:
          SHARD_FILES: ${{ steps.shard.outputs.digest }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py inputs --out "$RUNNER_TEMP/inputs.json" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --image "$ImageOS" --image-version "$ImageVersion" --arch "$RUNNER_ARCH" \
            --python "$("$(uv python find "$PY")" -c 'import platform; print(platform.python_version())')" \
            --uv "$(uv --version | awk '{print $2}')" \
            --node "$(node --version 2>/dev/null || echo none)" \
            --external "shard_files=${SHARD_FILES:?no shard list}"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq &&
                   sudo apt-get install -y --no-install-recommends tmux ;;
            macOS) brew install tmux ;;
            *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          tmux -V
      - name: pytest (shard ${{ matrix.shard }})
        id: pytest
        continue-on-error: true
        run: uv run pytest -n auto --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-arm.xml
      - name: Upload JUnit results (ubuntu-24.04-arm-3.13 · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-arm-${{ matrix.python }}-shard${{ matrix.shard }}
          path: reports/junit-arm.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: record what this shard ran
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          "$(uv python find "$PY")" tools/ci/breadth_evidence.py ran --inputs "$RUNNER_TEMP/inputs.json" --outcome "$OUTCOME" --attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/entry/ubuntu-24.04-arm-3.13__${{ matrix.shard }}.json"
      - name: Upload this shard's entry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadth-leg-ubuntu-24.04-arm-3.13-${{ matrix.shard }}
          path: ${{ runner.temp }}/entry/
          if-no-files-found: error
          retention-days: 7
      # Red when the entry is red.
      - name: the shard's result
        if: always()
        run: |
          "$(uv python find "$PY")" -c "import json,sys; e=json.load(open(sys.argv[1])); print(e[\"result\"], e.get(\"reused_from\") or \"ran\"); sys.exit(e[\"result\"] != \"success\")" "$RUNNER_TEMP/entry/ubuntu-24.04-arm-3.13__${{ matrix.shard }}.json"

