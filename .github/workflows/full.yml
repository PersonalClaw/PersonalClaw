# Full verification — push to main + nightly cron. The broader matrix + coverage +
# supply-chain audit that the ≤10-min PR gate (ci.yml) deliberately omits.
# Jobs are the stable ids: matrix · audit · coverage.
# Plus security-corpus and install-smoke — the served `curl | sh` front door, whose
# absence deploy/website/install.sh's header had been advertising as present.
name: Full

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch: {}

# ── main's verification must not be cancelled by the next merge (#2946) ───────────────────────
# `cancel-in-progress: true` here meant every merge KILLED the verification run of the commit
# before it. MEASURED 2026-09-18 from the Actions API over this workflow's last 400 runs on main:
# 324 cancelled · 46 failure · 29 success — 81% cancelled. Of the last 40: 38 cancelled, 1
# failure, 1 still queued, ZERO success. The last main run that completed successfully was
# #1215 at 2026-09-17T15:40Z, so the branch every release ships from had gone ~20 hours with no
# completed verification, and nothing said so — a cancelled run carries no `conclusion` a reader
# treats as red, so the gap is invisible to everything that reads a conclusion. The README badge
# (`full.yml?branch=main`, pointed here by #212) was rendering that as "cancelled".
#
# `false` makes this group QUEUE rather than cancel. An in-flight verification of main now always
# runs to completion, so a merge can no longer erase the answer it was computing.
#
# 🪤 WHY NOT A PER-SHA GROUP, which is the obvious way to verify EVERY commit and is wrong here.
# It removes the cap: at today's cadence (main moved 6 times in two hours) it fans a 36-leg
# matrix out per merge, and the runner concurrency this repo actually has is what made ci.yml's
# duplicate runs the binding constraint on merge rate in the first place (#2595). GitHub holds at
# most ONE pending run per concurrency group, so `false` bounds the cost at roughly today's
# level: one in flight, one waiting.
#
# 🪤 WHAT THIS DOES NOT PROMISE. Not every commit on main gets its own completed run. Under a
# fast cadence an intermediate commit is superseded while still QUEUED — no job ever starts, so
# nothing in flight is thrown away and no red is manufactured (see the `matrix` gate below for
# the other half of that). The promise is narrower and is the one "main is verified" needs:
# main's HEAD converges on a COMPLETED run, and no running verification is ever killed. Naming
# which of a batch of merges broke something is bisect's job, not this workflow's.
#
# ── the SCHEDULED verification needs its own lane, or queueing starves it (measured) ──────────
# 🪤 QUEUEING PROTECTS WHATEVER IS ALREADY RUNNING, WHICH UNDER A FAST CADENCE IS NEVER THE
# NIGHTLY. Re-measured 2026-09-18T14:00Z over the last 150 runs on main: 9 success · 16 failure ·
# 124 cancelled, and a completed run takes 40-59 min (median ~55) while main merged every ~6-11
# min across the last 40. That ratio is the whole problem: with one in-flight and one pending
# slot, the pending slot is replaced every ~10 min but only frees every ~55, so the push lane
# cannot converge — of the last 40 runs, 37 cancelled, 2 failed, 1 queued, ZERO green.
#
# Sharing one group made the nightly a casualty of that. `schedule` resolves `github.ref` to
# `refs/heads/main`, so the cron run queued behind the merge stream and was superseded by the
# next push before it ever started. It is the ONE run whose whole purpose is to verify main
# independently of the merge cadence, and it had a ~10-min window to win a slot the pushes hold
# for ~55. So it is keyed on `github.event_name` here: `push` keeps its own serialized lane, and
# `schedule`/`workflow_dispatch` get a lane no merge can evict.
#
# This does not remove the cap the per-SHA note above rejects — it raises it from one in flight
# to at most two, and only while the nightly is actually running. That is the price of having any
# guaranteed completed verification of main at all, and it is why `main` gets a green to read.
concurrency:
  group: full-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own. When an installed
  # Python is exactly the version asked for, uv's default preference picks it over a download:
  # the macos-26 image's python.org 3.13.16 at /usr/local/bin was picked that way, sqlite-vec
  # does not load in it, and every vector-index test failed on those legs alone.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  matrix-shard:
    # Python {3.12, 3.13} × OS {ubuntu, macos} on x86_64, plus two arm64 runners.
    # The arm pair is added via `include` — one job each on
    # the newest supported Python — rather than crossing arm into the full grid:
    # arm is scoped to the non-PR path for budget, so two extra legs prove the
    # arch while four would double this workflow's arm cost for no new signal.
    #
    # ── Sharded 6 ways, same mechanism as ci.yml's `test-shard` ───────────────────────────────
    # Each leg is also split into N=6 disjoint shards (pytest-split `--splits/--group`), so every
    # leg runs ~1/6 of the suite. Beyond wall-clock, this directly attacks #2720: the macOS
    # runners OOM-killed the full-suite step mid-run and truncated the log, and a smaller shard
    # has a proportionally smaller peak RSS and log. The stable `matrix` id
    # is preserved by the aggregation gate job below. This is the main/nightly
    # path (not the PR gate), so the extra jobs cost budget only off the critical path.
    #
    # Why six and not four, MEASURED 2026-10-14: a macOS leg ran its quarter in up to 43 min of
    # pytest on its two workers (run 38644372126), against the 45-min cap below, and the
    # nightlies of 10-13 and 10-14 had six macOS legs cancelled at that cap, one with 92% of its
    # quarter done. A third worker is not the lever: three workers on a quarter peaked at 4.3 GB
    # together (1.9 GB each, measured on an Apple-silicon Mac), too near the 7 GB of a macOS
    # runner. A sixth takes ~29 min there.
    #
    # The arm `include` legs carry an explicit `shard` each (GitHub adds an include entry that
    # omits a base-matrix key as a job with that key UNSET — which would pass `--group` an empty
    # value — so the arm legs are enumerated per shard rather than left to inherit).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.15", "3.13.16"]
        os: [ubuntu-24.04, macos-26]
        shard: [1, 2, 3, 4, 5, 6]
        include:
          # linux arm64 + macOS Apple-silicon. macos-14 is the arm64 image
          # (macos-26 is arm64 too, but naming macos-14 keeps the older image tested here).
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 1 }
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 2 }
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 3 }
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 4 }
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 5 }
          - { python: "3.13.16", os: ubuntu-24.04-arm, shard: 6 }
          - { python: "3.13.16", os: macos-14, shard: 1 }
          - { python: "3.13.16", os: macos-14, shard: 2 }
          - { python: "3.13.16", os: macos-14, shard: 3 }
          - { python: "3.13.16", os: macos-14, shard: 4 }
          - { python: "3.13.16", os: macos-14, shard: 5 }
          - { python: "3.13.16", os: macos-14, shard: 6 }
    runs-on: ${{ matrix.os }}
    # ── Every job here carries a timeout (#3318) ─────────────────────────────────────────────
    # `cancel-in-progress: false` above is deliberate (#2946), so a hung job does not just waste
    # its own slot — it HOLDS the serialized `push` lane, and every later merge queues behind it
    # until GitHub's 360-min default fires. So the bound belongs on the JOB, not on the group:
    # `false` keeps main's verification uncancellable, and these caps keep one wedged job from
    # starving the lane.
    #
    # Each cap must clear the job's OWN measured runtime. `coverage` once ran all of the suite in
    # one job under `--cov` and was the long pole. MEASURED 2026-09-22 (#3326): coverage's only
    # green run took 47.5 min, and it was separately observed wedged past 55 min on run
    # 35689470217 — so 40 was below its floor and killed every push to main. MEASURED
    # 2026-09-28: the suite's runtime grew by about half in five days (each platform's four
    # shards together took 41-68% longer than on 2026-09-23), and run 36427251927's coverage was
    # cancelled at its 70-min cap with 80% of the suite done: about 90 min for the whole job,
    # against 63.6 min on 2026-09-23. Raised to 130, it was outgrown again by 2026-10-13, so it
    # now runs in sixths on runners of its own (`coverage-shard`), capped at 60. This shard cap
    # stays at 45: when a quarter of the suite outgrew it on macOS, the suite was split in sixths
    # (above), not the cap raised.
    timeout-minutes: 45
    # No PERSONALCLAW_HOME — the suite runs under the no-global-home contract; a global
    # value defeats the Path.home()/default-.personalclaw tests (see ci.yml test job).
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      # A runner's Docker, where it has one, is the job's own, so the tests that build images,
      # run containers and start the Compose stack run here (tests/container_runtime.py). A
      # developer's machine runs them only when it sets this too.
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # Same reason as ci.yml's `test` job: the real-daemon tmux leg is skipif-gated on a
      # tmux binary and no stock runner image ships one, so it had been skipping on all six
      # cells here. Installed per-OS rather than apt-only because this matrix spans macOS too;
      # the already-present branch keeps the step a no-op if an image ever starts shipping it.
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq &&
                   sudo apt-get install -y --no-install-recommends tmux ;;
            macOS) brew install tmux ;;
            *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          tmux -V
      - name: pytest (shard ${{ matrix.shard }} of 6)
        # The frontend URL-doctrine + config round-trip tests are part of this suite;
        # named here for legibility in the job summary.
        # #2720: the memory-limited macOS runners OOM-killed this step mid-suite — a
        # varying silent truncation (PASSED stream, then no summary, no assertion, no
        # traceback). The levers, none of which weakens a test:
        #   --no-cov  — coverage is measured once by the dedicated `coverage-shard` legs; the
        #               --cov payload (from addopts) is pure redundant memory here.
        #   -n 2 on macOS — cap xdist workers so peak RSS stays under the runner ceiling.
        #               ubuntu keeps -n auto from addopts.
        #   --splits/--group — each leg now runs ~1/6 of the suite, so peak RSS AND log
        #               size shrink proportionally (the direct cause of the truncation).
        #               `least_duration` splits evenly by count until a `.test_durations`
        #               is committed. -q keeps the per-shard log small.
        #   --junitxml — WHICH test failed, machine-readably (see the upload step below). The
        #               same #2720 truncation that eats the console summary is exactly why the
        #               answer must survive outside the log.
        # This leg proves cross-platform correctness, not coverage or raw speed.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv run pytest --no-cov -n 2 -q --splits 6 --group ${{ matrix.shard }} --splitting-algorithm least_duration --junitxml=reports/junit-matrix.xml
          else
            uv run pytest --no-cov -q --splits 6 --group ${{ matrix.shard }} --splitting-algorithm least_duration --junitxml=reports/junit-matrix.xml
          fi
      # Same argument as ci.yml's `test-shard` upload step: a red must name the failing case
      # without a log read or a blind re-run. This grid is 36 legs, so the artifact NAME carries
      # python × os × shard — artifact names are unique per run, and a fixed one would let 36
      # uploads collide down to whichever finished last. The on-disk filename can stay generic:
      # every leg is its own runner.
      - name: Upload JUnit results (py${{ matrix.python }} · ${{ matrix.os }} · shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-matrix-${{ matrix.python }}-${{ matrix.os }}-shard${{ matrix.shard }}
          path: reports/junit-matrix.xml
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    # ── Aggregation gate carrying the stable `matrix` id ───────────────────────────────────────
    # Green only when every sharded matrix leg passed; a failed leg reports RED rather than
    # skipped, because `fail-fast: false` above means a shard failure never cancels the run.
    # Needs no checkout or toolchain — it only reads the matrix result.
    #
    # 🪤 `!cancelled()`, NOT `always()` — #2946. `always()` runs a job even when the RUN was
    # cancelled, and the step below then turned `result == 'cancelled'` into `exit 1`, publishing
    # a `matrix` FAILURE from a run nobody was waiting for an answer from. That is a verdict
    # manufactured out of the absence of one, and it lands on the same commit as the real answer
    # because check-runs key on the SHA. Under `!cancelled()` a cancelled run reports NO `matrix`
    # verdict at all, which is the honest statement: nothing was measured.
    needs: [matrix-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: every matrix shard passed
        run: |
          result='${{ needs.matrix-shard.result }}'
          # Reachable only when a LEG was cancelled while the run itself lived on. That is an
          # unanswered question on a live run, so it is red — the doctrine install-smoke's legs
          # already state: an inconclusive run must cost a red, never arrive as a green check.
          if [ "$result" = "cancelled" ]; then
            echo "::error title=matrix shards unproven::a matrix leg was cancelled while this run" \
                 "was still live, so this platform grid measured nothing. Re-run."
            exit 1
          fi
          if [ "$result" != "success" ]; then
            echo "::error title=matrix shards failed::the sharded matrix result was '$result'" \
                 "(expected 'success'). Open the red 'matrix-shard (...)' leg(s) above."
            exit 1
          fi
          echo "all matrix shards passed"

  audit:
    # Report-only supply-chain scan — visibility, not a merge gate (substrate, not
    # bureaucracy). Dependabot drives the actual update PRs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
      - name: pip-audit
        # Install into a uv-managed venv, not `--system`: the runner's /usr is
        # PEP-668 externally-managed and uv refuses `--system` there (the whole step
        # then errored out under `bash -e` before pip-audit ever ran, silently
        # disabling the scan). Report-only, so a finding never gates (|| true).
        run: |
          uv venv .venv-audit
          uv pip install --python .venv-audit/bin/python -e . pip-audit
          .venv-audit/bin/python -m pip_audit || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit (root workspace)
        run: npm ci && npm audit || true

  security-corpus:
    # The adversarial scanner corpus (five attack classes + the
    # scanned-bytes==installed-bytes race invariant + the red-on-weakness meta-test).
    # Its own job, not a line in the matrix, so a corpus regression is legible on its
    # own; `-n 0` keeps the integrity-race output readable. Published methodology:
    # docs/security/scanner-testing.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No PERSONALCLAW_HOME — see the matrix job. The corpus writes only to tmp_path.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: pytest (adversarial scanner corpus)
        run: >
          uv run pytest -n 0 --no-cov
          --junitxml=reports/junit-security-corpus.xml
          tests/security
          tests/test_supply_chain_scanner.py
          tests/test_supply_chain_gates.py
      # Same argument as ci.yml's `test-shard` upload step.
      - name: Upload JUnit results (security corpus)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-security-corpus
          path: reports/junit-security-corpus.xml
          if-no-files-found: ignore
          retention-days: 7

  coverage-shard:
    # The whole suite under `--cov`, in six disjoint shards (pytest-split `--splits/--group`, as
    # `matrix-shard` splits it), one runner each. `coverage` below combines their data into the
    # one report.
    #
    # ── Why split (measured 2026-10-14 and 2026-10-15) ──────────────────────────────────────────
    # This was one job running all of the suite: 53,856 tests, 22,658 s of test time on the four
    # workers of `-n auto`. That took 100 min on the faster runners GitHub hands out (run
    # 38566551730), and the slower ones run the same tests ~1.5x slower: runs 38417574194 and
    # 38644372126 were cancelled at the 130-min cap with 85% and 83% of the suite done. So whether
    # `coverage` was green depended on the machine it drew, and its cap had already gone
    # 40 → 70 → 130 as the suite grew (see matrix-shard). In quarters it took 26-48 min a
    # quarter (run 38702123774), too near this cap: splitting by count left one quarter with 60%
    # more test time than another. A sixth takes about two thirds of that.
    #
    # 🪤 IT NEVER HUNG. Read through `gh run view --log`, which stops at the first line too long
    # for it, each of those runs went quiet at 51-53%: at a test id of 359,560 characters, the
    # first of three that carried a whole test file (fixed in
    # tests/test_every_upload_route_scans_what_it_stores.py). The job's own log, read from the
    # API, runs on to the end.
    #
    # No `permissions:` of its own: it runs the suite, third-party packages included, so it holds
    # the workflow's read-only token and publishes nothing but its artifacts.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    # Above a sixth's measured share — see the cap rationale on matrix-shard.
    timeout-minutes: 60
    # No PERSONALCLAW_HOME — see the matrix job / ci.yml test job.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      # A runner's Docker, where it has one, is the job's own, so the tests that build images,
      # run containers and start the Compose stack run here (tests/container_runtime.py). A
      # developer's machine runs them only when it sets this too.
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
      # Each shard's data under a name of its own (pytest-cov combines its workers' into it), so
      # all six land side by side in `coverage`, which combines them.
      COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # The suite's own 120 s a test, as on the plain legs. Not raised here: the Compose stack's
      # test gives its image build what `--timeout` leaves (tests/test_deployment_parity.py), so
      # at 300 s every shard spent 235 s building beside its tests and slowed all of them (run
      # 38737327546). A test that coverage's tracer slows past 120 s gets a mark of its own.
      - name: pytest with coverage (shard ${{ matrix.shard }} of 6)
        run: uv run pytest --cov=personalclaw --splits 6 --group ${{ matrix.shard }} --splitting-algorithm least_duration --junitxml=reports/junit-coverage-shard${{ matrix.shard }}.xml
      # Its OWN upload step, deliberately not folded into the data upload below: that one is
      # `success()`-gated by default (a broken run has no meaningful coverage number), and the
      # whole point of the JUnit report is that it survives the red. Same argument as ci.yml's
      # `test-shard` upload step, and named per shard for matrix-shard's reason.
      - name: Upload JUnit results (coverage shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-coverage-shard${{ matrix.shard }}
          path: reports/junit-coverage-shard${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7
      # A dotfile, so it is uploaded only when asked for by name.
      - name: Upload coverage data (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-shard${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # ── Combines the shards into the one report, and carries the stable `coverage` id ────────
    # Green only when every shard passed, as `matrix` is for `matrix-shard`, and `!cancelled()`
    # for the reason it gives (#2946). It keeps the whole suite's report or none: with a shard red
    # there is no meaningful coverage number, so the steps after the gate do not run.
    needs: [coverage-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: every coverage shard passed
        run: |
          result='${{ needs.coverage-shard.result }}'
          # Reachable only when a shard was cancelled while the run lived on: part of the
          # suite was measured by nothing, so it is red (matrix's doctrine).
          if [ "$result" = "cancelled" ]; then
            echo "::error title=coverage shards unproven::a coverage shard was cancelled while" \
                 "this run was still live, so part of the suite was measured by nothing. Re-run."
            exit 1
          fi
          if [ "$result" != "success" ]; then
            echo "::error title=coverage shards failed::the coverage shards' result was" \
                 "'$result' (expected 'success'). Open the red 'coverage-shard (...)' leg(s) above."
            exit 1
          fi
          echo "all coverage shards passed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Download the coverage data of every shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-shard*
          path: coverage-data/
          merge-multiple: true
      - name: Combine the shards into coverage XML
        run: |
          set -eu
          # All six or no report: a shard's data missing would publish a smaller number as the
          # suite's, with nothing to say part of it was never counted.
          found=$(find coverage-data -name '.coverage.shard*' -type f | wc -l)
          if [ "$found" -ne 6 ]; then
            echo "::error title=coverage data incomplete::found the data of $found of 6 shards."
            exit 1
          fi
          uv run coverage combine coverage-data
          uv run coverage xml -o coverage.xml
          echo "coverage of the whole suite: $(uv run coverage report --format=total)%"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  install-smoke:
    # ── The front door, finally EXECUTED ────────────────────────────────────────────────────
    # `curl -fsSL https://personalclaw.dev/install | sh` is the first thing a new user runs, and
    # until now NOTHING in CI ran it. `deploy/website/install.sh`'s own header claimed this job
    # already existed ("full.yml runs it in a bare ubuntu container weekly"). It did not:
    # measured 2026-09-06, this workflow had four jobs — matrix, audit, security-corpus,
    # coverage — and grepping .github/workflows/ for `website/install`, `install.sh` or
    # `personalclaw.dev/install` returned nothing. The ninth absent-vs-declared-false in this
    # repo, and the cheapest kind to write: a claim of coverage costs one comment line.
    #
    # THREE LEGS, each its own step so the red NAMES the owner:
    #   · CURRENT CHECKOUT installs the wheel this tree builds and runs the setup a fresh user is
    #     told to run, before the release reaches PyPI. Red = this tree's package or setup broke.
    #   · STAGED is the file we edit. Served-only coverage would let a broken edit sit green
    #     until the website published it, which is the same blind spot in a new costume —
    #     test-what-we-lint is how a one-line installer error once survived three weeks.
    #     Red = we broke the installer.
    #   · SERVED is what users actually get. It is the only leg that can catch a bad wheel on
    #     PyPI, `uv tool install` regressing, or the site serving a file that does not install —
    #     none of which live in this repo, and all of which break the front door.
    #     Red = the site or PyPI regressed.
    #
    # WHETHER THE SERVED BYTES ARE THE RIGHT BYTES is not asked here. The website publishes the
    # installer from the core release it pins, so its own scheduled release-follow check is
    # where the served file is compared with that release's installer. Core main runs ahead of
    # every release: the same comparison here was red between each installer edit and the next
    # website deploy, with nothing wrong on either side.
    #
    # WHY NOT THE PR GATE. The legs reach personalclaw.dev, astral.sh and PyPI. A ≤10-min merge
    # gate that fails when someone else's CDN hiccups trains people to re-run red checks, which
    # is worse than no check. The half that CAN gate every PR is offline and does:
    # tests/test_website_installer.py pins sha256(install.sh) to install.sh.sha256, so editing
    # the installer without updating the pin reds in `lint`/`test` at lint speed. Network here,
    # forcing function there.
    #
    # THE PUBLIC LEGS ARE `!cancelled()`, not fail-fast: "the staged installer is broken" and
    # "the served one-liner is broken" are different pages for different people, and one must
    # not mask the other.
    #
    # A FETCH FAILURE IS `unproven`, NOT A PASS. Skipping, warning, or `continue-on-error` on the
    # served leg would reproduce the defect the whole job answers: this repo has read absence as
    # a negative eight times, most recently a tmux-gated test class that never ran once and
    # whose skip was counted as a pass. An inconclusive run must cost a red.
    runs-on: ubuntu-24.04
    # A bare image, deliberately: the one-liner's whole promise is that it works on a machine
    # with nothing on it. A GitHub runner has python, uv-adjacent tooling and a warm PATH, so
    # running there would prove something easier than what we ship.
    # The bare-current-Ubuntu leg: ubuntu:26.04, which `ubuntu:latest` named when this was
    # pinned, as its linux/amd64 manifest (this runner's platform) of index
    # sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7. #4585's
    # scheduled refresh keeps it on the current Ubuntu release, as a reviewed change.
    container: ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794
    # Two `uv tool install`s plus a uv bootstrap. 20 covers a cold PyPI; it must not sit on a
    # runner for the default 360 when a host is black-holing packets.
    timeout-minutes: 20
    steps:
      - name: Runner identity
        # The container's own system, beside the runner image the job's set-up log names.
        run: |
          . /etc/os-release
          echo "container ${PRETTY_NAME} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # A bare ubuntu image ships neither curl nor CA roots — installing them IS part of asserting the
      # bare-machine claim. A failure here is an infrastructure red before any installer ran, and
      # is legible as such because it is its own step.
      - name: bare-container prerequisites (curl · CA roots)
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.13.16"
      # The two public-installer legs below necessarily install the latest published release.
      # This source-tree leg closes the pre-publication gap: install the wheel this checkout
      # builds, remove every system timezone search path, and run the setup command a fresh user
      # is told to run. `TZ` is an authored IANA name here, so persisting it proves zoneinfo
      # loaded the package's Python tzdata fallback rather than an OS database. It names the
      # installer's Python (`PC_PYTHON`) as the installer does: uv ignores the upper bound of
      # requires-python, so a bare install here would build on the newest Python uv downloads.
      - name: smoke — current checkout install + setup timezone
        run: |
          set -eu
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-current"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-current"
          HOME="$RUNNER_TEMP/home-current"
          PERSONALCLAW_HOME="$RUNNER_TEMP/personalclaw-home-current"
          TZ="America/Los_Angeles"
          PYTHONTZPATH=""
          export UV_TOOL_DIR UV_TOOL_BIN_DIR HOME PERSONALCLAW_HOME TZ PYTHONTZPATH
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR" "$HOME" "$PERSONALCLAW_HOME"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          uv tool install --python 3.13 .
          personalclaw setup
          grep -F '"timezone": "America/Los_Angeles"' "$PERSONALCLAW_HOME/config.json"
      # ── Leg 1: the staged file, which is the one we can fix ─────────────────────────────────
      # UV_TOOL_DIR / UV_TOOL_BIN_DIR are redirected into RUNNER_TEMP for two reasons: the smoke
      # must not install over whatever else the job has, and the two legs must not silently
      # satisfy each other — a shared tool dir would let leg 2 pass by finding leg 1's binary.
      # Distinct dirs per leg is what makes the second leg a real second measurement.
      #
      # UV_TOOL_BIN_DIR goes on PATH BEFORE the installer runs so the script's own
      # `have personalclaw` / offer_setup tail is exercised rather than skipped — with no TTY,
      # `[ -t 0 ]` is false, so it must print the non-interactive line and exit 0, never hang.
      - name: smoke — the STAGED installer (deploy/website/install.sh)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-staged"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-staged"
          export UV_TOOL_DIR UV_TOOL_BIN_DIR
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          sh deploy/website/install.sh
          # Installing proves a wheel downloaded. Running it proves the front door opens.
          personalclaw --version
      # ── Leg 2: the actual one-liner, verbatim, as a user pastes it ──────────────────────────
      # Written as the documented `curl … | sh` pipeline on purpose: piping into sh is the thing
      # being asserted (no TTY on stdin, a partial transfer must install nothing). Running the
      # downloaded file as an argument instead would test a path no user takes.
      #
      # `set -o pipefail` is why a 404 or a TLS failure cannot pass: without it the pipeline's
      # status is sh's, and sh happily exits 0 having executed an empty or truncated body — a
      # green check for having installed nothing. That is the exact shape of failure this job
      # exists to end, so it must not be reintroduced by the job itself.
      - name: smoke — the SERVED one-liner (https://personalclaw.dev/install)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          set -o pipefail
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-served"
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-served"
          export UV_TOOL_DIR UV_TOOL_BIN_DIR
          mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
          PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
          if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
                 https://personalclaw.dev/install | sh; then
            echo "::error title=install one-liner unproven::unproven — the served one-liner did" \
                 "not complete. If personalclaw.dev or PyPI is unreachable this run proved" \
                 "NOTHING; it is red rather than green because an unanswered question is not a" \
                 "passing answer. Re-run once reachability is confirmed."
            exit 1
          fi
          personalclaw --version
