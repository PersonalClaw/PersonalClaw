# The release's image tooling, run before a tag needs it.
#
# `release.yml`'s `images` job builds both platforms with three pinned pieces: the QEMU binfmt
# image setup-qemu installs (the arm64 half runs under it), the buildx release and the BuildKit
# image buildx starts. That job runs only on a tag, after `pypi` may already have published, so
# a bad pin would first show as half a release. This job runs the same three pins on a pull
# request that changes them, with nothing to log in to and nothing to push:
# tests/test_ci_supply_chain_contract.py holds its pins equal to release.yml's.
#
# A workflow of its own because its trigger is a path filter: docker-single-container.yml's
# filter would have to name release.yml, and every release.yml change would then pay for that
# workflow's hour-long gateway image build as well.
#
# It builds a two-line image for both platforms and keeps it in BuildKit's cache: the `RUN`
# executes once per platform, the arm64 one under the pinned QEMU, inside the pinned BuildKit.
name: Release image tooling

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-image-tooling.yml
  workflow_dispatch:

# Same branch-keyed dedupe as ci.yml; see the two traps documented in its `concurrency` block.
concurrency:
  group: release-image-tooling-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  pin-smoke:
    runs-on: ubuntu-24.04
    permissions: {}
    # A cold pull of two images and a two-platform build of one `RUN`: about two minutes.
    timeout-minutes: 10
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # These three steps are release.yml's `images` steps, pin for pin.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # tonistiigi/binfmt:qemu-v10.2.3-68, the linux/amd64 manifest (this runner's platform)
          # of index sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          # moby/buildkit:v0.34.0, the linux/amd64 manifest (this runner's platform) of index
          # sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c.
          driver-opts: image=moby/buildkit:v0.34.0@sha256:3eea2ed5d1766c44eb4740853abf56ba85ad40b2c8d4a22e047cbacf15f463c8
      - name: Build a two-platform image (no push)
        # The base is the images' own node:24.21.0-alpine, by its multi-arch index, so each
        # platform pulls its own manifest. No context: the Dockerfile comes from stdin.
        # `cacheonly` keeps the result in BuildKit and nowhere else.
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly - <<'DOCKERFILE'
          FROM mirror.gcr.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          RUN echo "built for $(uname -m)" && node --version
          DOCKERFILE
          docker buildx inspect --bootstrap | grep -E '^(Driver|BuildKit version|Platforms):'
