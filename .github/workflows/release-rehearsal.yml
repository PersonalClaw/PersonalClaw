# Release rehearsal — every release artifact built and smoked each week, and nothing published
# (#3942). A release must never be the first run of any of its checks: v0.2.0's deb check failed
# on a good package the first time it ran, at the tag, and the GitHub Release went out by hand.
#
# It calls release-artifacts.yml, the build half of release.yml, as the tag the tree's own
# version names (pyproject.toml's `version`, as vX.Y.Z), so every job reads the version a release
# of this tree would. It builds the wheel and sdist with their SBOM, both images for both arches
# with their attestations to an OCI layout, the macOS dmg and the Linux AppImage and deb, smokes
# each as the release does, and writes and verifies one digest-bound manifest of them all (#3911
# consumes it). Everything goes up only as a workflow artifact kept 3 days.
#
# It runs on main only: the schedule runs on the default branch, and a dispatch on any other ref is
# refused before anything builds. It holds no permission beyond reading the tree, names no
# environment and passes no secret, so a run from any ref reaches nothing a push to it could not
# (tests/rails/test_release_rehearsal_tree.py holds that).
name: Release rehearsal

on:
  schedule:
    # Monday 06:17 UTC, off the hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  version:
    # The tag a release of this tree would be, from its own version; and main only.
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'PersonalClaw/PersonalClaw' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag this tree's version names
        id: tag
        run: python3 -I tools/ci/rehearsal_ref.py pyproject.toml >> "$GITHUB_OUTPUT"

  artifacts:
    needs: [version]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      retention-days: 3
