# Merge verdict: the controller posts `merge-verdict` on a pull request's head (#3910, #4584).
#
# It runs when a Merge run (merge.yml) completes. GitHub runs a `workflow_run` listener from the
# default branch, so this file and the tools/ci it runs are main's, whatever the candidate
# brings. It never checks out or fetches the candidate: `python -m tools.ci merge-controller
# decide` (tools/ci/merge_controller.py) reads everything through the API by the run's id, both
# trees included, and judges it by main's rules. A run of another workflow named Merge, which a
# candidate can add, a push run and a schedule post nothing. Both jobs' condition reads the
# triggering run's event and branch only to start no runner for a run that can judge no pull
# request's head; it names nothing of the candidate anywhere else.
#
# The verdict is green only when the head is up to date with main, merge.yml's `results` job,
# which judges the run with main's verdict.py, passed on every attempt, and the head's dependency
# review (dependency-review.yml, main's copy) passed (#4585 step 6), and CodeQL analysed the head
# in every language main's analyses name, with no alert of the pull request's own; and, for a head
# that changes a CI definition (tools/ci/trust.py), main's CI contract passed over its
# definitions. Anything else, an answer the API would not give included,
# posts failure, never neutral. A completed Dependency review run, or code scanning's CodeQL
# check, judges its head again from the head's own completed Merge run, so they may finish in any
# order.
#
# A head that changes a CI definition is judged by its own run and by main's CI contract over its
# definitions (#4584 step 4). The `contract` job points the branch `contract-run/<head>` at
# main's tip with the controller App's token and runs main's contract.yml there, which runs
# main's contract rails against the head's tree. The branch is main's tip, so every push trigger
# there is main's alone and its push starts nothing, and the workflow that runs is main's; what
# that run writes to the Actions cache is the branch's, never main's, since it runs the head's
# tools/ci. When it completes, the head is judged again and its verdict posted, and the branch is
# deleted.
#
# The check run is posted with the controller App's token (personalclaw-ci-controller, the one
# App main-protect will name), minted only when there is one to post and handed only to the
# step that posts. Its key is a secret of the `ci-controller` environment, which only main may
# deploy to. The reads use this job's own token, which holds `contents: read` and
# `actions: read`.
#
# ADVISORY. `merge-verdict` is not a required check yet: main-protect names it only once #3915's
# flip is live and posted verdicts have matched their pull requests' real results (#3910's plan,
# piece 5). See docs/maintainers/ci.md, "The merge controller's poster".
name: Merge verdict

on:
  # A Merge run is judged. A Dependency review run, GitHub's dynamic CodeQL workflow (matched by
  # its run's path, never its name), or a Contract run (by its path and branch) judges its head
  # again. The contract job's own dispatch uses the job's token, whose events start no workflow,
  # so that run's completion raises nothing here; one a person runs again does.
  workflow_run:
    workflows: ["Merge", "Dependency review", "CodeQL", "Contract"]
    types: [completed]
  # Code scanning's CodeQL check, completed, wakes the poster to judge its head again; its
  # conclusion is never read. The job skips every other check run without a runner.
  check_run:
    types: [completed]
  # Every ten minutes: judge again the open pull requests whose newest verdict is a red that still
  # waits, on CodeQL to finish or to process or on the head's contract run to report, posting
  # only what changed and deleting the contract branch of each head judged. GitHub fires it far
  # less often (7 of 144 in the 24 hours to 2026-10-25 09:47 UTC), so every other run also
  # judges again the few oldest waiting heads.
  schedule:
    - cron: "*/10 * * * *"

# One post per Merge run and attempt, never cancelled: each run's verdict is its own check run,
# and verify-check-run reads the newest.
concurrency:
  group: merge-verdict-run-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-check-${{ github.event.check_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    # Only what can judge a pull request's head takes a runner: the sweep; a completed dispatch
    # off main (a contract run, a dispatch proof); and, once merge.yml runs on pull requests
    # (MERGE_VERDICT_LIVE, which #3915's flip sets to 'true'), code scanning's CodeQL check and a
    # completed run of a pull request (its own, its dependency review, or CodeQL's on
    # refs/pull/*). A push, a dispatch on main, CodeQL on main and any other check run start no
    # runner. decide checks each again through the API, which is the gate: this only spares the
    # queue (#3910).
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch != 'main')
      || (vars.MERGE_VERDICT_LIVE == 'true'
      && ((github.event_name == 'check_run'
      && github.event.check_run.app.id == 57789 && github.event.check_run.name == 'CodeQL')
      || (github.event_name == 'workflow_run'
      && (github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'pull_request_target'
      || (github.event.workflow_run.event == 'dynamic'
      && startsWith(github.event.workflow_run.head_branch, 'refs/pull/'))))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ci-controller
    permissions:
      contents: read          # main's tip, both trees and the comparison
      actions: read           # the run, every attempt's jobs and the run's artifact digests
      security-events: read   # CodeQL's analyses on main and the open alerts on main and the head
    outputs:
      dispatch: ${{ steps.decide.outputs.dispatch }}
      base: ${{ steps.decide.outputs.base }}
      cleanup: ${{ steps.decide.outputs.cleanup }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # Main's tools/ci, run on the image's python3: standard-library Python, nothing installed.
      # No `ref:`: under `workflow_run` GitHub checks out the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: decide the verdict from the API
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CHECK_RUN_ID: ${{ github.event.check_run.id }}
          APP_ID: ${{ vars.CONTROLLER_APP_ID }}
        run: |
          set -euo pipefail
          # Whatever woke it, the run also judges again a few heads whose red still waits: the
          # schedule fires far less often than its cron says.
          if [ -n "$RUN_ID" ]; then
            which=(--run-id "$RUN_ID")
          elif [ -n "$CHECK_RUN_ID" ]; then
            which=(--check-run-id "$CHECK_RUN_ID")
          else
            which=(--waiting)
          fi
          python3 -m tools.ci merge-controller decide --repo "$GITHUB_REPOSITORY" "${which[@]}" \
            --controller-app-id "$APP_ID" \
            --controller-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/merge-verdict.json"
      - name: the controller's token
        id: controller
        if: steps.decide.outputs.post == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CONTROLLER_APP_ID }}
          private-key: ${{ secrets.CONTROLLER_APP_KEY }}
          permission-checks: write
      - name: post merge-verdict
        if: steps.decide.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ steps.controller.outputs.token }}
        run: |
          set -euo pipefail
          python3 -m tools.ci merge-controller post --repo "$GITHUB_REPOSITORY" \
            --body "$RUNNER_TEMP/merge-verdict.json"

  contract:
    # A head that changes a CI definition: point its contract branch at main's tip and run main's
    # contract.yml there. Before that, delete the contract branches of judged heads and any no
    # longer at main's tip, and trusted-run branches the old path left.
    needs: post
    if: >-
      (github.event_name == 'schedule'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch != 'main')
      || (vars.MERGE_VERDICT_LIVE == 'true'
      && ((github.event_name == 'check_run'
      && github.event.check_run.app.id == 57789 && github.event.check_run.name == 'CodeQL')
      || (github.event_name == 'workflow_run'
      && (github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'pull_request_target'
      || (github.event.workflow_run.event == 'dynamic'
      && startsWith(github.event.workflow_run.head_branch, 'refs/pull/')))))))
      && (needs.post.outputs.dispatch != '' || needs.post.outputs.cleanup != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ci-controller
    permissions:
      contents: read   # main's tip
      actions: write   # dispatch main's contract.yml on the contract branch
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # Main's tools/ci again, from the default branch, with no credential kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the controller's token
        id: controller
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CONTROLLER_APP_ID }}
          private-key: ${{ secrets.CONTROLLER_APP_KEY }}
          permission-contents: write
      - name: delete judged and stale contract branches, then point the head's at main's tip
        id: tree
        env:
          GH_TOKEN: ${{ steps.controller.outputs.token }}
          HEAD_SHA: ${{ needs.post.outputs.dispatch }}
          BASE: ${{ needs.post.outputs.base }}
          CLEANUP: ${{ needs.post.outputs.cleanup }}
        run: |
          set -euo pipefail
          # The judged and stale branches first, then the new one, so a sweep never takes the
          # branch this run is about to use.
          if [ -n "$CLEANUP" ]; then
            gone=()
            for branch in $CLEANUP; do gone+=(--branch "$branch"); done
            python3 -m tools.ci merge-controller cleanup --repo "$GITHUB_REPOSITORY" "${gone[@]}"
          fi
          if [ -n "$HEAD_SHA" ]; then
            python3 -m tools.ci merge-controller contract-branch --repo "$GITHUB_REPOSITORY" \
              --head "$HEAD_SHA" --base "$BASE"
          fi
      - name: run main's contract.yml on it
        if: steps.tree.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.tree.outputs.branch }}
        run: |
          set -euo pipefail
          python3 -m tools.ci merge-controller dispatch --repo "$GITHUB_REPOSITORY" --branch "$BRANCH"
