# PR — the change tier's fast feedback on one candidate (#3915).
#
# THE SAME SHAPE AS merge.yml: PLAN, TEST, RESULTS. `changes` plans the change tier with main's
# planner (tools/ci/plan.py) and prints the plan as a job matrix: one entry per planned catalogue
# job and shard. Each entry runs as ONE command, `python -m tools.ci run-job <id> [--shard i/N]`,
# after the setup action (.github/actions/setup), so the catalogue (tools/ci/catalogue.toml) is
# what runs, token for token. The change tier's jobs wait for no other job's output, so they are
# all `test`'s. Each entry uploads its job's record under the name tools/ci/verdict.py's
# record_artifact gives it, and `results` judges the plan's keys against those records with
# main's verdict.py. A planned entry with no record, a cancelled, skipped or red one, a record of
# another head, run or later attempt or of another partner head than the one `changes` read, and
# a failed job of this run each read red.
#
# ON EVERY PULL REQUEST, AND ON DISPATCH. This carries no push stage: the checks a push to main
# runs whatever its tree (the tree check, the security corpus, apps-contract) are merge.yml's to
# hold, never the feedback tier's. Its result posts no check of its own, and `merge-verdict` is
# the trusted controller's alone (#3910).
#
# The run's records are kept 30 days: the controller reads them at merge, after the run.
#
# The CI contract table (tests/rails/test_ci_contract.py) holds this file to the shape, as it
# holds merge.yml. See docs/maintainers/ci.md, "The tier workflows".
name: PR

on:
  pull_request: {}
  workflow_dispatch: {}

# One run per pull request at a time: a newer push to it cancels the older run, whose records
# name the older head, which the verdict reads as stale. A dispatch runs one commit, and a run of
# it in flight is never cancelled: a later dispatch of the same commit waits. The workflow's name
# is in the key, so this never cancels merge.yml.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own: an installed Python
  # that is exactly the version asked for wins over a download by default (see breadth.yml's env).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  merge-verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo green
  changes:
    # ── The plan ────────────────────────────────────────────────────────────────────────────
    # The changed paths are what this commit changed against main's tip. The planner and its
    # rules are main's, archived from main's tip into a folder of their own, never this
    # checkout's (merge.yml's push stage reads a push's at the commit it replaced, `JUDGE`, which
    # this workflow, with no push stage, leaves empty). Only the keys and the stage job's matrix are
    # published, each read back first; an answer that is not a plan publishes nothing and fails
    # the job, so `results` reads an empty plan and a failed job, red. Main's check of the
    # catalogue stands in front of merge.yml's verdict, the tier a merge counts.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # main's recent CI runs and their telemetry, for the rails floor
    outputs:
      keys: ${{ steps.plan.outputs.keys }}
      key-partners: ${{ steps.plan.outputs.key-partners }}
      apps-partner: ${{ steps.partners.outputs.apps-partner }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # Depth 1 deliberately: the planner reads a path LIST and the catalogue, never history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The partner head the run tests against, read once here: every entry that reads the apps
      # repository checks out this commit, and `results` judges each record's partners against
      # it, so no entry tests a partner head the run did not name. A head that cannot be read
      # fails this job, which `results` reads in `needs`, so the verdict is red.
      - name: the partner heads the run tests against
        id: partners
        run: |
          set -uo pipefail
          apps=$(git ls-remote https://github.com/PersonalClaw/PersonalClawApps refs/heads/main | cut -f1) || apps=""
          if ! [[ "$apps" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=no partner::the apps repository's main could not be read, so no entry can check it out and the verdict is red. Re-run the job."
            exit 1
          fi
          echo "apps-partner=$apps" | tee -a "$GITHUB_OUTPUT"
      - name: plan the tier with main's planner, as a matrix per stage job
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          TIER: change
          STAGE_JOBS: test
          PUSH_PLAN: ""
          JUDGE: ""
        run: |
          set -uo pipefail
          listed="$RUNNER_TEMP/changed.json"
          changed="$RUNNER_TEMP/changed.txt"
          # Each name as a JSON string on a line of its own, so a name with a newline in it stays
          # one name. A failed enumeration is the empty list, which plans the whole tier.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" \
            --jq '.files[].filename | @json' > "$listed" || : > "$listed"
          python3 -c 'import json, sys; names = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]; assert all(isinstance(n, str) and "\0" not in n for n in names); sys.stdout.write("".join(n + "\0" for n in names))' "$listed" > "$changed" || : > "$changed"
          echo "enumerated $(tr -cd '\000' < "$changed" | wc -c) changed path(s)"
          judge="$RUNNER_TEMP/judge"
          if ! { rm -rf "$judge" && mkdir -p "$judge" \
                 && git fetch --no-tags --depth=1 origin "${JUDGE:-refs/heads/main}" \
                 && git archive FETCH_HEAD tools/ci | tar -x -C "$judge"; }; then
            echo "::error title=no plan::main's tools/ci could not be fetched, so nothing is planned and the verdict is red. Re-run the job."
            exit 1
          fi
          # A push to main plans by the tree check's answer, read in PUSH_PLAN: the jobs every push
          # runs when a pull request's run tested the tree, the whole tier when none did. Any other
          # run plans what it changed.
          case "$PUSH_PLAN" in
            "") mode="" ;;
            tested) mode="--tested" ;;
            full) mode="--full" ;;
            *)
              echo "::error title=no plan::PUSH_PLAN is '$PUSH_PLAN', which is no push plan, so nothing is planned and the verdict is red."
              exit 1
              ;;
          esac
          : > "$RUNNER_TEMP/plan.err"
          answer=$(cd "$judge" && python3 -m tools.ci plan "$TIER" \
                     --catalogue "$GITHUB_WORKSPACE/tools/ci/catalogue.toml" \
                     --trusted-areas "$judge/tools/ci/areas.toml" \
                     --root "$GITHUB_WORKSPACE" --paths "$changed" -z \
                     --repo "$GITHUB_REPOSITORY" --outputs --matrix ${mode:+"$mode"} \
                     2> "$RUNNER_TEMP/plan.err") || answer=""
          cat "$RUNNER_TEMP/plan.err" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^::warning[ :]/p' "$RUNNER_TEMP/plan.err"
          printf '%s\n' "$answer" > "$RUNNER_TEMP/answer.txt"
          # Published: the keys, and each stage job's matrix, read back as JSON. Refused: no
          # keys, a line twice, a stage job this workflow does not run, an entry in a container
          # or with a slug no artifact name can hold, and stage jobs that run other entries than
          # the keys name.
          if ! python3 -I - "$RUNNER_TEMP/answer.txt" "$STAGE_JOBS" > "$RUNNER_TEMP/published.txt" <<'EOF'
          import json, re, sys
          lines = {}
          for line in open(sys.argv[1], encoding="utf-8").read().splitlines():
              name, sep, value = line.partition("=")
              if not sep or name in lines:
                  sys.exit(f"not one line per output: {line[:80]!r}")
              lines[name] = value
          keys = json.loads(lines.pop("keys", "null"))
          if not isinstance(keys, list) or not keys or not all(isinstance(k, str) and k for k in keys):
              sys.exit("no plan: the keys are not a list of job keys")
          partners = json.loads(lines.pop("key-partners", "null"))
          if not isinstance(partners, dict) or list(partners) != keys or not all(isinstance(v, list) and all(isinstance(n, str) and n for n in v) for v in partners.values()):
              sys.exit("no plan: the key partners are not each key's list of partner names")
          runs = sys.argv[2].split()
          extra = sorted(set(lines) - {"full", "jobs", "matrix"} - {f"matrix-{job}" for job in runs})
          if extra:
              sys.exit(f"the plan has stage jobs this workflow does not run: {extra}")
          ran = []
          for job in runs:
              if f"matrix-{job}" not in lines:
                  continue
              grid = json.loads(lines[f"matrix-{job}"])
              if not isinstance(grid, dict) or list(grid) != ["include"] or not grid["include"]:
                  sys.exit(f"{job}: not a matrix of entries")
              for entry in grid["include"]:
                  if entry["container"] or not re.fullmatch("[a-z0-9-]+", entry["slug"]):
                      sys.exit(f"{job}: an entry this workflow cannot run: {entry['key']!r}")
                  ran.append(entry["key"])
              print(f"{job}={json.dumps(grid, separators=(',', ':'), sort_keys=True)}")
          if sorted(ran) != sorted(keys):
              sys.exit("the stage jobs run other entries than the plan's keys")
          print(f"keys={json.dumps(keys, separators=(',', ':'))}")
          print(f"key-partners={json.dumps(partners, separators=(',', ':'))}")
          EOF
          then
            echo "::error title=no plan::the planner answered no plan this workflow can run, so nothing runs and the verdict is red. The lines above, and the summary, say why."
            exit 1
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/published.txt"

  test:
    # ── Every entry: the change tier's jobs wait for no other job's output ───────────────────
    # The same steps as each stage job of merge.yml: the setup action, then the entry's one
    # run-job line, then its record, its reports and any output a later entry reads. Skipped
    # when the plan gives it no entry.
    name: ${{ matrix.key }}
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.test != '' }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test) }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # The whole history for an entry that diffs against a base, which run-job reads as the
      # merge-base with origin/main; one commit for every other.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.history && '0' || '1' }}
      - name: the partner checkout the entry reads (apps-partner)
        if: ${{ contains(matrix.external, 'apps-partner') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PersonalClaw/PersonalClawApps
          ref: ${{ needs.changes.outputs.apps-partner }}
          path: .ci-apps
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          node: ${{ matrix.node }}
          programs: ${{ join(matrix.programs, ' ') }}
      - name: the shard plan this run made
        if: ${{ contains(matrix.external, 'shard-history') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: the dashboard web-build built (web-dist)
        if: ${{ contains(matrix.after, 'web-build') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: every browser leg's blob report
        if: ${{ contains(matrix.after, 'e2e-shard') || contains(matrix.after, 'e2e-pinned') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: web/blob-report
      - name: the entry's catalogue job, through run-job
        env:
          JOB: ${{ matrix.id }}
          SHARD: ${{ matrix.shard }}
        run: python3 -m tools.ci run-job "$JOB" ${SHARD:+--shard "$SHARD"} --out "$RUNNER_TEMP/run-job"
      - name: Upload the entry's record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-job/records/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the entry's reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.slug }}-${{ github.run_attempt }}
          path: |
            reports/
            web/e2e-report*.json
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      # A lint_feedback entry's remediation (static's), which run-job leaves only when a step
      # failed on a pull request: pr-feedback.yml posts it from the base repository, as data.
      # A rerun's replaces the attempt before it.
      - name: Upload the entry's lint feedback
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-feedback
          path: ${{ runner.temp }}/run-job/feedback/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      # The run's one vite build, stamped, which package and the browser legs read.
      # `include-hidden-files`: the stamp is web/dist/.build-inputs.json.
      - name: Upload the build (web-dist)
        if: ${{ matrix.id == 'web-build' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Upload the leg's blob report
        if: ${{ always() && (matrix.id == 'e2e-shard' || matrix.id == 'e2e-pinned') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.slug }}
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  results:
    # ── The run's verdict, by main's verdict.py ─────────────────────────────────────────────
    # It runs whatever ran before it unless the run itself was cancelled (`!cancelled()`), so a
    # cancelled or failed job, or a stage that never started, is read rather than leaving no
    # verdict, and a cancelled run publishes none (#2946). Main's copy of tools/ci/verdict.py,
    # read from the API, judges the plan's keys against the records this run's entries uploaded
    # and against `needs`; this checkout's copy never judges itself. `JUDGE` is empty here, as
    # PUSH_PLAN is: merge.yml's push stage sets it to the commit a push replaced, and the step's
    # text is merge.yml's word for word. It is standard-library
    # Python, run under `python3 -I`, so nothing this run brings is installed or imported.
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # main's tools/ci/verdict.py, read from the API
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # One folder per artifact, as the verdict reads them.
      - name: every entry's record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-record-*
          path: ${{ runner.temp }}/records
      # merge.yml's verdict step, word for word but for JUDGE, which only merge.yml's push stage
      # sets. Only merge.yml's push to main writes the superseded proof it reads.
      - name: the verdict over the plan's keys and the run's records
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          KEYS: ${{ needs.changes.outputs.keys }}
          KEY_PARTNERS: ${{ needs.changes.outputs.key-partners }}
          APPS_PARTNER: ${{ needs.changes.outputs.apps-partner }}
          HEAD_SHA: ${{ github.sha }}
          JUDGE: ""
        run: |
          set -u
          judge="$RUNNER_TEMP/verdict.py"
          if ! gh api -H "Accept: application/vnd.github.raw" \
               "repos/${GITHUB_REPOSITORY}/contents/tools/ci/verdict.py?ref=${JUDGE:-main}" > "$judge"; then
            echo "::error title=no verdict::main's tools/ci/verdict.py could not be read, so nothing judged this run. Re-run the job."
            exit 1
          fi
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          printf '%s' "${KEYS:-[]}" > "$RUNNER_TEMP/keys.json"
          printf '%s' "${KEY_PARTNERS:-"{}"}" > "$RUNNER_TEMP/key-partners.json"
          mkdir -p "$RUNNER_TEMP/records"
          proof=""
          if [ -f "$RUNNER_TEMP/superseded.json" ]; then
            proof="$RUNNER_TEMP/superseded.json"
          fi
          python3 -I "$judge" --plan "$RUNNER_TEMP/keys.json" --needs "$RUNNER_TEMP/needs.json" \
            --head "$HEAD_SHA" --partner "apps-partner=$APPS_PARTNER" \
            --run-head "$HEAD_SHA" --records "$RUNNER_TEMP/records" \
            --key-partners "$RUNNER_TEMP/key-partners.json" \
            ${proof:+--superseded "$proof"} \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
