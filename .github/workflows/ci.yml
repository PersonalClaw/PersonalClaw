# CI — every pull request, and every push to main.
# Jobs are stable ids that tests in this repo reference:
# lint · test · web · rails · harness · client. Platform breadth (other Pythons, arm64,
# coverage, the installer smoke, the audit) is breadth.yml's, nightly.
#
# A PUSH TO MAIN REPEATS NO WORK ITS PULL REQUEST DID ON THE SAME TREE. `tree-check` asks
# whether a green pull-request run already tested the tree the push lands
# (tools/ci/tree_tested.py, the previous main commit's copy). Yes: every job that run did is
# skipped, and only the always-run set runs — `tree-check`, `changes`, `security`,
# `browse-live`, and `apps-contract` when the plan names it. No, or no answer: every job runs on
# the pushed tree, `test-macos` included. The suite's shards are the one exception: during a
# burst of merges a newer push's waiting shard can replace this one's (see the concurrency
# header below).
#
# The `changes` job plans the run from the diff with main's planner (tools/ci/plan.py, #3945):
# the browser-driven `e2e` jobs and `apps-contract` run only when the plan names them, so a diff
# that cannot reach a rendered pixel does not pay for a Chromium. See that job's header for why
# an unread plan runs them.
#
# TWO SIBLING WORKFLOWS EXIST BECAUSE THIS ONE CANNOT TALK TO A FORK PR.
#   dco.yml          pull_request_target — so sign-off is checked without a maintainer first
#                    approving the run, which is exactly when sign-off tends to be missing.
#   pr-feedback.yml  workflow_run — posts this workflow's lint remediation into the PR. A
#                    `pull_request` run from a fork gets a READ-ONLY token whatever its
#                    `permissions:` asks for, so CI cannot comment on a fork PR itself.
#
# Fork PRs from accounts that are not brand new to GitHub run without approval
# (repo setting `fork-pr-contributor-approval: first_time_contributors_new_to_github`).
# An account created days ago is still gated, so dco.yml + pr-feedback.yml are what a
# brand-new contributor hears from first. pr-feedback.yml takes the PR it comments on from
# the API, never from this workflow's artifact (docs/maintainers/ci.md, "Trust boundary").
name: CI

on:
  pull_request:
  push:
    # Main only. A pull request's run is its candidate's check; a push run on the same feature
    # branch only duplicated it, and the shared group below cancelled one of the two (#3915).
    # A branch with no pull request gets no run here. A tag is not a branch: tags are
    # release.yml's.
    branches: [main]

# Off main, one in-flight run per pull request's head BRANCH: a new push to it cancels the
# superseded run. Only `pull_request` runs land here off main, since the push trigger above
# admits main alone (#3915); until then the same key also collapsed a branch's `push` run onto
# its `pull_request` run, which is the history the two traps below record.
#
# 🪤 WHY NOT `github.ref`, which this keyed on until #2595. Under `pull_request` that is
# `refs/pull/<n>/merge`; under `push` it is `refs/heads/<branch>`. Two different strings → two
# different groups → the two triggers never deduped, and every non-fork PR ran the entire
# matrix TWICE, concurrently, on the identical head SHA. Measured 2026-09-07 from the Actions
# API: 8 live branches, 16 CI runs, 9 jobs each — ~72 jobs in flight to answer 8 PRs' worth of
# questions, with runner concurrency in the 4–6 range and `test` at ~45 min. That made this the
# binding constraint on merge rate. The comment here used to claim "no wasted runner time",
# which was true per-trigger and false as the claim it was making.
#
# 🪤 AND WHY NOT THE HEAD SHA, which is the obvious fix and is wrong. Keying on the SHA does
# dedupe the two triggers, but it puts every commit in its OWN group, so pushing three times
# leaves three live runs instead of cancelling the two superseded ones. That trades this bug for
# the exact waste the guardrail exists to prevent. The branch is the only key that does both
# jobs at once.
#
# The head REPO qualifies the key so that two forks which each push a branch named `patch-1` do
# not cancel one another. For a same-repo PR it equals `github.repository`, and `github.head_ref`
# equals `github.ref_name`, so a branch's runs share one key whichever field a run fills in.
#
# ON MAIN, ONE GROUP PER COMMIT, AND NOTHING IS CANCELLED. A push to main is that commit's
# check, and for a tree no pull-request run tested it is the only execution that tree gets.
# A per-branch group with `cancel-in-progress: false` is still not enough: GitHub keeps one
# PENDING run per group and replaces it with the next, so under a fast merge cadence an
# untested merge's run could be dropped before it started, and nothing would ever check that
# tree. Keyed on the commit, every push to main gets its own run. A tested push is a few
# minutes of the always-run set, so a group per commit costs little.
#
# THE SUITE ON MAIN IS THE EXCEPTION (decision 9 of #3915). `test-shard` and `test-macos` each
# join a group of their own per shard, shared by every first-attempt push to main, with
# cancel-in-progress false. A running shard is never cancelled, and while it runs the next
# shard to join waits; a later request's waiting shard replaces the one before it. So a burst of
# merges usually runs the suite once on its newest commit instead of once per commit. The group
# replaces by order of joining, not by commit: an older push whose tree-check or shard-plan ran
# slower can evict the newest commit's waiting shard, which then reads "unproven" (red, fail
# closed) until it is re-run. A commit whose shard was replaced is not verified on its own:
# its gate (`test`, or `test-macos-gate`) reds it as "superseded by <newer commit>" when the API
# proves it (tools/ci/superseded.py), "unproven" otherwise. No release gate reads CI yet: until
# #3911 lands, the release runbook tags only a commit whose own main-push run was green. A re-run
# keeps its run
# id, so on main it keys on its own commit instead and cannot replace the tip's waiting shard.
# On a pull request the same groups key on the head repository and branch, as the group below
# does, so they add nothing there.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Every uv step uses a uv-managed CPython, never the runner image's own: an installed Python
  # that is exactly the version asked for wins over a download by default (see breadth.yml's env).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  tree-check:
    # ── Did a green pull-request run already test this tree? (#3913) ──────────────────────
    # Answers `tested=true|false` for a push to main, and `false` at once for anything else.
    # The check is the PREVIOUS main commit's copy of tools/ci/tree_tested.py, read from the
    # API at `github.event.before`, never this checkout's: a pull request that edits the
    # check is judged by the copy it replaces, and where that copy does not exist yet the
    # answer is no. It is standard-library Python, run on the image's own python3, so nothing
    # this push brings is installed or run. Its docstring states what yes needs.
    #
    # 🪤 THE ANSWER IS VALIDATED BEFORE IT IS PUBLISHED, as `changes` does with its plan.
    # Anything but exactly `tested=true` or `tested=false` becomes `false`, and every gated
    # job reads `!= 'true'`, so a crashed or missing check runs the whole gate. The summary
    # is a pointer for people; no gate reads it.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # `commits/{sha}/pulls`
      actions: read         # the pull request's runs and their first attempts
      issues: read          # the pull request's events: whether its base was changed
    outputs:
      tested: ${{ steps.answer.outputs.tested }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: did a green pull-request run already test this tree
        id: answer
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          answer=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            check="$RUNNER_TEMP/tree_tested.py"
            if gh api -H "Accept: application/vnd.github.raw" \
                 "repos/${GITHUB_REPOSITORY}/contents/tools/ci/tree_tested.py?ref=${BEFORE}" \
                 > "$check"; then
              GITHUB_OUTPUT="$RUNNER_TEMP/answer.txt" python3 "$check" --workflow ci.yml || true
              answer=$(cat "$RUNNER_TEMP/answer.txt" 2>/dev/null || true)
            else
              echo "the previous main commit ${BEFORE} has no tree check, so every job runs" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          case "$answer" in
            tested=true|tested=false) ;;
            *) answer="tested=false" ;;
          esac
          echo "$answer"
          printf '%s\n' "$answer" >> "$GITHUB_OUTPUT"

  changes:
    # ── The plan: which jobs this diff can reach (#3945) ────────────────────────────────────
    # One planner, tools/ci/plan.py, reads the changed paths against the catalogue's declared
    # inputs (tools/ci/catalogue.toml) and answers with the jobs to run. The gated jobs read its
    # list; no classifier sits beside it. docs/maintainers/ci.md, "Planning a run", says how a
    # path schedules a job. It is ~20s: a depth-1 checkout, a depth-1 fetch of main's tip, the
    # API calls, no uv and no npm.
    #
    # 🪤 THE PLANNER IS MAIN'S, NEVER THIS CHECKOUT'S. A pull request's catalogue and overrides
    # are its input, read from this checkout; what judges them is tools/ci as main's tip has it
    # (on a push to main, the commit the push replaced, as `tree-check` reads its check), archived
    # into a folder of its own and run from there. Where there is none to fetch, nothing plans and
    # the whole tier runs.
    #
    # 🪤 WHAT THE PLANNER CANNOT READ RUNS THE WHOLE TIER. An empty or failed enumeration, a path
    # no job's input names, a planner that cannot be fetched, crashes or answers in the wrong
    # shape, and the `ci:full` label all end as `full=true`, never as a skipped job: the absence
    # of an answer must not arrive as a pass.
    #
    # 🪤 THE ANSWER IS VALIDATED BEFORE IT IS PUBLISHED. Appending the planner's stdout straight to
    # $GITHUB_OUTPUT fails in the silent direction: if the interpreter is missing or the planner
    # raises, NO key is written and a gate reads the empty string. So only `full=true|false` and
    # a JSON list of job ids, as the planner prints it, are published, anything else becomes
    # `full=true`, and the gates read `full != 'false'` and survive a failed job
    # (`!cancelled()`), so even an unwritten output runs them.
    # tests/rails/test_ci_plan_step_tree.py runs this step as written against planted answers.
    #
    # The browser run keeps its saving: the `e2e` jobs (MEASURED 2026-09-19 at 19.9-29.4 min when
    # it was three jobs) are planned only for the diffs their inputs reach, as the ignore-list it
    # replaces did. src/personalclaw/** is always in its reach: a backend diff can change the DOM
    # the browser run scans.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # `pulls/{n}/files` below. READ only, and a fork PR's token is
                            # read-only regardless — both calls are GETs, so that is enough.
      actions: read         # main's recent CI runs and their telemetry, for the rails floor
    outputs:
      full: ${{ steps.plan.outputs.full }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      # Depth 1 deliberately: the planner reads a path LIST and the catalogue, never history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: enumerate the changed paths, and plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          # `true` when the pull request carries the `ci:full` label. The labels are the event's,
          # so a label added later counts from the next push.
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -uo pipefail
          # GitHub runs this under `bash -e`, and each command here that can fail is guarded: a
          # failed enumeration falls through to the empty list, which the planner answers with
          # the whole tier, and a planner that cannot be fetched or run gives no answer, which
          # becomes the whole tier below. Exiting non-zero here would red a PR over an API hiccup.
          listed="$RUNNER_TEMP/changed.json"
          changed="$RUNNER_TEMP/changed.txt"
          : > "$listed"
          judge_ref=""
          # Each name as a JSON string on a line of its own, so a name with a newline in it
          # stays one name.
          if [ -n "${PR_NUMBER:-}" ]; then
            # Every `pull_request` run, fork included — the payload carries the number, so the
            # read-only fork token never has to resolve it.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename | @json' > "$listed" || : > "$listed"
            judge_ref="refs/heads/main"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A push to main: what this push changed, against the commit it replaced. The
            # default branch here would be this very commit, and an empty diff.
            echo "base: the previous main commit $BEFORE"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${HEAD_SHA}" \
              --jq '.files[].filename | @json' > "$listed" || : > "$listed"
            judge_ref="$BEFORE"
          else
            # Neither: a push to main whose `before` is all-zeros or missing. A feature branch
            # starts no push run here (the trigger admits main alone, #3915). Compared against
            # the DEFAULT branch, which can enumerate nothing for main itself; an empty list is
            # read as an unknown diff, so the gates run. There is no commit to judge from either.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" \
              --jq '.files[].filename | @json' > "$listed" || : > "$listed"
          fi
          # The names NUL-separated, for the planner's -z: one with a newline in it reaches the
          # planner whole, which cannot read it as a path and plans the whole tier. A line that
          # is not one JSON string empties the list, which plans the whole tier too.
          python3 -c 'import json, sys; names = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]; assert all(isinstance(n, str) and "\0" not in n for n in names); sys.stdout.write("".join(n + "\0" for n in names))' "$listed" > "$changed" || : > "$changed"
          echo "enumerated $(tr -cd '\000' < "$changed" | wc -c) changed path(s)"
          # The planner as main has it, never this checkout's (see the job's header). Only a
          # whole archive is run: one that fails part way plans nothing.
          judge="$RUNNER_TEMP/judge"
          judged=""
          if [ -n "$judge_ref" ] && rm -rf "$judge" && mkdir -p "$judge" \
             && git fetch --no-tags --depth=1 origin "$judge_ref" \
             && git archive FETCH_HEAD tools/ci | tar -x -C "$judge"; then
            echo "planner: tools/ci at $judge_ref"
            judged="yes"
          fi
          full_flag=""
          if [ "${FULL_LABEL:-}" = "true" ]; then
            echo "the ci:full label asks for the whole tier"
            full_flag="--full"
          fi
          answer=""
          if [ -n "$judged" ]; then
            # stdout carries the two output lines. stderr carries the plan as JSON and any
            # warning: all of it goes to the run summary, and the warnings to this log as well.
            : > "$RUNNER_TEMP/plan.err"
            answer=$(cd "$judge" && python3 -m tools.ci plan merge \
                       --catalogue "$GITHUB_WORKSPACE/tools/ci/catalogue.toml" \
                       --trusted-areas "$judge/tools/ci/areas.toml" \
                       --root "$GITHUB_WORKSPACE" --paths "$changed" -z \
                       --repo "$GITHUB_REPOSITORY" --outputs ${full_flag:+"$full_flag"} \
                       2> "$RUNNER_TEMP/plan.err") || answer=""
            cat "$RUNNER_TEMP/plan.err" >> "$GITHUB_STEP_SUMMARY"
            sed -n '/^::warning[ :]/p' "$RUNNER_TEMP/plan.err"
          else
            echo "no planner from main to plan with"
          fi
          full=$(printf '%s\n' "$answer" | sed -n 's/^full=//p')
          jobs=$(printf '%s\n' "$answer" | sed -n 's/^jobs=//p')
          # Only a JSON list of job ids, exactly as the planner prints it, is published; anything
          # else is no answer.
          if ! python3 -c 'import json, re, sys; s = sys.argv[1]; v = json.loads(s); assert isinstance(v, list) and all(isinstance(j, str) and re.fullmatch("[a-z0-9][a-z0-9-]*", j) for j in v) and json.dumps(v, separators=(",", ":")) == s' "$jobs" 2>/dev/null; then
            full=""
          fi
          case "$full" in
            true|false) ;;
            *)
              # On one line, so nothing the planner printed reads as a workflow command.
              shown=${answer//$'\n'/ }
              shown=${shown//$'\r'/ }
              echo "::warning title=plan inconclusive::the planner produced" \
                   "'${shown:-no output}' instead of a plan, so the whole tier RUNS." \
                   "An unanswered question must not arrive as a skipped job."
              full=true
              jobs='[]'
              ;;
          esac
          echo "full=$full jobs=$jobs"
          printf 'full=%s\njobs=%s\n' "$full" "$jobs" >> "$GITHUB_OUTPUT"
      # 🪤 MAIN'S RULES JUDGE THIS CATALOGUE, NOT ITS OWN. The plan step archived tools/ci as
      # main has it into $RUNNER_TEMP/judge; from there main's loader reads this pull request's
      # catalogue with main's rules and main's own catalogue as its reference
      # (tools/ci/catalogue_check.py): a security or live job main has must stay, keep its
      # posture and keep its tiers, unless main's copy already marks it `retiring`, and breadth
      # keeps a security job. A refusal fails this job, which the merge decision requires
      # (tools/ci/merge_decision.py, CATALOGUE_CHECK), so the verdict is red too; the plan step's
      # planner refused the same catalogue (exit 2), so the whole tier runs. Unlike the plan, this
      # fails closed: a pull request whose catalogue nothing could check is red, never unchecked.
      - name: main's tools/ci checks this pull request's catalogue
        id: catalogue-check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          judge="$RUNNER_TEMP/judge"
          if [ -z "${PR_NUMBER:-}" ]; then
            # Only a push to main checks nothing; any other run with no pull request has no
            # main's copy to be checked against, and is red.
            if [ "${GITHUB_EVENT_NAME:-}" = "push" ] \
               && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
              echo "a push to main: the catalogue under test is main's own"
              exit 0
            fi
            echo "::error title=catalogue unchecked::this run is neither a pull request nor a" \
                 "push to main, so nothing checked its catalogue against main's"
            exit 1
          fi
          if [ ! -f "$judge/tools/ci/__main__.py" ] || [ ! -f "$judge/tools/ci/catalogue.toml" ]; then
            echo "::error title=catalogue unchecked::main's tools/ci could not be fetched, so" \
                 "nothing checked this pull request's catalogue. Re-run the job."
            exit 1
          fi
          if [ ! -f "$judge/tools/ci/catalogue_check.py" ] \
             && ! grep -qF '"catalogue-check"' "$judge/tools/ci/__main__.py"; then
            # Only the merge that adds the check: a main with neither the module nor its verb
            # has no rules to apply. A copy with one and not the other is not whole, and runs
            # below, red.
            echo "::warning title=catalogue unchecked::main's tools/ci has no catalogue check yet," \
                 "so there is nothing to check this pull request's catalogue against"
            exit 0
          fi
          rc=0
          (cd "$judge" && python3 -m tools.ci catalogue-check \
             --catalogue "$GITHUB_WORKSPACE/tools/ci/catalogue.toml" \
             --against "$judge/tools/ci/catalogue.toml") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=catalogue refused::main's tools/ci refuses this pull request's" \
                 "catalogue (exit $rc); the lines above say why."
            exit 1
          fi

  apps-contract:
    # The first-party apps' SDK contract checks, run against THIS core (#3599 → PersonalClawApps
    # #124). Core and the apps release separately, so an SDK change could break an app with
    # nothing here noticing: #3599 changed `compress_thread_history`'s parameter type, every
    # import still resolved and every call still bound, and Slack lost every restored thread's
    # history. This checks out PersonalClawApps' main and runs, over every bundle, the testkit's
    # static rails (imports published, calls bind), the CHANGELOG rule (an SDK change's headline
    # names the apps it affects), and each bundle's own tests/test_sdk_contract.py — the
    # contract checks, not every app's suite. A problem on an SDK symbol this change did not
    # touch is the app's own and is reported, not charged, so one app's bug cannot red every
    # core PR.
    # Gated on the plan (#3945): run unless the planner answered `full=false` without this job.
    # `!cancelled()` keeps it when `changes` itself failed or timed out, whose outputs are then
    # never written, and so read as no answer.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'apps-contract')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PersonalClaw/PersonalClawApps
          path: .ci-apps
      - name: fetch the base commit (its SDK snapshot and CHANGELOG are the baseline)
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A push to main: the commit it replaced, since origin/main is this commit.
            echo "base: the previous main commit $BEFORE"
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: the apps' SDK contract, against this core
        run: >-
          uv run python scripts/apps_sdk_contract.py --apps-dir .ci-apps
          --base-ref "${{ steps.base.outputs.ref }}" --install-deps

  lint:
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read   # NOT pull-requests: write — a fork PR is handed a read-only token
                       # regardless, so asking for write here only looked like it worked.
                       # The remediation comment is posted by pr-feedback.yml instead.
      pull-requests: read   # #2595: the feedback relay's PR number is looked up by head branch
                            # when the payload has none. Since #3915 only a push to main has no
                            # number, and its lookup (`head=<owner>:main`) is expected to find
                            # nothing. READ only — the line above still holds, and a fork PR's
                            # payload always carries the number.
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # `harness/` and `scripts/` are repo-inner dev infra beside src/ (self-verification,
      # and the baseline generators / validators / release helpers). `make lint` lints both
      # under the same tools as core; CI used to skip `harness/`, so a harness-only lint
      # break went green here and red for a local contributor. `scripts/` was the same hole
      # one step worse — NO gate saw it while the pre-commit hook silently reformatted it,
      # so an isort violation rode an open PR. Same scope as the Makefile now:
      # black/isort/flake8 over src+tests+harness+scripts+tools/ci, mypy over
      # src+harness+tools/ci (scripts/ does not pass mypy yet — see the Makefile's `lint:`
      # comment for the measured count). `tools/ci` is the CI controller code
      # (docs/maintainers/ci.md, "Trust boundary"), held to every tool from its first file.
      #
      # Every tool runs even when an earlier one fails, and its output is captured, so
      # the failure comment below names every violation at once. Otherwise a contributor
      # fixes black, pushes, and only then discovers flake8.
      - name: lint (black --check · isort --check · flake8 · mypy)
        id: lint
        run: |
          status=0
          : > /tmp/lint-out.txt
          run_tool() {
            label=$1
            shift
            if out=$("$@" 2>&1); then
              printf '%s\n' "$out"
            else
              status=1
              printf '%s\n' "$out"
              { echo "**$label**"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> /tmp/lint-out.txt
            fi
          }
          run_tool "black --check" uv run black --check src/personalclaw tests harness scripts tools/ci
          run_tool "isort --check-only" uv run isort --check-only src/personalclaw tests harness scripts tools/ci
          run_tool "flake8" uv run flake8 src/personalclaw tests harness scripts tools/ci
          run_tool "mypy" uv run mypy src/personalclaw harness tools/ci
          # The bundled-app tree is excluded from the pass above and checked one bundle per
          # mypy run here — see scripts/lint_bundled_apps.py for why (two bundles ship a
          # module named `provider.py`, which aborts a single combined run).
          run_tool "mypy (bundled apps)" uv run python scripts/lint_bundled_apps.py
          if [ "$status" -ne 0 ]; then
            {
              echo "violations<<LINTEOF"
              cat /tmp/lint-out.txt
              echo "LINTEOF"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      # Hand the violations to pr-feedback.yml instead of commenting from here.
      #
      # WHY THIS CANNOT COMMENT ITSELF. A `pull_request` run from a FORK gets a read-only
      # GITHUB_TOKEN no matter what `permissions:` above asks for, so the github-script step
      # that used to live here could never post on a fork PR. Measured across every fork PR
      # this repo has had (#678, #680, #1210, #1211): zero `lint-help` comments, ever. The
      # contributors who most need the remediation were the only ones structurally unable to
      # receive it, and the job still went red, so the failure looked like a normal lint red.
      #
      # An artifact crosses that boundary. `pr-feedback.yml` runs on `workflow_run` in the
      # BASE repo's context, where the token really is write-capable, and posts from there.
      # Resolve the PR number WITHOUT keying on the event name — #2595.
      #
      # Until #3915 a feature branch also ran on `push`, the concurrency group above collapsed
      # that run and its `pull_request` run into ONE group, and which of the two survived was
      # NOT contractual. While the two steps below were gated on
      # `github.event_name == 'pull_request'`, a push-survivor produced a red `lint` with the
      # remediation posted NOWHERE: no artifact is uploaded, and pr-feedback.yml reads the PR
      # number out of that artifact's pr.txt, so it correctly posts nothing. The steps still
      # read the number without keying on the event, so no trigger change can bring that back.
      #
      # An empty answer is legitimate (a push to main has no open pull request) and must not
      # fail the step; the two steps below simply do not run.
      - name: Resolve the PR number for the feedback relay
        id: prnum
        if: failure() && steps.lint.outputs.violations != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          if [ -n "${EVENT_PR:-}" ]; then
            # `pull_request`, including every fork PR — the payload already carries it, so the
            # read-only fork token never has to make the API call below.
            number="$EVENT_PR"
          else
            number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${HEAD_BRANCH}" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          printf 'number=%s\n' "${number:-}" >> "$GITHUB_OUTPUT"
          echo "feedback relay target: PR ${number:-<none — nothing will be posted>}"
      - name: Hand the violations to the feedback workflow
        if: failure() && steps.lint.outputs.violations != '' && steps.prnum.outputs.number != ''
        # 🪤 `env:`, NOT `${{ }}` inside `run:`. A `${{ }}` expression is pasted into the shell
        # script as TEXT before bash sees it, so the violations — which contain ``` fences —
        # had their backticks read as command substitution. The artifact came out
        # 54 bytes holding only the `**black**`/`**flake8**` headers, every actual violation
        # executed as a command and replaced by its empty output. It is also an injection
        # hole, since lint output echoes paths and source lines from the PR. Through `env:`
        # the runner sets the value directly and `"$VIOLATIONS"` expands without re-parsing.
        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
          PR_NUMBER: ${{ steps.prnum.outputs.number }}
        run: |
          mkdir -p /tmp/lint-feedback
          printf '%s' "$VIOLATIONS" > /tmp/lint-feedback/violations.md
          # `workflow_run` payloads carry an EMPTY `pull_requests` array for fork PRs, so the
          # relay cannot look the number up — it has to be carried across in the artifact.
          printf '%s' "$PR_NUMBER" > /tmp/lint-feedback/pr.txt
          wc -c /tmp/lint-feedback/violations.md /tmp/lint-feedback/pr.txt
      - name: Upload lint feedback
        if: failure() && steps.lint.outputs.violations != '' && steps.prnum.outputs.number != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-feedback
          path: /tmp/lint-feedback/
          retention-days: 3
      # ── The install one-liner's linters, which the file has claimed since it landed ────────
      # `deploy/website/install.sh` is what `curl -fsSL https://personalclaw.dev/install | sh`
      # runs on a stranger's machine, and its header advertised "shellcheck-clean" plus a weekly
      # container smoke. MEASURED 2026-09-06: no workflow mentioned the file at all — grepping
      # .github/workflows/ for `website/install`, `install.sh` or `personalclaw.dev/install`
      # returned nothing, and the main-push workflow's four jobs (matrix/audit/security-corpus, now `security`/coverage)
      # touched none of it. The advertised coverage was the only artifact of itself.
      #
      # `!cancelled()` rather than the default success(): the lint step above ends in
      # `exit "$status"`, so a black violation would otherwise SKIP this and the shell break
      # would surface only on the next push — the same argument that step's own comment makes
      # for running every tool before reporting.
      #
      # The tools are INSTALLED here, not assumed. Absent is not unavailable: this repo spent a
      # month reading a skipped tmux-gated test class as a pass, so a runner image that drops
      # shellcheck must red HERE rather than turn the cases below into quiet skips — which is
      # precisely what PERSONALCLAW_REQUIRE_INSTALL_PROOF converts a missing linter into.
      #
      # This job carries the lever because it is the only one where both linters are guaranteed.
      # The same module also rides `test` (leverless, so a laptop without dash gets a skip
      # instead of a hostile red).
      - name: install one-liner — shellcheck · sh -n · dash -n · offline contract
        if: ${{ !cancelled() }}
        env:
          PERSONALCLAW_REQUIRE_INSTALL_PROOF: "1"
        run: |
          set -eu
          for tool in shellcheck dash; do
            command -v "$tool" >/dev/null 2>&1 || {
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends "$tool"
            }
          done
          shellcheck --version | head -2
          sh -n deploy/website/install.sh
          dash -n deploy/website/install.sh
          shellcheck -s sh deploy/website/install.sh
          # One process, pytest's default: the truncation sweep is ~170 tiny `sh` invocations,
          # and xdist buys nothing.
          # --junitxml: every pytest step in this repo writes one — see `test-shard`'s
          # "Upload JUnit results" step for why.
          uv run pytest tests/test_website_installer.py --junitxml=reports/junit-lint-installer.xml
      - name: Upload JUnit results (installer sweep)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-lint-installer
          path: reports/junit-lint-installer.xml
          if-no-files-found: ignore
          retention-days: 7

  shard-plan:
    # ── One shard plan for the run (#3923) ───────────────────────────────────────────────────
    # The suite's test files, split into whole-file shards by each file's median first-attempt
    # seconds in the telemetry record of main's three newest collected runs (#3948;
    # tools/ci/shards.py). Made once and handed to every shard as an artifact, so every shard of
    # a leg reads the same buckets: no file is dropped or run twice, and `shards check` fails the
    # run if one would be. Durations only balance the shards: until the first collected main run,
    # or when the record cannot be read, every file weighs the same and the plan is still whole.
    # Standard-library Python on the image's python3, with nothing installed.
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # main's recent completed runs and their telemetry history
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: plan the suite's shards, once for every leg of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m tools.ci shards plan --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --leg test-shard:ci.yml:junit-test-shard-:4
          --leg test-macos:ci.yml:junit-test-macos-:4
          --out "$RUNNER_TEMP/shard-plan/plan.json"
      - name: every collectable file is in exactly one shard of each leg
        run: python3 -m tools.ci shards check --plan "$RUNNER_TEMP/shard-plan/plan.json"
      - name: Upload the shard plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan/plan.json
          if-no-files-found: error
          retention-days: 1

  test-shard:
    # ── Sharded pytest — the throughput fix (#2720) ───────────────────────────────────────────
    # The single `test` job ran the whole ~40-min suite serially and was the binding constraint
    # on merge rate. It is split into N=4 DISJOINT shards of whole test files that
    # run in PARALLEL, so each PR's tests finish in ~1/N the wall-clock and each shard's log is
    # ~1/N the size (which also mitigates the #2720 log-truncation class). The `test` job below
    # is the AGGREGATION GATE: it keeps the STABLE `test` id — the branch-protection required
    # check — and goes green only
    # when every shard passed.
    #
    # Coverage is deliberately NOT measured on the shards: it is measured nightly by breadth.yml's
    # `coverage` legs. A shard passes no `--cov`, and pytest measures nothing it is not asked to.
    #
    # Each shard runs its share of the run's one plan (`shard-plan`, tools/ci/shards.py): whole
    # test files, balanced by each file's median seconds over main's three newest runs, so a
    # worker collects only its shard's files and every file runs in exactly one shard.
    needs: [tree-check, shard-plan]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # On main, one group per shard for every push (see the header): a newer push's waiting
    # shard replaces this one if it has not started, and the `test` gate names that red.
    concurrency:
      group: ci-suite-${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.ref_name || github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-test-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      # fail-fast:false so one red shard does not cancel the others — you want every failing
      # shard's report in one push, not a fix-push-rediscover loop (same reason breadth.yml's legs
      # set it). N is exactly the `shard` list below: extend it to re-shard, nothing else moves.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # NOTE: do NOT set PERSONALCLAW_HOME here. The suite runs under the documented
      # no-global-home contract (CONTRIBUTING: destructive tests isolate via per-test
      # config_dir/tmp_path, NOT a global override) — several tests assert the DEFAULT
      # ~/.personalclaw resolution or patch Path.home(), and config_dir() gives
      # PERSONALCLAW_HOME precedence over Path.home(), so a global value defeats those
      # patches and reds them. The runner's $HOME is already ephemeral.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      # A runner's Docker, where it has one, is the job's own, so the tests that build images,
      # run containers and start the Compose stack run here (tests/container_runtime.py). A
      # developer's machine runs them only when it sets this too.
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # The real-daemon leg (tests/test_durable_spawn.py::TestRealTmux) is
      # skipif-gated on a tmux binary, and NO stock runner image ships one — checked against
      # the Ubuntu-24.04 and macOS-15-arm64 runner-image manifests: zero mentions each. So the
      # one leg that proves a durable worker really outlives the gateway against the real
      # server had been skipping silently on every run since it landed, and that skip was
      # recorded as a MACHINE CEILING ("closes via a machine with tmux").
      #
      # It was never a ceiling, only an unasked question: apt has tmux and it installs in
      # seconds. Absent is not unavailable — a skip is the absence of an answer, not a
      # negative one, and reading it as a negative kept a shipped mechanism unproven.
      #
      # `tmux -V` runs in the SAME step deliberately: an install that fails must red the job
      # HERE, not reappear downstream as a skip in a count nobody reads.
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      # Fails, writing nothing, when the plan holds no files for this shard: pytest given no
      # selection would collect every test.
      - name: this shard's test files
        run: >-
          uv run python -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg test-shard --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/shard.txt"
      - name: pytest (shard ${{ matrix.shard }} of 4 — xdist within the shard, no coverage)
        # -n auto --dist worksteal: one xdist worker per core (4 on this runner), each test handed
        #   to whichever worker is free. pytest's own default is one process, so a suite step
        #   names its workers (tests/rails/test_ci_contract.py holds every suite step to that).
        # No --cov: coverage is measured by breadth.yml's `coverage` legs.
        # -q: with the addopts `--verbose` this nets to NORMAL verbosity — a progress summary,
        #   not one line per test — so each shard's log stays small (the #2720 truncation class).
        # tests --shard-list: collect from tests, as a whole-suite run does, but import only the
        #   files this shard's list names (tests/shard_list.py): its share of the run's one plan.
        # --junitxml: WHICH test failed, machine-readably — see the upload step below.
        run: uv run pytest -n auto --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-test-shard-${{ matrix.shard }}.xml
      # ── Why a red run must still publish this ────────────────────────────────────────────
      # A failing `test` produced exactly one legible signal — the annotation
      # "Process completed with exit code 1". Nothing named the case, so classifying
      # flake-vs-genuine meant either reading the whole shard log (minutes of scrollback, and
      # the #2720 truncation can eat the summary outright) or a blind ~40-minute re-run. That
      # tax was paid once per red, by a human, forever.
      #
      # The JUnit XML is a few hundred KB and names every failure with its node id and
      # traceback, so `gh run download --name junit-test-shard-N` answers "which test" in
      # seconds. `if: always()` is the whole point: the default `success()` would publish the
      # report only on the runs that need it least. `-q` keeps the console log small; the XML
      # is where the detail lives now, so the two levers no longer trade off.
      #
      # `name` carries the shard index because artifact names must be unique within a run —
      # a fixed name would make the four shards collide and only one would survive.
      - name: Upload JUnit results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-shard-${{ matrix.shard }}
          path: reports/junit-test-shard-${{ matrix.shard }}.xml
          # A step that dies before pytest writes anything (a `uv sync` failure, a cancelled
          # run) must not turn into a second, misleading red on the upload itself.
          if-no-files-found: ignore
          retention-days: 7
      # ── The one red the JUnit XML structurally cannot explain ─────────────────────────────
      # The real-home guard (tests/real_home_guard.py) fails the TEST that touches the real
      # home, and that lands in the XML above. What it cannot pin on a test — a thread that
      # outlived the test which started it, an import during collection — fails the run from
      # `pytest_sessionfinish` by setting `session.exitstatus`: no testcase fails, the XML reads
      # `failures=0`, and the shard surfaces as a bare "exit code 1" naming nothing. MEASURED on
      # the walk-based rail that came before: that signature cost three shifts of guessing on
      # one PR, because the offending paths existed only on STDOUT, where the #2720 truncation
      # class can eat them (#3386). A SEPARATE artifact rather than a second path on the step
      # above: `path:` there has to stay a same-line scalar, which is the form
      # tests/test_ci_junit_artifacts.py parses.
      - name: Upload real-home guard report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-home-guard-shard-${{ matrix.shard }}
          path: reports/real-home-guard.txt
          if-no-files-found: ignore
          retention-days: 7

  test:
    # ── Aggregation gate for the sharded suite above ──────────────────────────────────────────
    # This job carries the STABLE `test` id (the branch-protection required-check name).
    # It goes green only when EVERY shard succeeded, and a FAILING shard
    # still reports RED here rather than skipped — `fail-fast: false` above means a shard failure
    # never cancels the run, so `!cancelled()` is satisfied and this job runs. It needs no
    # checkout or toolchain: it only reads the matrix's aggregate result.
    #
    # ── 🪤 `!cancelled()`, NOT `always()`. THE RED NO TEST PRODUCED (#2946) ────────────────────
    # `always()` runs a job even when the RUN ITSELF was cancelled, and the step below then turned
    # `result == 'cancelled'` into `exit 1`. Until #3915 the concurrency group above collapsed
    # a branch's `pull_request` and `push` runs, so ONE of the two was always cancelled — and
    # the cancelled one was publishing a `test` FAILURE. Check-runs key on the SHA, not the run,
    # so that red landed on the exact commit whose surviving run went green.
    #
    # MEASURED 2026-09-18 on `9801cf068`: the cancelled `push` run 35338585659
    # had all TWELVE of its other jobs `cancelled` and `test` → `failure`, while the surviving
    # `pull_request` run 35338682195 had `test` → `success`. Both check-runs sit on that one SHA.
    # Every open PR therefore carried a red `test` no test produced, `mergeStateStatus` was
    # permanently `UNSTABLE`, and every merge decision began by re-deriving which red was real.
    #
    # A cancelled run measured NOTHING, so the honest report is no `test` verdict at all — which
    # is what `!cancelled()` produces (the job is SKIPPED, not failed). What it costs: the loser
    # leaves a `test` check-run with conclusion `skipped` beside the winner's `success`. That is
    # not a failing check, so it no longer makes the PR unstable. The `:289` warning this comment
    # replaced — that a *skipped* required check wedges the PR — does not bite: `main` currently
    # has ZERO required status checks, and when several check-runs share a name GitHub reads the
    # most recent, which is the winner (measured above: the survivor's `test` started 11:36:16Z,
    # the loser's 11:15:00Z — the loser is always the earlier one, since it is cancelled BY the
    # arrival of the other). Re-check this if `test` is ever made a required check.
    needs: [tree-check, test-shard]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # this run's jobs and main's later runs, for the superseded proof
      checks: read    # a cancelled shard's annotations
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: every test shard passed
        # The same script as `test-macos-gate`'s, which differs only in this env.
        # tests/rails/test_ci_contract.py runs it on planted answers and holds its exit codes.
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          RESULT: ${{ needs.test-shard.result }}
          SHARD_JOB: test-shard
          GROUP_PREFIX: ci-suite-main-main-test-shard-
        run: |
          result="$RESULT"
          # Reachable only when a SHARD was cancelled while this run itself lived on — the job
          # above is skipped outright when the run is cancelled. A missing answer on a live run
          # is red, never green: same doctrine as breadth.yml's install-smoke legs.
          #
          # On a push to main the shards share one group per shard with every other push
          # (#3915), so a newer push's waiting shard can replace one of these before it starts.
          # That is still red: this commit was not tested on its own. It is named for what it
          # is only when the PREVIOUS main commit's copy of tools/ci/superseded.py, fetched as
          # tree-check's is and run under `python3 -I`, proves it from the API. Any other
          # cancellation, or no answer, is unproven. Either way this step exits 1.
          if [ "$result" = "cancelled" ]; then
            newer=""
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              check="$RUNNER_TEMP/superseded.py"
              if gh api -H "Accept: application/vnd.github.raw" \
                   "repos/${GITHUB_REPOSITORY}/contents/tools/ci/superseded.py?ref=${BEFORE}" \
                   > "$check"; then
                GITHUB_OUTPUT="$RUNNER_TEMP/answer.txt" python3 -I "$check" --workflow ci.yml \
                  --job "$SHARD_JOB" --group-prefix "$GROUP_PREFIX" || true
                line=$(cat "$RUNNER_TEMP/answer.txt" 2>/dev/null || true)
                case "$line" in
                  superseded=*) newer="${line#superseded=}" ;;
                esac
              fi
            fi
            # Exactly one full object id: lowercase hex, 40 or 64 characters, on one line.
            case "$newer" in
              *[!0-9a-f]*) newer="" ;;
            esac
            case "${#newer}" in
              40|64) ;;
              *) newer="" ;;
            esac
            if [ -n "$newer" ]; then
              echo "::error title=test shards superseded::a newer push to main replaced this" \
                   "commit's waiting shard, so the suite did not run on this commit on its own:" \
                   "superseded by ${newer}. It stays red; that commit's run is the one to read."
            else
              echo "::error title=test shards unproven::a test shard was cancelled while this run" \
                   "was still live, and no newer push to main is proven to have replaced it, so" \
                   "the suite measured nothing on this commit. Look for a cancellation by hand or" \
                   "a runner the shard is losing. A re-run runs in this commit's own group, so a" \
                   "burst of merges cannot replace it."
            fi
            exit 1
          fi
          if [ "$result" != "success" ]; then
            echo "::error title=test shards failed::the ${SHARD_JOB} matrix result was '$result'" \
                 "(expected 'success'). Open the red '${SHARD_JOB} (N)' job(s) above, or download" \
                 "the JUnit report — \`gh run download <run-id> --name junit-${SHARD_JOB}-N\` — to" \
                 "see WHICH tests failed without reading the log. If that report names NO failing" \
                 "test (failures=0), the shard exited nonzero without a test failing: read that" \
                 "shard's real-home guard report, which carries the guard's verdict: the accesses it" \
                 "refused that no test owned, each with its thread and stack (#3386)."
            exit 1
          fi
          echo "every ${SHARD_JOB} shard passed"

  test-macos:
    # ── The suite on macOS, before the merge (#3913) ────────────────────────────────────────
    # Every change that merges has then run both operating systems and both Pythons once:
    # Ubuntu on 3.12 (`test-shard`) and macOS on 3.13 (here). Four disjoint shards, as
    # `test-shard`, planned from macOS's own durations, so together they list `test-shard`'s ids.
    # `-n 2`: two xdist workers keep a macOS runner's peak memory under its 7 GB (#2720).
    # Four shards take 4 of the 5 macOS runners a run can hold, so concurrent pull requests
    # queue on macOS; the cap is above a quarter's measured share on these runners.
    #
    # On pull requests into main, and on a push to main whose tree no green pull-request run
    # tested. A feature branch has no push run here (#3915); its pull request runs it.
    needs: [tree-check, shard-plan]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    # As `test-shard`'s: one group per shard for every push to main, never cancelling a running
    # shard, so a burst queues one macOS suite, not one per commit.
    concurrency:
      group: ci-suite-${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.ref_name || github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-test-macos-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # As `test-shard`: no PERSONALCLAW_HOME, app backends off, and Docker where the runner
      # has one.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.13.16"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Install tmux (durable sessions — real-daemon test leg)
        run: |
          if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
          brew install tmux
          tmux -V
      - name: the shard plan this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files
        run: >-
          uv run python -m tools.ci shards list --plan "$RUNNER_TEMP/shard-plan/plan.json"
          --leg test-macos --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/shard.txt"
      - name: pytest (macOS shard ${{ matrix.shard }} of 4 — two workers, no coverage)
        run: uv run pytest -n 2 --dist worksteal -q tests --shard-list "$RUNNER_TEMP/shard.txt" --junitxml=reports/junit-test-macos-${{ matrix.shard }}.xml
      # Same argument as `test-shard`'s upload steps.
      - name: Upload JUnit results (macOS shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test-macos-${{ matrix.shard }}
          path: reports/junit-test-macos-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload real-home guard report (macOS shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-home-guard-macos-${{ matrix.shard }}
          path: reports/real-home-guard.txt
          if-no-files-found: ignore
          retention-days: 7

  test-macos-gate:
    # ── Aggregation gate for the macOS shards (#3915) ─────────────────────────────────────
    # `test`'s twin over `test-macos`, with the same script: a failed shard is red, and on a
    # push to main a shard a newer push replaced is red as "superseded by <newer commit>",
    # proven by the previous main commit's copy of tools/ci/superseded.py for this job's own
    # group; anything else cancelled is "unproven". It runs whenever `test-macos` was
    # planned, the same condition, so on a pull request not into main both are skipped.
    needs: [tree-check, test-macos]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # this run's jobs and main's later runs, for the superseded proof
      checks: read    # a cancelled shard's annotations
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: every macOS shard passed
        # The same script as `test`'s, which differs only in this env.
        # tests/rails/test_ci_contract.py runs it on planted answers and holds its exit codes.
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          RESULT: ${{ needs.test-macos.result }}
          SHARD_JOB: test-macos
          GROUP_PREFIX: ci-suite-main-main-test-macos-
        run: |
          result="$RESULT"
          # Reachable only when a SHARD was cancelled while this run itself lived on — the job
          # above is skipped outright when the run is cancelled. A missing answer on a live run
          # is red, never green: same doctrine as breadth.yml's install-smoke legs.
          #
          # On a push to main the shards share one group per shard with every other push
          # (#3915), so a newer push's waiting shard can replace one of these before it starts.
          # That is still red: this commit was not tested on its own. It is named for what it
          # is only when the PREVIOUS main commit's copy of tools/ci/superseded.py, fetched as
          # tree-check's is and run under `python3 -I`, proves it from the API. Any other
          # cancellation, or no answer, is unproven. Either way this step exits 1.
          if [ "$result" = "cancelled" ]; then
            newer=""
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              check="$RUNNER_TEMP/superseded.py"
              if gh api -H "Accept: application/vnd.github.raw" \
                   "repos/${GITHUB_REPOSITORY}/contents/tools/ci/superseded.py?ref=${BEFORE}" \
                   > "$check"; then
                GITHUB_OUTPUT="$RUNNER_TEMP/answer.txt" python3 -I "$check" --workflow ci.yml \
                  --job "$SHARD_JOB" --group-prefix "$GROUP_PREFIX" || true
                line=$(cat "$RUNNER_TEMP/answer.txt" 2>/dev/null || true)
                case "$line" in
                  superseded=*) newer="${line#superseded=}" ;;
                esac
              fi
            fi
            # Exactly one full object id: lowercase hex, 40 or 64 characters, on one line.
            case "$newer" in
              *[!0-9a-f]*) newer="" ;;
            esac
            case "${#newer}" in
              40|64) ;;
              *) newer="" ;;
            esac
            if [ -n "$newer" ]; then
              echo "::error title=test shards superseded::a newer push to main replaced this" \
                   "commit's waiting shard, so the suite did not run on this commit on its own:" \
                   "superseded by ${newer}. It stays red; that commit's run is the one to read."
            else
              echo "::error title=test shards unproven::a test shard was cancelled while this run" \
                   "was still live, and no newer push to main is proven to have replaced it, so" \
                   "the suite measured nothing on this commit. Look for a cancellation by hand or" \
                   "a runner the shard is losing. A re-run runs in this commit's own group, so a" \
                   "burst of merges cannot replace it."
            fi
            exit 1
          fi
          if [ "$result" != "success" ]; then
            echo "::error title=test shards failed::the ${SHARD_JOB} matrix result was '$result'" \
                 "(expected 'success'). Open the red '${SHARD_JOB} (N)' job(s) above, or download" \
                 "the JUnit report — \`gh run download <run-id> --name junit-${SHARD_JOB}-N\` — to" \
                 "see WHICH tests failed without reading the log. If that report names NO failing" \
                 "test (failures=0), the shard exited nonzero without a test failing: read that" \
                 "shard's real-home guard report, which carries the guard's verdict: the accesses it" \
                 "refused that no test owned, each with its thread and stack (#3386)."
            exit 1
          fi
          echo "every ${SHARD_JOB} shard passed"

  web:
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: "true"
      # npm runs from the REPO ROOT (single-root workspace lockfile — npm/cli#4828);
      # never `cd web && npm ci`. typecheck + vitest + build all run against the web workspace.
      - name: npm ci (root)
        run: npm ci
      # `npm ci` does not run electron's download script (#3831). One script for CI and `run-job` (tools/ci/install_electron.sh): it fetches the checksum-pinned
      # binary and, on this runner, gives Chromium's setuid sandbox helper the bit Ubuntu's AppArmor
      # rule makes it need, the renderer sandbox staying on.
      - name: electron's binary, for the desktop tier's real-Electron legs
        run: sh tools/ci/install_electron.sh
      # The run's one typecheck: `npm run build` below is `vite build` alone, and nothing else in
      # this workflow typechecks the web.
      - name: typecheck
        run: npm run typecheck:web
      # Vitest's own default worker count is one less than the cores, and `web/vitest.config.ts`
      # holds a bare local run to 3 so a laptop keeps some; this job is the runner's only work,
      # so it takes every core. Through $GITHUB_ENV so the vitest step stays the one-line
      # `npm run test:web` that tests/rails/test_ci_tier_enforcement.py reads.
      - name: vitest on every core
        run: echo "VITEST_MAX_WORKERS=$(nproc)" | tee -a "$GITHUB_ENV"
      - name: test (vitest)
        # Includes the design-system consistency rails:
        # tokenLint.test.ts (token-lint-strict — no raw hex/px outside the
        # shrinking allowlist) + primitiveAdoption.test.ts (bespoke-chrome ratchet:
        # raw <button>/<input>/dialog counts may only shrink) + inertUtilities.test.ts
        # (a text-*/bg-*/border-* class must compile to real CSS — a name with no
        # token emits NOTHING and styles silently vanish). A new hardcoded value, a
        # new bespoke element, or a new inert utility turns this step — and CI — red.
        # (The axe-per-route a11y rail lives in web/e2e/ and runs in the `e2e-shard` legs below. They
        # are separate jobs because the harness boots a real gateway, so it needs the Python toolchain
        # too.)
        run: npm run test:web
      - name: design detector
        # Impeccable's deterministic rules over web/src, compared exactly with
        # web/design-detector.baseline.jsonl by web/scripts/designDetector.mjs: a new finding, or
        # one more of a rule in a file, turns this step red, and a fixed one asks for its line to
        # change. It runs the platform binary package-lock.json installed (never the npm shim's
        # download), with telemetry off, against the tracked web/DESIGN.md.
        run: npm run design:detect
      - name: test (desktop, node --test)
        # desktop/ is the OTHER member of this single root workspace, so the `npm ci`
        # above already installed it — this step costs ~0.2s and needs no extra runner.
        # 366 cases / 77 suites over the pure shell-side modules (capabilities, pushToTalk,
        # context-menu, find-bin, and the gatewayUrl / endpointRegistry / connectMode /
        # connectDialog) plus packaging.test.js, which asserts electron-builder's `build.files`
        # still lists every local require() in main.js AND every sibling file loaded by
        # `path.join(__dirname, …)` — a stale entry there ships a dmg that crashes on launch, or a
        # switcher window that loads nothing. Two legs here open real sockets on loopback: the
        # reconnect leg kills a listener and rebinds it, and the store leg writes real files into a
        # temp dir.
        #
        # `bridgeLoads.test.js` is the one case that is NOT source text (#3348). Tier 1 executes
        # `preload.js` in Node under a `require` shaped like the sandboxed renderer's, so "the
        # preload throws at load" and "the preload reaches for a module the sandbox withholds" —
        # the two mutations that left the old suite at 359 pass / 0 fail over a DEAD bridge — red
        # here, headless, on this runner. Tier 2 confirms that model against a real Electron
        # renderer, and `buddyIdle.test.js` checks the buddy's window there: shown without taking
        # focus, and hidden for 60 s with no timer, no frame and no CPU (#3831). Both run on the
        # binary the step above installs, under `xvfb-run` (the runner has no display). This job
        # must run them: PCLAW_REQUIRE_ELECTRON=1 turns a can't-start (no binary, no display, a
        # sandbox the kernel refuses) into a failure with the reason, where a host that need not
        # run them skips (`desktop/test/helpers/electronHost.js`).
        env:
          PCLAW_REQUIRE_ELECTRON: "1"
        run: npm run test:desktop
      - name: test (mobile, node --test)
        # mobile/ is the THIRD member of this single root workspace (the Capacitor shell that
        # wraps the served `#/companion` route), so the `npm ci`
        # above already installed it. 24 cases over the shell's pure modules: which URL the
        # WebView is handed, the private-network navigation rail, and safe-area insets actually
        # landing on an element. The NATIVE builds are deliberately not here — they need Xcode
        # and the Android SDK, so they are a maintainer step documented in mobile/README.md.
        run: npm run test:mobile
      - name: build (vite)
        run: npm run build
      # The build copies web/public verbatim and hashes the KaTeX and editor icon fonts out of
      # node_modules. Every font and binary it emitted must match ASSET_LICENSES.json, so a
      # dependency bump that changes a bundled font reds here until its record is updated.
      # Stdlib only, so the runner's python3 is enough.
      - name: bundled asset licences (built web)
        run: python3 scripts/check_asset_licenses.py --built-web
      # Record what this build was built FROM, so each browser leg's preview can refuse a dist that
      # does not match its checkout (web/playwright.config.ts). This is the run's ONE vite build:
      # the browser legs serve it rather than building their own. The render smoke that used to run
      # here is the `smoke` project, which an `e2e-shard` leg runs.
      - name: stamp the build (scripts/spa_dist_freshness.py)
        run: python3 scripts/spa_dist_freshness.py stamp
      # The desktop tier's built-page legs (desktop/test/built/): the buddy's real window on this
      # build. Here, after the build and its stamp, and required: a missing or stale build fails them.
      - name: test (desktop built pages, node --test)
        env:
          PCLAW_REQUIRE_ELECTRON: "1"
        run: npm run test:desktop:built
      # `include-hidden-files`: the stamp is `web/dist/.build-inputs.json`, and upload-artifact
      # leaves dotfiles out by default, which would hand the browser legs an unstamped dist that
      # their preview refuses.
      - name: upload the build (web-dist)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      # ── The wheel, built from the SPA this job just built and checked ──────────────────────
      # Until this step a pull request built no core wheel: `client` builds the client package's,
      # and release.yml built the first one, at a tag. A change that drops a package file, a
      # dashboard file or a bundled app from the wheel, or leaves it unable to boot from the
      # wheel alone, showed up only when a release was cut. This job already holds the built
      # SPA the wheel must carry, so it costs a build plus the contract's install and serve,
      # not a second npm build. `scripts/verify_wheel.py --wheel` is release.yml's own gate on
      # its wheel: the contents against this checkout, then an install from the wheel alone
      # into a scratch venv, a boot and its probes. It uses the standard library only, so it
      # runs on uv's Python with `--no-project`, and no project environment is installed.
      - name: Set up uv (wheel)
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: build the wheel (with the SPA above)
        run: uv build --wheel --out-dir dist
      - name: verify the wheel contract (contents · install from the wheel alone · boot · serve)
        run: uv run --no-project python scripts/verify_wheel.py --wheel "dist/*.whl"

  e2e-shard:
    # ── The browser specs that share a gateway, in two legs, against the ONE build `web` made ──────
    # (#3939) One job replaced four: `e2e-a11y` ran eleven `playwright test` steps, each rebuilding
    # the SPA and booting a gateway (a 43-54 s floor apiece), and one red step skipped every step
    # after it. `e2e-walkthrough`, `e2e-pwa` and `browse-live` each installed a Chromium of their
    # own. Measured on main's green run 39083799842: 20.5 + 7.1 + 1.7 + 1.5 min across four
    # runners, five Chromium installs and fourteen SPA builds per run.
    #
    # That one job then became the run's longest: 752 s on main's run 39174942130, 677 s of it the
    # shared specs on three workers, and walkthrough plus a11y 83% of that. So the run is split:
    #   · `e2e-shard`, this job: two legs, each running half of the smoke and the shared specs
    #     (`--shard=N/2`), with the auth setup each needs, and without the stateful chain
    #     (PW_STATEFUL_CHAIN=0). Playwright splits by test count, not time, so leg 1 held the
    #     smoke, a11y and the first walkthrough rows, and leg 2 the rest of walkthrough (#3941
    #     since put surfaces.spec.ts where a11y's route scans and walkthrough were);
    #   · `e2e-stateful`: the stateful set, one spec at a time, then once more in an order drawn
    #     from a seed the report names. It is its own job because a step of one leg only is a
    #     step the catalogue cannot run (tools/ci/catalogue.toml runs a sharded job's every step on
    #     every shard), and it is meant to cost a runner, not wall time: two specs, expected to
    #     be shorter than either leg (to be read from the first finished runs of this layout);
    #   · `e2e`: merges the three blob reports into the run's one report and judges it.
    # Each leg downloads the build `web` stamped, installs Chromium and boots a gateway and home of
    # its own (web/e2e/runPlaces.ts). web/e2e/isolation.ts says which spec is shared, which serial,
    # and why. The preview refuses a dist that does not match this checkout before any test runs.
    #
    # No `--reporter` on the command line: it would replace the config's reporters, and with them
    # the isolation reporter that annotates every test with its mode and fails a run in which a
    # stateful spec shares the gateway. Under CI the config writes github, json, blob and html.
    # Each leg's blob goes to a folder of its own (PLAYWRIGHT_BLOB_OUTPUT_DIR), because the blob
    # reporter empties its folder before it writes, and a run of the catalogue's legs one after the
    # other in one checkout would otherwise keep only the last. `visual.spec.ts` stays out
    # (`--grep-invert @visual`): tests/test_e2e_specs_are_executed.py declares that exemption.
    #
    # The browse behavioural proof is the `browse-live` job: security evidence, which no plan
    # leaves out, so it runs on every diff while these jobs run on the diffs their inputs reach.
    #
    # Gated on the plan (#3945) — see the `changes` job's header for why it defaults to running.
    needs: [changes, tree-check, web]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && (needs.changes.outputs.full != 'false' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-shard')) }}
    runs-on: ubuntu-24.04
    # A leg's browser run is expected near half of the one job's 677 s (an estimate until the
    # first finished runs of this layout); 30 is slack for a loaded runner, and still ends a
    # wedged browser long before the default 360.
    timeout-minutes: 30
    strategy:
      # One red leg cancels nothing: the merge reports both, and the other leg's report is whole.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
      # The harness starts `../.venv/bin/personalclaw`.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      # The build `web` stamped. The preview checks the stamp against this checkout's sources and
      # refuses a mismatch, so a dist from anywhere else fails here before a test runs.
      - name: the dashboard the web job built (web-dist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: install chromium (the one browser this leg installs)
        run: npx playwright install --with-deps chromium
      - name: this leg's half of the smoke and the shared specs (web/e2e/*.spec.ts)
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/shard-${{ matrix.shard }}
          PW_STATEFUL_CHAIN: "0"
        run: npx playwright test --project=smoke --project=chromium --shard=${{ matrix.shard }}/2 --grep-invert @visual
      # The blob is what `e2e` merges. A leg that wrote none uploads none, and the merge names it.
      - name: upload this leg's blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-shard-${{ matrix.shard }}
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7
      # This leg's own JSON report, traces and HTML report, for reading one leg on its own.
      - name: upload this leg's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-shard-${{ matrix.shard }}
          path: |
            web/e2e-report.json
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-stateful:
    # ── The stateful set, then its seeded second pass, on a gateway of its own (#3939) ───────────
    # The specs web/e2e/isolation.ts calls serial write what the shared specs read, so they run
    # apart from them: one at a time (`stateful`), then once more each in an order drawn from a
    # seed (`stateful-again-1`, `stateful-again-2`), so a stateful spec that passes only after the
    # other has run reds here. A file filter naming only stateful specs hangs the chain off `setup`
    # (web/playwright.config.ts, PW_STATEFUL_ONLY), so the auth setup runs first and no shared spec
    # runs at all, and each pass depends on the one before it: a red pass skips the passes after
    # it, and the isolation reporter reds the leg naming each test that did not run. The seed is
    # in this leg's report, on each second-pass test (`stateful-seed`), and the merge writes it
    # into the run's one report.
    needs: [changes, tree-check, web]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && (needs.changes.outputs.full != 'false' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e-stateful')) }}
    runs-on: ubuntu-24.04
    # The set took under a minute of main's one-job run (695.9-752.2 s of run 39174942130), before
    # this job's own install and boot; 15 is slack for a loaded runner.
    timeout-minutes: 15
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
      # The harness starts `../.venv/bin/personalclaw`.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      - name: the dashboard the web job built (web-dist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: install chromium (the one browser this leg installs)
        run: npx playwright install --with-deps chromium
      - name: the stateful set, then its second pass in a seeded order (web/e2e/isolation.ts)
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/stateful
        run: npx playwright test e2e/staleWrite.spec.ts e2e/deployedArtifacts.spec.ts
      - name: upload this leg's blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-stateful
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: upload this leg's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-stateful
          path: |
            web/e2e-report.json
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # ── The browser run's one report, merged from its legs and judged (#3939) ────────────────────
    # Every leg's blob report, merged into `e2e-report.json` (the JSON report: every test with its
    # isolation mode, the stateful seed in its metadata) and the HTML report, then held to what one
    # unsharded run was. It runs whatever the legs answered (`!cancelled()`), so a red leg hides
    # nothing, and it keeps the stable `e2e` name.
    #   · web/e2e/merge-legs.mjs refuses to merge when a leg left no blob: a leg that did not run or
    #     did not finish has its tests in no report, and a merge of the others would read as a
    #     whole run.
    #   · web/e2e/assert-no-route-skips.mjs: zero route-level skips, scans == declared routes ×
    #     themes, and every scan carrying every step of the matrix. It counts `surfaces.spec.ts`'s
    #     specs only, by the file the report names for each. A SKIP reads exactly like a PASS in a
    #     green job, and the UI quality check's claim is a COUNT ("every authenticated route"), so
    #     the count is asserted against the manifest.
    #   · web/e2e/assert-one-run.mjs: every test ran, once and where its isolation mode allows, the
    #     stateful set and its second pass there under one seed, each pass started after the one
    #     before it had ended (the results' own timings), and no failure or error in any leg.
    #   · every leg passed: each leg's own result, read from `needs`. A leg can fail where its
    #     report shows nothing (a step after its blob, a run that ended before its first test), so
    #     a leg that failed, was cancelled or was skipped is red here too.
    # It needs no browser and no gateway: Node, and the Playwright package `npm ci` installs.
    needs: [changes, tree-check, e2e-shard, e2e-stateful]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && (needs.changes.outputs.full != 'false' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'e2e')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: "true"
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      # Each leg's blob under a folder named for its leg: blob-report/shard-1, shard-2, stateful.
      - name: every leg's blob report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: web/blob-report
      # After a failed download too, so the leg that left nothing is named.
      - name: merge the legs into the run's one report (a leg that left no blob is a red)
        if: ${{ !cancelled() }}
        working-directory: web
        run: node e2e/merge-legs.mjs blob-report shard-1 shard-2 stateful
      - name: every authenticated route was actually SCANNED (not skipped)
        if: ${{ !cancelled() }}
        working-directory: web
        run: node e2e/assert-no-route-skips.mjs e2e-report.json
      - name: the merged report is one whole run
        if: ${{ !cancelled() }}
        working-directory: web
        run: node e2e/assert-one-run.mjs e2e-report.json
      # This job runs after a red leg (`!cancelled()` above), and a report can look whole while its
      # leg failed. So it is green only when every leg was, after the checks above have named what
      # they could. tests/rails/test_e2e_specs_are_executed_tree.py runs this step on every answer.
      - name: every browser leg passed
        if: ${{ !cancelled() }}
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          STATEFUL: ${{ needs.e2e-stateful.result }}
        run: |
          echo "e2e-shard: ${SHARDS:-no result}, e2e-stateful: ${STATEFUL:-no result}"
          if [ "$SHARDS" != "success" ] || [ "$STATEFUL" != "success" ]; then
            echo "::error title=a browser leg did not pass::the merged run counts only when every leg passed. Open the leg that did not."
            exit 1
          fi
      # The JSON report, the blobs `merge-reports` read, and the merged HTML report. Each leg's
      # traces are in its own `e2e-reports-*` artifact.
      - name: upload the browser run's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            web/e2e-report.json
            web/blob-report/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  ui-quality:
    # ── The one named UI quality check (#3941 with #3811) ────────────────────────────────────────
    # Three parts under one name, each its own step, each run whatever the step before it answered,
    # so one red run names everything that failed:
    #   · the raw-control ratchet (web/src/design/primitiveAdoption.test.ts): each file's raw
    #     <button>, <input> and dialog count, exactly as its baseline line says;
    #   · the design detector (web/scripts/designDetector.mjs), exactly against its baseline;
    #   · the `@ui-quality` browser matrix, read back from the legs' merged report by
    #     web/e2e/ui-quality-report.mjs: every route, substate URL and opened surface once per theme,
    #     and for each one that failed, every check that failed on it, in one line.
    # The matrix runs in the `e2e-shard` legs, and `e2e` holds the run whole and counts its scans;
    # this job merges the same blobs (Node only, no browser) and is the matrix's verdict under the
    # check's name. It runs beside `e2e`, not after it, so the merge tier keeps its stages. The ratchet and the detector also run in the
    # `web` job, on every tier that job runs on. Making this check required on pull requests is a
    # branch-protection setting the owner decides (#3907, #4585).
    needs: [changes, tree-check, e2e-shard, e2e-stateful]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' && (needs.changes.outputs.full != 'false' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'ui-quality')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node: "true"
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      # Each leg's blob under a folder named for its leg, merged into web/e2e-report.json as `e2e`
      # merges them.
      - name: every leg's blob report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: web/blob-report
      - name: merge the legs into the run's one report
        if: ${{ !cancelled() }}
        working-directory: web
        run: node e2e/merge-legs.mjs blob-report shard-1 shard-2 stateful
      - name: the raw-control ratchet
        if: ${{ !cancelled() }}
        run: npm run ui:ratchet
      - name: the design detector
        if: ${{ !cancelled() }}
        run: npm run design:detect
      - name: the UI matrix, every check that failed on each surface
        if: ${{ !cancelled() }}
        working-directory: web
        run: node e2e/ui-quality-report.mjs e2e-report.json

  browse-live:
    # ── The browse behavioural proof, in a real browser, on every diff ────────────────────────
    # Two guarantees of the browse safety script that only a real browser can show (a page's
    # `fetch()` / `media.play()` / `navigator.bluetooth` blocked, a client-side redirect
    # re-evaluated per `Page.frameNavigated`). Without a browser those cases skip, and a skip reads
    # as a pass, so PERSONALCLAW_REQUIRE_BROWSE_PROOF turns a missing browser into a failure. It is
    # set on that step ONLY: a contributor without a Chromium still gets a skip.
    # tests/test_browse_live_legs_run_in_ci.py holds this job to all of it. Its JUnit report keeps
    # the `junit-browse-live` name, whose lines the weekly report's browse-live row reads from the
    # telemetry history (tools/ci/report.py).
    #
    # Its own job, not a step of `e2e` (#3945): it is security evidence, which no plan leaves out
    # and no run reuses, while the browser run is planned only for the diffs its inputs reach. So
    # it waits on neither `changes` nor `tree-check`, and a push to main runs it even on a tree a
    # pull-request run tested. It needs no built dashboard, so it does not wait on `web`.
    runs-on: ubuntu-24.04
    # Two browsers (as launched, and site-isolated), 54 frame and navigation cases: about 2 min
    # locally. 20 is slack for the installs and a loaded runner.
    timeout-minutes: 20
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
      # The browse proof is pytest.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828), for Playwright's
      # browser installer.
      - name: npm ci (root)
        run: npm ci
      - name: install chromium (the browser the proof drives)
        run: npx playwright install --with-deps chromium
      # One process, pytest's default: the live fixture is module-scoped and launches a browser,
      # so xdist would launch one per worker for no gain. The modules are named explicitly rather
      # than globbed — a glob that matches nothing exits clean, and "the proof ran" is a claim
      # about specific files. test_browse_live_legs_run_in_ci.py asserts this line names every
      # module that calls the browser gate, and that each path it names exists.
      - name: browse behavioural proof in a REAL browser (safety script · redirect re-eval)
        env:
          PERSONALCLAW_REQUIRE_BROWSE_PROOF: "1"
          # No PERSONALCLAW_HOME (the no-global-home contract), and app backends are not part of
          # what these modules assert.
          PERSONALCLAW_SKIP_APP_BACKENDS: "1"
        run: uv run pytest tests/test_browse_safety_script.py tests/test_browse_cdp_live.py tests/test_browse_behavioural_proof_is_reachable.py --junitxml=reports/junit-browse-live.xml
      # "exit code 1" cannot tell a broken safety-script assertion from an unlaunchable Chromium;
      # the XML can. Same argument as `test-shard`'s upload step.
      - name: Upload JUnit results (browse proof)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-browse-live
          path: reports/junit-browse-live.xml
          if-no-files-found: ignore
          retention-days: 7

  audit:
    # ── The dependency audit (#3918) ─────────────────────────────────────────────────────────
    # The graphs core ships, read from its locks: each Python graph `uv export --locked` with
    # the extras its artifact installs, the whole root package-lock.json, build tools included,
    # and each image's own npm lock under deploy/docker/ (tools/ci/audit.py). It fails on a
    # tool that did not run, on a high or critical finding no live waiver in
    # tools/ci/audit-baseline.toml covers, and on a waiver that is expired, too long or stale.
    # Every other finding is listed in the job summary. Gated on tree-check like every job a
    # tested tree skips; a new advisory on a dependency no pull request touched stops merging
    # until it is fixed or waived, which is the point.
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
          node-cache: ""
      # pip-audit is not in uv.lock, so it is named as an exact release, in a venv of its own:
      # the project is never installed into it, so what it audits is only the exported locks.
      - name: pip-audit, in a venv of its own
        run: |
          uv venv "$RUNNER_TEMP/audit-venv"
          uv pip install --python "$RUNNER_TEMP/audit-venv/bin/python" pip-audit==2.10.1
      - name: audit the graphs core ships
        run: >-
          "$RUNNER_TEMP/audit-venv/bin/python" -m tools.ci audit run
          --pip-audit "$RUNNER_TEMP/audit-venv/bin/python" --work "$RUNNER_TEMP/audit"

  security:
    # The adversarial scanner corpus (five attack classes, the scanned-bytes==installed-bytes
    # race invariant, and the red-on-weakness meta-test) and the supply-chain scanner's tests, on
    # every pull request and every push to main, whatever tree-check says: security evidence is
    # never reused. No suite shard collects these files (tools/ci/shards.py JOB_OWNED), so this
    # is their one run per CI run, and the merge tier requires it (tools/ci/catalogue.py
    # MERGE_SECURITY_JOBS). breadth.yml runs them nightly on Linux and macOS. One process,
    # pytest's default, keeps the integrity-race output readable. Published methodology:
    # docs/security/scanner-testing.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # No PERSONALCLAW_HOME — see `test-shard`. The corpus writes only to tmp_path.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: pytest (adversarial scanner corpus)
        run: >
          uv run pytest
          --junitxml=reports/junit-security-corpus.xml
          tests/security
          tests/test_supply_chain_scanner.py
          tests/test_supply_chain_gates.py
      - name: Upload JUnit results (security corpus)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-security-corpus
          path: reports/junit-security-corpus.xml
          if-no-files-found: ignore
          retention-days: 7

  # provenance: its own workflow (.github/workflows/provenance.yml). Each push checks only its
  # own range, so the check runs where no tree-check answer or other job's outcome can drop it.

  rails:
    # ── Every rail, once per run (#3928) ───────────────────────────────────────────────────
    # A rail checks the source tree rather than running the product: a census, a ratchet, a
    # parity or wiring check. tools/ci/rails_census.py decides which modules are rails, and they
    # live in tests/rails. They run here, once, and in no suite shard: tools/ci/shards.py leaves
    # tests/rails out of every plan, so `shards check` proves no shard lists one. breadth.yml's
    # `rails-macos` leg runs the same set nightly on macOS.
    #
    # The rails run in two halves, in parallel, each under the 10-minute cap: one job running
    # all of them hit that cap on more than half of main's pushes. tools/ci/rails-half-1.txt and
    # rails-half-2.txt name each half's files, balanced by their recorded seconds, and `rails
    # check` (in `rails-checks`) fails when a rail is in neither half or in both. Leg i runs
    # rails-half-<i>.txt, each half on one leg: the CI contract row "each half of the rails runs
    # once, on its own leg" holds the matrix to the lists. The cap is never raised: a half that
    # outgrows it is rebalanced. `--shard-list` prints each worker's collection seconds and peak
    # memory under "shard collection and memory", as a shard does.
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # One red half does not cancel the other: both halves' reports land in one push.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # No PERSONALCLAW_HOME (see `test-shard`): the suite runs under the no-global-home contract.
    # The rest is `test-shard`'s environment, so a rail sees what it saw in a shard.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit each site baseline (tests/site_baseline.py) is compared with, fetched as
      # apps-contract fetches it: a line the base's copy lacks passes only with `added` and a
      # reason, and is written to this job's summary. The CI contract row "each rails half
      # compares the site baselines with the gate's base" holds this step to apps-contract's.
      - name: fetch the base commit (each site baseline is compared with its copy there)
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A push to main: the commit it replaced, since origin/main is this commit.
            echo "base: the previous main commit $BEFORE"
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # This half's modules of tests/rails, on four workers. The two halves' junit together list
      # every rail this run ran, so a rail red on main can be traced to the pull request's run
      # that ran it. BASE_SHA is the base step's commit, which the site baselines read.
      - name: the rails, half ${{ matrix.shard }} of 2 (tests/rails)
        env:
          BASE_SHA: ${{ steps.base.outputs.ref }}
        run: uv run pytest -n 4 --dist worksteal -q tests/rails --shard-list tools/ci/rails-half-${{ matrix.shard }}.txt --junitxml=reports/junit-rails-${{ matrix.shard }}.xml
      # Same argument as `test-shard`'s upload step, one artifact per half.
      - name: Upload JUnit results (rails half ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-rails-${{ matrix.shard }}
          path: reports/junit-rails-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  rails-checks:
    # ── The whole-tree checks that ran beside the rails before they were halved ─────────────
    # The census's own verdict, the asset licences, the gate aggregate and the npm advisory
    # floors over the installed tree. About two minutes; its own job so neither rails half
    # carries them.
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No PERSONALCLAW_HOME (see `test-shard`); the rest is the rails halves' environment.
    env:
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
      PERSONALCLAW_TEST_CONTAINER_RUNTIME: "1"
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
          node: "true"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # The rule itself, apart from the contract row that holds it: the census's own verdict,
      # naming any rail outside tests/rails, and any module pytest collects under tests/rails
      # (`test_*.py` or `*_test.py`) in neither of the rails job's halves
      # (tools/ci/rails-half-1.txt, rails-half-2.txt) or in both. The planner plans this job on
      # every diff, as it plans the rails.
      - name: every rail lives in tests/rails
        run: uv run python -m tools.ci rails check
      # Every tracked font, image, binary and fixture has a recorded source, licence and notice
      # in ASSET_LICENSES.json. tests/test_asset_licenses.py asserts the same thing inside the
      # suite; this step prints the checker's own list of what is missing.
      - name: bundled asset licences
        run: uv run python scripts/check_asset_licenses.py
      # ── The gate AGGREGATE, finally executed ────────────────────────────────────────────────
      # `make gates` (scripts/gate_report.py) is the one surface that reports all six ratchets
      # together — config-baseline, inert-surface, docs-lint, and the three structural gates. It
      # ran in NO workflow: every gate reached CI only through its own pytest counterpart, so a
      # green build never showed the table an operator actually reads, and a gate with no pytest
      # twin reached CI not at all.
      #
      # Run as the script rather than `make gates` so the failure names the gate instead of
      # "make: *** [gates] Error 1", and placed in `rails-checks`, the home of the whole-tree
      # checks that ran beside the rails before they were halved, so neither half carries it. It
      # imports only `scripts/*` + stdlib, so it needs no PERSONALCLAW_HOME — consistent with this
      # job's no-global-home contract.
      - name: gate aggregate (make gates)
        run: uv run python scripts/gate_report.py
      # The npm advisory floors read package-lock.json, which `test` already covers, and then the
      # INSTALLED tree, for the copies of a floored library that a package keeps inside its own
      # files (monaco-editor ships its own DOMPurify). No lockfile entry lists those, and the
      # `test` shards install no node_modules, so there that half skips. Here the tree is installed
      # and PERSONALCLAW_REQUIRE_NPM_TREE turns a missing one into a failure: a skip reads as a pass.
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      - name: npm advisory floors, copies kept inside packages included
        env:
          PERSONALCLAW_REQUIRE_NPM_TREE: "1"
        run: uv run pytest tests/test_npm_advisory_floors.py --junitxml=reports/junit-npm-floors.xml
      # Same argument as `test-shard`'s upload step (`always()`, not `success()`).
      - name: Upload JUnit results (npm advisory floors)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-npm-floors
          path: reports/junit-npm-floors.xml
          if-no-files-found: ignore
          retention-days: 7

  harness:
    # Self-verification gate: the repo-inner harness/ package
    # validates its own spec set and runs the static boundary scanner over the whole tree.
    # `validate` shape-checks every spec + resolves references (dangling test node-ids,
    # unknown profiles/scanner-checks) — a spec regression reds here, and with `--strict` so
    # does a warning: no other run checks that the shipped specs carry none. `scan` runs the
    # boundary scanner over every tracked file and fails on any ERROR finding (WARNINGs stay
    # advisory), or when git's listing is not this tree's (git fails or lists nothing, or the
    # scanner's own module is not in the checkout). It is this tier's one whole-tree scan, with
    # no `if:` of its own; breadth's is a step of rails-macos. The harness/ unit tests
    # themselves ride the `test` job (they live under tests/, which is on pytest's testpaths).
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: harness validate (spec shape + reference resolution)
        run: uv run python -m harness validate --strict
      - name: harness scan (static boundary scanner over the whole tree)
        run: uv run python -m harness scan

  client:
    # personalclaw-client (packages/personalclaw-client-py) is a package of its own,
    # published by its own release job (release.yml → PyPI env release-client) at
    # core's version: lockstep, enforced by tests/test_version_consistency.py. It has
    # its own deps (aiohttp, py3.9+) and is NOT part of the core uv workspace, so it
    # gets its own job: build the wheel and run its test suite so a break is caught
    # pre-merge. No PERSONALCLAW_HOME — the runner's $HOME is ephemeral, so the
    # data-dir test resolves ~/.personalclaw as intended.
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.12.15"
      - name: Build the client (proves packaging metadata is valid)
        # `uv build` runs the build backend in its own isolated env — no
        # `pip install --system` against the runner's PEP-668 /usr (which errors).
        run: |
          uv build packages/personalclaw-client-py --out-dir dist-client
      - name: Test the client (its own deps)
        run: |
          uv venv .venv-client
          uv pip install --python .venv-client "packages/personalclaw-client-py[dev]"
          .venv-client/bin/python -m pytest packages/personalclaw-client-py/tests --junitxml=reports/junit-client.xml
      # Same argument as `test-shard`'s upload step.
      - name: Upload JUnit results (client)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-client
          path: reports/junit-client.xml
          if-no-files-found: ignore
          retention-days: 7

  # dco: moved to its own workflow (.github/workflows/dco.yml). It needs
  # `pull_request_target` so a first-time contributor's PR is checked without a
  # maintainer approving the run first — this workflow's `pull_request` trigger is
  # held pending for new contributors, which is exactly when sign-off is missing.
