# CI — PR + feature-branch push. Fast verification gate (≤10-min budget).
# Jobs are the stable ids other roadmap plans reference (CI-RELEASE-ENGINEERING C1):
# lint · test · web · rails · harness · client. Heavier matrix/coverage/audit live in full.yml (main + nightly).
#
# TWO SIBLING WORKFLOWS EXIST BECAUSE THIS ONE CANNOT TALK TO A FORK PR.
#   dco.yml          pull_request_target — so sign-off is checked without a maintainer first
#                    approving the run, which is exactly when sign-off tends to be missing.
#   pr-feedback.yml  workflow_run — posts this workflow's lint remediation into the PR. A
#                    `pull_request` run from a fork gets a READ-ONLY token whatever its
#                    `permissions:` asks for, so CI cannot comment on a fork PR itself.
#
# Fork PRs from accounts that are not brand new to GitHub run without approval
# (repo setting `fork-pr-contributor-approval: first_time_contributors_new_to_github`).
# An account created days ago is still gated, so dco.yml + pr-feedback.yml are what a
# brand-new contributor hears from first.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs full.yml; feature branches run this

# One in-flight run per ref — a new push cancels the previous run (soul guardrail:
# no wasted runner time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # NOT pull-requests: write — a fork PR is handed a read-only token
                       # regardless, so asking for write here only looked like it worked.
                       # The remediation comment is posted by pr-feedback.yml instead.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # `harness/` is repo-inner dev infra beside src/ (SELF-VERIFICATION). `make lint`
      # lints it under the same tools as core; CI used to skip it, so a harness-only
      # lint break went green here and red for a local contributor. Same scope as the
      # Makefile now (black/isort/flake8 over src+tests+harness, mypy over src+harness).
      #
      # Every tool runs even when an earlier one fails, and its output is captured, so
      # the failure comment below names every violation at once. Otherwise a contributor
      # fixes black, pushes, and only then discovers flake8.
      - name: lint (black --check · isort --check · flake8 · mypy)
        id: lint
        run: |
          status=0
          : > /tmp/lint-out.txt
          run_tool() {
            label=$1
            shift
            if out=$("$@" 2>&1); then
              printf '%s\n' "$out"
            else
              status=1
              printf '%s\n' "$out"
              { echo "**$label**"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> /tmp/lint-out.txt
            fi
          }
          run_tool "black --check" uv run black --check src/personalclaw tests harness
          run_tool "isort --check-only" uv run isort --check-only src/personalclaw tests harness
          run_tool "flake8" uv run flake8 src/personalclaw tests harness
          run_tool "mypy" uv run mypy src/personalclaw harness
          if [ "$status" -ne 0 ]; then
            {
              echo "violations<<LINTEOF"
              cat /tmp/lint-out.txt
              echo "LINTEOF"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      # Hand the violations to pr-feedback.yml instead of commenting from here.
      #
      # WHY THIS CANNOT COMMENT ITSELF. A `pull_request` run from a FORK gets a read-only
      # GITHUB_TOKEN no matter what `permissions:` above asks for, so the github-script step
      # that used to live here could never post on a fork PR. Measured across every fork PR
      # this repo has had (#678, #680, #1210, #1211): zero `lint-help` comments, ever. The
      # contributors who most need the remediation were the only ones structurally unable to
      # receive it, and the job still went red, so the failure looked like a normal lint red.
      #
      # An artifact crosses that boundary. `pr-feedback.yml` runs on `workflow_run` in the
      # BASE repo's context, where the token really is write-capable, and posts from there.
      - name: Hand the violations to the feedback workflow
        if: failure() && github.event_name == 'pull_request' && steps.lint.outputs.violations != ''
        # 🪤 `env:`, NOT `${{ }}` inside `run:`. A `${{ }}` expression is pasted into the shell
        # script as TEXT before bash sees it, so the violations — which contain ``` fences —
        # had their backticks read as command substitution. Measured: the artifact came out
        # 54 bytes holding only the `**black**`/`**flake8**` headers, every actual violation
        # executed as a command and replaced by its empty output. It is also an injection
        # hole, since lint output echoes paths and source lines from the PR. Through `env:`
        # the runner sets the value directly and `"$VIOLATIONS"` expands without re-parsing.
        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p /tmp/lint-feedback
          printf '%s' "$VIOLATIONS" > /tmp/lint-feedback/violations.md
          # `workflow_run` payloads carry an EMPTY `pull_requests` array for fork PRs, so the
          # relay cannot look the number up — it has to be carried across in the artifact.
          printf '%s' "$PR_NUMBER" > /tmp/lint-feedback/pr.txt
          wc -c /tmp/lint-feedback/violations.md /tmp/lint-feedback/pr.txt
      - name: Upload lint feedback
        if: failure() && github.event_name == 'pull_request' && steps.lint.outputs.violations != ''
        uses: actions/upload-artifact@v7
        with:
          name: lint-feedback
          path: /tmp/lint-feedback/
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    env:
      # NOTE: do NOT set PERSONALCLAW_HOME here. The suite runs under the documented
      # no-global-home contract (CONTRIBUTING: destructive tests isolate via per-test
      # config_dir/tmp_path, NOT a global override) — several tests assert the DEFAULT
      # ~/.personalclaw resolution or patch Path.home(), and config_dir() gives
      # PERSONALCLAW_HOME precedence over Path.home(), so a global value defeats those
      # patches and reds them. The runner's $HOME is already ephemeral.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: pytest (full suite, xdist)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # npm runs from the REPO ROOT (single-root workspace lockfile — npm/cli#4828);
      # never `cd web && npm ci`. typecheck + vitest + build all run against the web workspace.
      - name: npm ci (root)
        run: npm ci
      - name: typecheck
        run: npm run typecheck:web
      - name: test (vitest)
        # Includes the design-system consistency rails (plan DESIGN-SYSTEM-CONSISTENCY,
        # C1/T3.4): tokenLint.test.ts (token-lint-strict — no raw hex/px outside the
        # shrinking allowlist) + primitiveAdoption.test.ts (bespoke-chrome ratchet:
        # raw <button>/<input>/dialog counts may only shrink) + inertUtilities.test.ts
        # (a text-*/bg-*/border-* class must compile to real CSS — a name with no
        # token emits NOTHING and styles silently vanish). A new hardcoded value, a
        # new bespoke element, or a new inert utility turns this step — and CI — red.
        # (The axe-per-route a11y rail lives in web/e2e/ and runs in the `e2e-a11y` job below —
        # the harness auth-seed it was waiting for is web/e2e/auth.setup.ts. It is a separate job
        # because the harness boots a real gateway, so it needs the Python toolchain too.)
        run: npm run test:web
      - name: test (desktop, node --test)
        # desktop/ is the OTHER member of this single root workspace, so the `npm ci`
        # above already installed it — this step costs ~0.2s and needs no extra runner.
        # 92 cases / 16 suites over the pure shell-side modules (capabilities, pushToTalk,
        # context-menu, find-bin) plus packaging.test.js, which asserts electron-builder's
        # `build.files` still lists every local require() in main.js — a stale entry there
        # ships a dmg that crashes on launch. Runs headless: every case injects its own
        # platform/fs/os, none reads process.platform and none launches electron, so an
        # `electron .` smoke test would need a display and deliberately is NOT here.
        run: npm run test:desktop
      - name: test (mobile, node --test)
        # mobile/ is the THIRD member of this single root workspace (the Capacitor shell that
        # wraps the served `#/companion` route — MOBILE-COMPANION `MC-7`), so the `npm ci`
        # above already installed it. 24 cases over the shell's pure modules: which URL the
        # WebView is handed, the private-network navigation rail, and safe-area insets actually
        # landing on an element. The NATIVE builds are deliberately not here — they need Xcode
        # and the Android SDK, so they are a maintainer step documented in mobile/README.md.
        run: npm run test:mobile
      - name: build (tsc + vite)
        run: npm run build
      # Render smoke: mount the BUILT bundle in headless Chromium and assert it
      # actually renders. typecheck/vitest/build all stayed green through the
      # v0.1.0 dual-React blank-dashboard regression — nothing above this line
      # ever loads the artifact in a browser; this step is what would have
      # caught it. Same script as the local pre-push gate (scripts/run_prepush.sh).
      - name: install chromium (render smoke)
        run: npx playwright install --with-deps chromium
      - name: render smoke (built SPA mounts in a real browser)
        run: npm run smoke:render

  e2e-pwa:
    # ── The service-worker cache rail, finally EXECUTED ──────────────────────────────────────────
    # `web/e2e/pwa.spec.ts` is the PROOF for MOBILE-COMPANION T3.1's security clause: a service
    # worker that caches an authenticated `/api` response is a data leak (a later visitor, or the
    # same browser after logout, gets the previous session's approvals off disk). `swPolicy.test.ts`
    # asserts the policy's return values and its call sites; neither can show what a browser
    # actually does. This spec installs the real worker against the real `dist/`, takes the origin
    # offline by SHUTTING THE SERVER DOWN, and observes that a navigation still renders the shell
    # while `fetch('/api/ping')` fails — the contrast is the proof.
    #
    # It ran in NO workflow. Wired here rather than folded into `e2e-a11y` so a11y and the security
    # proof fail independently: one job covering both means a red tells you "the frontend is broken"
    # instead of which contract broke.
    #
    # Platform-neutral by construction — zero snapshot assertions, and it serves its own build on a
    # private port (PW_PWA_PORT, default 10944) independent of the config's `webServer`. Measured
    # locally before wiring: 3 passed in 48s. `visual.spec.ts` is deliberately NOT here; its 32
    # baselines are all `-darwin`, so a Linux runner has nothing to compare against
    # (tests/test_e2e_specs_are_executed.py declares that exemption and retires it automatically).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The config's `webServer` starts `../.venv/bin/personalclaw`, so the gateway must import
      # even though this spec serves `dist/` itself.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: service worker never caches /api (web/e2e/pwa.spec.ts)
        working-directory: web
        run: npx playwright test e2e/pwa.spec.ts --project=chromium
      - name: upload the traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-traces
          path: web/test-results/
          if-no-files-found: ignore

  e2e-a11y:
    # ── The axe-per-route rail, finally EXECUTED ─────────────────────────────────────────────────
    # `web/e2e/a11y.spec.ts` scans every nav route and every settings panel with axe-core (both
    # themes) plus five surfaces that only exist after an interaction, and fails on any
    # serious/critical WCAG 2 AA violation. It has been in the tree, complete and passing, while
    # running in NO automated gate: the `web` job's own comment said it "mounts here once the
    # harness auth-seed lands", and that seed landed — `web/e2e/auth.setup.ts` performs the
    # gateway's real token handshake and exports a storageState the specs reuse.
    #
    # The harness is self-contained: playwright's `webServer` boots an ISOLATED gateway
    # (PERSONALCLAW_HOME under $TMPDIR, never a real home) and captures its token from the
    # PERSONALCLAW_READY line, then builds and previews the SPA against it. So this job needs both
    # toolchains and nothing else. Measured locally before wiring: 107 passed, 4 skipped
    # (the two peek docks have no rows to open in a fresh home), ~60s per theme.
    #
    # Auth stays ON — no PERSONALCLAW_AUTH_MODE=none, which would swap the csrf middleware for the
    # dev one and make every finding describe a user who does not exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The harness starts `../.venv/bin/personalclaw`, so the gateway must be importable.
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828).
      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      # `--reporter=github,json` because the step below has to READ the result: a green
      # playwright exit says the job ran, not that anything was measured.
      - name: axe per route, both themes (web/e2e/a11y.spec.ts)
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: a11y-report.json
        run: npx playwright test e2e/a11y.spec.ts --project=chromium --reporter=github,json
      # A SKIP reads exactly like a PASS in a green job, and this job's whole claim is a
      # COUNT ("every authenticated route"). So the count is asserted against the manifest
      # rather than trusted: zero route-level skips, and scans == declared routes × themes.
      # Without this, emptying a route list in web/e2e/routes.ts would shrink the gate's
      # coverage to nothing and still show a green check.
      - name: every authenticated route was actually SCANNED (not skipped)
        working-directory: web
        run: node e2e/assert-no-route-skips.mjs a11y-report.json
      # DSC-11's OTHER half. axe cannot express any of these three: whether a focus stop is
      # VISIBLE (it checks name/role, not "was the user told"), what a user with
      # prefers-reduced-motion actually gets, or whether the page pans sideways on a phone.
      # A separate step so a failure names which property broke rather than "the a11y job".
      - name: V3 walkthrough — keyboard / reduced-motion / phone (web/e2e/walkthrough.spec.ts)
        working-directory: web
        run: npx playwright test e2e/walkthrough.spec.ts --project=chromium
      # PHF-7's clause: the browser gate completes a real chat turn OFFLINE, with no
      # provider credential anywhere in the environment, against the scripted fixture
      # provider. A separate step because this one proves a different property from the
      # two above — not "is the page accessible" but "does the app still work at all
      # without a vendor". `make test-e2e` picks up every spec automatically, but CI
      # names them explicitly, so a spec not listed here runs nowhere: declared and
      # never executed is the failure class this repo's rails exist to catch.
      - name: offline scripted chat turn (web/e2e/chat.spec.ts)
        working-directory: web
        run: npx playwright test e2e/chat.spec.ts --project=chromium
      - name: upload the axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-violations
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  browse-live:
    # ── BA-2's BEHAVIOURAL proof, finally EXECUTED on the merge gate ─────────────────────────────
    # Two of BROWSE-AUTOMATION `BA-2`'s `done_when` clauses can only be proven by a real browser:
    # the injected safety script making a page's `fetch()` / `media.play()` / `navigator.bluetooth`
    # throw or return blocked, and a client-side redirect being re-evaluated per
    # `Page.frameNavigated`. tests/test_browse_safety_script.py (layer 2) and
    # tests/test_browse_cdp_live.py drive a real Chromium over raw CDP to assert them.
    #
    # The `test` job installs NO browser, so on the one machine that gates every merge those cases
    # `pytest.skip` — MEASURED: 20 of them, and a skip is reported as a pass. The clauses were
    # proven only on a developer laptop that happened to have a Chromium, and nothing would have
    # noticed if they broke. That is the false green this job closes.
    #
    # WHY ITS OWN JOB rather than a step on `web` / `e2e-pwa` / `e2e-a11y` (the three legs that
    # already install chromium):
    #   · Steps are sequential and fail-fast, so a browse step appended to `e2e-pwa` would only run
    #     when the service-worker spec passed. Making this proof's EXECUTION conditional on an
    #     unrelated frontend contract is the same defect in a new costume.
    #   · A red here names the contract ("the browse safety script / redirect re-eval broke")
    #     instead of "the frontend job is red" — the argument `e2e-pwa`'s own comment makes.
    #   · Not folded into `test` either: that job is the longest on the critical path, and the
    #     no-node route to a browser (`--extra js-render`) would put `playwright` INTO the tested
    #     environment, where the suite's own js-render capability probes can see it.
    # It reuses `e2e-pwa`'s install pattern verbatim, and runs in parallel, so it adds a runner
    # rather than wall-clock. Measured locally: 30 cases, 0 skips, 38s.
    runs-on: ubuntu-latest
    # A wedged Chromium must not hold a runner for the default 360 minutes. The suite's own
    # launch waits cap at 30s each and pytest's addopts cap a case at 120s, so 15 is slack.
    timeout-minutes: 15
    env:
      # THE lever, and the reason this job cannot pass by proving nothing. Without it a missing,
      # renamed or unlaunchable browser makes browse_chrome.missing() skip; with it, that same
      # state FAILS. So "the browser install broke" and "the guard broke" both go red here, and
      # neither can arrive as a green check. Set ONLY here: a contributor with no Chromium still
      # gets a skip, because failing on a laptop would take the whole suite down over an
      # environment. tests/test_browse_live_legs_run_in_ci.py rails this line's continued
      # existence — deleting it would restore the silent skip and nothing else would notice.
      PERSONALCLAW_REQUIRE_BROWSE_PROOF: "1"
      # Same reason as the `test` job: no PERSONALCLAW_HOME (the no-global-home contract), and
      # app backends are not part of what these three modules assert.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # npm from the REPO ROOT (single-root workspace lockfile — npm/cli#4828). Node is here for
      # ONE reason: the lock-pinned playwright CLI is what downloads the browser. The suite itself
      # speaks raw CDP and imports no playwright, in either language — which is also why the
      # browser must come from the same pin the other three chromium jobs use, rather than a
      # floating `uvx playwright`: two Chromium revisions in one repo is a difference nobody would
      # think to look for when a behavioural assertion starts disagreeing.
      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      # `-n0`: the live fixture is module-scoped and launches a browser, so xdist would launch one
      # per worker for no gain over 38 seconds. The three modules are named explicitly rather than
      # globbed — a glob that matches nothing exits clean, and "the proof ran" is a claim about
      # specific files. test_browse_live_legs_run_in_ci.py asserts this line names every module
      # that imports browse_chrome, and that each path it names exists.
      - name: BA-2 behavioural proof in a REAL browser (safety script · redirect re-eval)
        run: uv run pytest tests/test_browse_safety_script.py tests/test_browse_cdp_live.py tests/test_browse_behavioural_proof_is_reachable.py -n0

  rails:
    # Cheap anti-regression rails: the machine-checked invariants roadmap plans add.
    # Today: provider-boundary residue sweep (present on main).
    runs-on: ubuntu-latest
    # No PERSONALCLAW_HOME (see the test job) — the residue sweep is a static
    # import-boundary check and the suite runs under the no-global-home contract.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # -n0 forces serial (these rails are tiny) while keeping the pyproject
      # addopts intact — `-p no:xdist` would break because addopts injects
      # -n/--dist, which pytest then can't parse with the xdist plugin disabled.
      - name: provider-boundary residue sweep (plan 32)
        run: uv run pytest tests/test_provider_boundary_residue.py -n0
      # ── The gate AGGREGATE, finally executed ────────────────────────────────────────────────
      # `make gates` (scripts/gate_report.py) is the one surface that reports all six ratchets
      # together — config-baseline, inert-surface, docs-lint, and the three structural gates. It
      # ran in NO workflow: every gate reached CI only through its own pytest counterpart, so a
      # green build never showed the table an operator actually reads, and a gate with no pytest
      # twin reached CI not at all.
      #
      # Run as the script rather than `make gates` so the failure names the gate instead of
      # "make: *** [gates] Error 1", and placed in `rails` because that job is already the home
      # for machine-checked invariants. It imports only `scripts/*` + stdlib, so it needs no
      # PERSONALCLAW_HOME — consistent with this job's no-global-home contract.
      - name: gate aggregate (make gates)
        run: uv run python scripts/gate_report.py

  harness:
    # Self-verification gate (SELF-VERIFICATION SV-7): the repo-inner harness/ package
    # validates its own spec set and runs the static boundary scanner over this change.
    # `validate` shape-checks every spec + resolves references (dangling test node-ids,
    # unknown profiles/scanner-checks) — a spec regression reds here. `scan --diff` runs
    # the boundary scanner over the PR's changed lines and fails on any ERROR finding
    # (WARNINGs stay advisory). The harness/ unit tests themselves ride the `test` job
    # (they live under tests/, which is on pytest's testpaths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scan --diff bases on the merge-base with origin/main; fetch full history
          # so that ref resolves (it falls back to main / HEAD~1, but the true base
          # is what makes the diff scoped rather than whole-tree).
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: harness validate (spec shape + reference resolution)
        run: uv run python -m harness validate
      - name: harness scan (static boundary scanner over the diff)
        run: uv run python -m harness scan --diff

  client:
    # personalclaw-client (packages/personalclaw-client-py) is versioned + published
    # independently (release.yml → PyPI env release-client). It has its own deps
    # (aiohttp, py3.9+) and is NOT part of the core uv workspace, so it gets its own
    # job: build the wheel and run its test suite so a break is caught pre-merge
    # (plan 34 T2.3). No PERSONALCLAW_HOME — the runner's $HOME is ephemeral, so the
    # data-dir test resolves ~/.personalclaw as intended.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the client (proves packaging metadata is valid)
        # `uv build` runs the build backend in its own isolated env — no
        # `pip install --system` against the runner's PEP-668 /usr (which errors).
        run: |
          uv python install 3.12
          uv build packages/personalclaw-client-py --out-dir dist-client
      - name: Test the client (its own deps)
        run: |
          uv venv .venv-client
          uv pip install --python .venv-client "packages/personalclaw-client-py[dev]"
          .venv-client/bin/python -m pytest packages/personalclaw-client-py/tests

  # dco: moved to its own workflow (.github/workflows/dco.yml). It needs
  # `pull_request_target` so a first-time contributor's PR is checked without a
  # maintainer approving the run first — this workflow's `pull_request` trigger is
  # held pending for new contributors, which is exactly when sign-off is missing.
