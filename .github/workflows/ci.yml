# CI — PR + feature-branch push. Fast verification gate (≤10-min budget).
# Jobs are the stable ids other roadmap plans reference (CI-RELEASE-ENGINEERING C1):
# lint · test · web · rails · harness · client · dco (PR-only). Heavier matrix/coverage/audit live in full.yml (main + nightly).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs full.yml; feature branches run this

# One in-flight run per ref — a new push cancels the previous run (soul guardrail:
# no wasted runner time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # `harness/` is repo-inner dev infra beside src/ (SELF-VERIFICATION). `make lint`
      # lints it under the same tools as core; CI used to skip it, so a harness-only
      # lint break went green here and red for a local contributor. Same scope as the
      # Makefile now (black/isort/flake8 over src+tests+harness, mypy over src+harness).
      - name: lint (black --check · isort --check · flake8 · mypy)
        run: |
          uv run black --check src/personalclaw tests harness
          uv run isort --check-only src/personalclaw tests harness
          uv run flake8 src/personalclaw tests harness
          uv run mypy src/personalclaw harness

  test:
    runs-on: ubuntu-latest
    env:
      # NOTE: do NOT set PERSONALCLAW_HOME here. The suite runs under the documented
      # no-global-home contract (CONTRIBUTING: destructive tests isolate via per-test
      # config_dir/tmp_path, NOT a global override) — several tests assert the DEFAULT
      # ~/.personalclaw resolution or patch Path.home(), and config_dir() gives
      # PERSONALCLAW_HOME precedence over Path.home(), so a global value defeats those
      # patches and reds them. The runner's $HOME is already ephemeral.
      PERSONALCLAW_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: pytest (full suite, xdist)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      # npm runs from the REPO ROOT (single-root workspace lockfile — npm/cli#4828);
      # never `cd web && npm ci`. typecheck + vitest + build all run against the web workspace.
      - name: npm ci (root)
        run: npm ci
      - name: typecheck
        run: npm run typecheck:web
      - name: test (vitest)
        # Includes the design-system consistency rails (plan DESIGN-SYSTEM-CONSISTENCY,
        # C1/T3.4): tokenLint.test.ts (token-lint-strict — no raw hex/px outside the
        # shrinking allowlist) + primitiveAdoption.test.ts (bespoke-chrome ratchet:
        # raw <button>/<input>/dialog counts may only shrink) + inertUtilities.test.ts
        # (a text-*/bg-*/border-* class must compile to real CSS — a name with no
        # token emits NOTHING and styles silently vanish). A new hardcoded value, a
        # new bespoke element, or a new inert utility turns this step — and CI — red.
        # (The axe-per-route a11y rail lives in web/e2e/ and mounts here once the
        # harness auth-seed lands.)
        run: npm run test:web
      - name: build (tsc + vite)
        run: npm run build
      # Render smoke: mount the BUILT bundle in headless Chromium and assert it
      # actually renders. typecheck/vitest/build all stayed green through the
      # v0.1.0 dual-React blank-dashboard regression — nothing above this line
      # ever loads the artifact in a browser; this step is what would have
      # caught it. Same script as the local pre-push gate (scripts/run_prepush.sh).
      - name: install chromium (render smoke)
        run: npx playwright install --with-deps chromium
      - name: render smoke (built SPA mounts in a real browser)
        run: npm run smoke:render

  rails:
    # Cheap anti-regression rails: the machine-checked invariants roadmap plans add.
    # Today: provider-boundary residue sweep (present on main).
    runs-on: ubuntu-latest
    # No PERSONALCLAW_HOME (see the test job) — the residue sweep is a static
    # import-boundary check and the suite runs under the no-global-home contract.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # -n0 forces serial (these rails are tiny) while keeping the pyproject
      # addopts intact — `-p no:xdist` would break because addopts injects
      # -n/--dist, which pytest then can't parse with the xdist plugin disabled.
      - name: provider-boundary residue sweep (plan 32)
        run: uv run pytest tests/test_provider_boundary_residue.py -n0

  harness:
    # Self-verification gate (SELF-VERIFICATION SV-7): the repo-inner harness/ package
    # validates its own spec set and runs the static boundary scanner over this change.
    # `validate` shape-checks every spec + resolves references (dangling test node-ids,
    # unknown profiles/scanner-checks) — a spec regression reds here. `scan --diff` runs
    # the boundary scanner over the PR's changed lines and fails on any ERROR finding
    # (WARNINGs stay advisory). The harness/ unit tests themselves ride the `test` job
    # (they live under tests/, which is on pytest's testpaths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scan --diff bases on the merge-base with origin/main; fetch full history
          # so that ref resolves (it falls back to main / HEAD~1, but the true base
          # is what makes the diff scoped rather than whole-tree).
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: harness validate (spec shape + reference resolution)
        run: uv run python -m harness validate
      - name: harness scan (static boundary scanner over the diff)
        run: uv run python -m harness scan --diff

  client:
    # personalclaw-client (packages/personalclaw-client-py) is versioned + published
    # independently (release.yml → PyPI env release-client). It has its own deps
    # (aiohttp, py3.9+) and is NOT part of the core uv workspace, so it gets its own
    # job: build the wheel and run its test suite so a break is caught pre-merge
    # (plan 34 T2.3). No PERSONALCLAW_HOME — the runner's $HOME is ephemeral, so the
    # data-dir test resolves ~/.personalclaw as intended.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the client (proves packaging metadata is valid)
        # `uv build` runs the build backend in its own isolated env — no
        # `pip install --system` against the runner's PEP-668 /usr (which errors).
        run: |
          uv python install 3.12
          uv build packages/personalclaw-client-py --out-dir dist-client
      - name: Test the client (its own deps)
        run: |
          uv venv .venv-client
          uv pip install --python .venv-client "packages/personalclaw-client-py[dev]"
          .venv-client/bin/python -m pytest packages/personalclaw-client-py/tests

  dco:
    # Every commit in a PR must carry a Signed-off-by trailer (DCO — plan 37).
    # Pure-git check (no external action): diff the PR range against its base and
    # fail on any commit missing sign-off. PR-only — a feature-branch push has no
    # base to diff, and the merge to main preserves the signed commits.
    # Dependabot is exempt: its bot commits cannot carry a Signed-off-by trailer,
    # and dependency bumps are provenance-clear by construction. The exemption is
    # per-COMMIT (skip commits authored by dependabot), not gated on the run's
    # triggering actor — so it still holds after a maintainer pushes a fix onto a
    # dependabot branch (rebase, lockfile regen), which changes github.actor to a
    # human and would otherwise re-fail on dependabot's own unsigned commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # post the remediation comment on failure
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify DCO sign-off on every commit
        id: verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          unsigned=""
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            email="$(git show -s --format='%ae' "$sha")"
            # Skip dependabot's own commits — a bot can't sign off, and bumps are
            # provenance-clear. Maintainer commits on the same branch still checked.
            case "$email" in
              *dependabot*@users.noreply.github.com) continue ;;
            esac
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "$author"; then
              echo "::error::commit $sha is missing a matching 'Signed-off-by: $author' trailer — run: git commit -s (or git rebase --signoff)"
              unsigned="${unsigned}- \`${sha}\` — ${author}"$'\n'
              missing=1
            fi
          done
          {
            echo "unsigned<<EOF"
            printf '%s' "$unsigned"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off."
          exit "$missing"
      # On failure, post the exact fix as a PR comment (find-and-update a single
      # marked comment, so re-runs don't stack). The buried ::error:: annotation
      # is easy to miss; contributors need the remediation in the PR conversation.
      - name: Explain how to fix DCO
        if: failure() && steps.verify.outputs.unsigned != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- dco-help -->';
            const body = [
              marker,
              "### ✍️ This PR needs a DCO sign-off",
              "",
              "Every commit must carry a `Signed-off-by` trailer whose name/email match the commit author. These don't:",
              "",
              process.env.UNSIGNED.trim(),
              "",
              "**Fix — sign off every commit and re-push:**",
              "```bash",
              "git rebase --signoff origin/" + context.payload.pull_request.base.ref,
              "git push --force-with-lease",
              "```",
              "For a single commit, `git commit --amend --signoff --no-edit && git push --force-with-lease` also works.",
              "",
              "If your author identity is wrong (e.g. a placeholder email), set `git config user.name`/`user.email` to your real GitHub identity first, then rebase with `--signoff --exec 'git commit --amend --no-edit --reset-author'`.",
              "",
              "More: [CONTRIBUTING.md → DCO](../blob/" + context.payload.pull_request.base.ref + "/CONTRIBUTING.md#developer-certificate-of-origin-dco).",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          UNSIGNED: ${{ steps.verify.outputs.unsigned }}
