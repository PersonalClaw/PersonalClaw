# The rail over the single-container `docker run` one-liner in README.md.
#
# The requirement is "on a machine with only Docker and no PersonalClaw files, ONE command copied
# verbatim from README.md reaches a USABLE dashboard", and it explicitly rejects a
# healthz-only assertion: the gateway image used to answer `/api/healthz` 200 while serving
# no dashboard at all, because `setup.py`'s `BuildWithWeb` grafts `web/dist` into the
# installed package only when `web/dist` is in the build tree and nothing in
# `Dockerfile.backend` ever built it. It also asserts the image can offer its default chat
# model — the installed sign-off record and a non-null `chat_download_offer` — because the
# image once shipped without that record behind all-200 responses. A login shell in it must
# find `personalclaw`, as the dashboard's terminal needs. And, signed in, seven API endpoints
# must answer 200 with the JSON their handlers answer (step 9).
# `tools/docker_single_container_smoke.py` owns the assertions (and their negative control);
# this file only decides WHICH image it runs against. merge.yml runs the same build and smoke
# through run-job for a catalogue entry that names `{image}` (#3917), and the flip (#3915)
# retires this file.
#
# 🪤 IT BUILDS THE IMAGE, IT DOES NOT PULL `:latest`. Two reasons, and the first is the
# important one:
#
#   1. A published tag is a PAST commit. Pulling `:latest` would answer "did the last release
#      bundle the SPA", never "does the change in this PR keep bundling it" — so a PR that
#      deleted the web stage would be green here until the next release, which is the
#      regression this rail exists to catch.
#   2. `ghcr-anonymous-pull.yml` already owns the published-artifact question (both packages
#      anonymously pullable, credential-free, daily). Duplicating a pull here would add a
#      second, weaker copy of that rail rather than a new assertion.
#
# The smoke tool takes `--image`, so pointing it at `ghcr.io/personalclaw/personalclaw-gateway:latest`
# from a `workflow_dispatch` is a one-flag change if the published image ever needs checking
# directly — but that assertion cannot be green before the first release built from this
# commit, so it is deliberately not wired as a standing gate.
name: Docker single-container dashboard

# Both path lists are one: every path the Dockerfile copies and the smoke reads, image-cache.yml's
# too (tests/rails/test_ci_image_cache_tree.py). src/personalclaw/ and uv.lock are in it, so a
# backend-only change boots the image it ships (#3917).
on:
  pull_request:
    paths:
      - deploy/docker/**
      - .dockerignore
      - setup.py
      - MANIFEST.in
      - README.md
      - web/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - src/personalclaw/**
      - scripts/install_git_hooks.sh
      - scripts/installed_bundled_model_probe.py
      - tools/docker_single_container_smoke.py
      - .github/workflows/docker-single-container.yml
  push:
    branches: [main]
    paths:
      - deploy/docker/**
      - .dockerignore
      - setup.py
      - MANIFEST.in
      - README.md
      - web/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - src/personalclaw/**
      - scripts/install_git_hooks.sh
      - scripts/installed_bundled_model_probe.py
      - tools/docker_single_container_smoke.py
      - .github/workflows/docker-single-container.yml
  workflow_dispatch:

# Same branch-keyed dedupe as ci.yml — see the two traps documented in its `concurrency`
# block for why this is keyed on the branch rather than on `github.ref` or the head SHA.
# On main, as in ci.yml, one group per commit and nothing cancelled: a push to main is that
# commit's check, and a pending run replaced by the next would leave a tree unchecked.
concurrency:
  group: docker-single-container-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tree-check:
    # Did a green pull-request run of THIS workflow already build and smoke this tree? The
    # same check as ci.yml's `tree-check` (tools/ci/tree_tested.py, the previous main
    # commit's copy, read at `github.event.before`), asked about this workflow's runs. A
    # pull request or a dispatch answers no at once, and so does anything the check cannot
    # answer: the image is then built and smoked again.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # `commits/{sha}/pulls`
      actions: read         # the pull request's runs of this workflow
      issues: read          # the pull request's events: whether its base was changed
    outputs:
      tested: ${{ steps.answer.outputs.tested }}
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - name: did a green pull-request run already build and smoke this tree
        id: answer
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          answer=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            check="$RUNNER_TEMP/tree_tested.py"
            if gh api -H "Accept: application/vnd.github.raw" \
                 "repos/${GITHUB_REPOSITORY}/contents/tools/ci/tree_tested.py?ref=${BEFORE}" \
                 > "$check"; then
              GITHUB_OUTPUT="$RUNNER_TEMP/answer.txt" \
                python3 "$check" --workflow docker-single-container.yml || true
              answer=$(cat "$RUNNER_TEMP/answer.txt" 2>/dev/null || true)
            else
              echo "the previous main commit ${BEFORE} has no tree check, so the image is built" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          case "$answer" in
            tested=true|tested=false) ;;
            *) answer="tested=false" ;;
          esac
          echo "$answer"
          printf '%s\n' "$answer" >> "$GITHUB_OUTPUT"

  single-container:
    needs: [tree-check]
    if: ${{ !cancelled() && needs.tree-check.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # The image build is the long pole: a CPU-only torch install, the bundled ACP adapter
    # CLIs, and now a Node stage for the SPA. Bounded well above its measured cost rather
    # than tightly — #3326 was the cost of setting a bound BELOW a job's own runtime.
    timeout-minutes: 60
    steps:
      - name: Runner identity
        # The image this job ran on, so a runner image that moves is visible in the log.
        run: echo "runner image ${ImageOS:?not a GitHub-hosted runner image} ${ImageVersion:?no image version} on ${RUNNER_OS} ${RUNNER_ARCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release's buildx, pinned as release-artifacts.yml pins it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          # moby/buildkit:v0.34.0, the linux/amd64 manifest (this runner's platform) of index
          # sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c.
          driver-opts: image=moby/buildkit:v0.34.0@sha256:3eea2ed5d1766c44eb4740853abf56ba85ad40b2c8d4a22e047cbacf15f463c8
      - name: Build the gateway image (amd64, runtime target)
        id: image
        # `target: runtime` skips the in-image `test` stage (stage 3): this job's question is
        # whether the shipped image serves a dashboard, and ci.yml already runs the suite. The
        # layers come from main's cache, which this step reads and never writes: image-cache.yml,
        # on main, is its one writer. `github-token` is empty, so the build holds no token.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          target: runtime
          outputs: type=docker,compression=uncompressed
          push: false
          provenance: false
          sbom: false
          github-token: ""
          cache-from: type=gha,scope=gateway-runtime

      - name: Assert the README one-liner reaches a usable dashboard
        # Run from a scratch directory, per the requirement. The tool makes its own temp cwd so the
        # checkout cannot satisfy the command by accident, and rewrites only the image ref,
        # the container name and the volume name. The image is the build's own, by its content
        # ID, never a tag.
        env:
          IMAGE: ${{ steps.image.outputs.imageid }}
        run: python3 tools/docker_single_container_smoke.py --image "$IMAGE"
