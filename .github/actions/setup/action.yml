name: Set up the toolchain
description: >-
  uv with the job's exact Python, Node from .nvmrc, and the programs a catalogue job needs that
  the runner image may lack, for a job of any workflow that runs the catalogue. The job checks
  out the repository first (a local action loads only from a checkout) and keeps its own installs
  (`uv sync`, `npm ci`, which `run-job` runs for a catalogue entry) and its junit upload, which
  runs after its tests: a composite action has no post step.
inputs:
  python-version:
    description: The exact Python (X.Y.Z) setup-uv installs. Empty sets up no uv.
    default: ""
  node:
    description: '"true" sets up Node from .nvmrc.'
    default: "false"
  node-cache:
    description: >-
      setup-node's `cache`. Empty passes none, which leaves setup-node's own default: that caches
      npm too, because package.json's packageManager names npm.
    default: npm
  programs:
    description: >-
      The programs of a catalogue job's toolchain that run-job finds on PATH and does not install
      (tools/ci/plan.py SETUP_PROGRAMS: tmux, shellcheck, dash, ffmpeg, and docker, which it only
      checks for), space-separated, as the plan's matrix names them. Each one PATH lacks is installed
      from the runner's package manager.
      Empty installs none.
    default: ""
runs:
  using: composite
  steps:
    # The one uv release pyproject's [tool.uv] required-version names, with its cache pruned
    # before it is saved, and with the managed Python uv sync installs kept beside it: uncached,
    # 2 to 4 of a merge run's 23 fetches took 20 to 215 s, inside the job's budget
    # (tests/rails/test_ci_uv_cache_is_pruned.py). No release workflow uses this action.
    - name: Install uv
      if: inputs.python-version != ''
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        prune-cache: true
        cache-python: true
    - name: Install Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.node-cache }}
    # A program that is missing reds here, in this step, rather than as a skip later: run-job
    # refuses a job whose toolchain program is not on PATH, and a test gated on the program
    # would otherwise read its absence as a pass. Only the programs SETUP_PROGRAMS names, each
    # name checked before anything installs, and none read as a pattern (`set -f`).
    - name: Install the programs the job's toolchain names
      if: inputs.programs != ''
      shell: bash
      env:
        PROGRAMS: ${{ inputs.programs }}
      run: |
        set -euf
        for tool in $PROGRAMS; do
          case "$tool" in
            tmux) ;;
            shellcheck) ;;
            dash) ;;
            ffmpeg) ;;
            docker) ;;
            *) echo "the setup action installs tmux, shellcheck and dash, and checks docker, not $tool" >&2; exit 1 ;;
          esac
        done
        updated=""
        for tool in $PROGRAMS; do
          if command -v "$tool" >/dev/null 2>&1; then continue; fi
          # docker is the runner image's (e2e-pinned's pinned browser, #3943): never installed here.
          if [ "$tool" = docker ]; then echo "this runner image has no docker" >&2; exit 1; fi
          case "$RUNNER_OS" in
            Linux)
              if [ -z "$updated" ]; then sudo apt-get update -qq; updated=yes; fi
              sudo apt-get install -y --no-install-recommends "$tool" ;;
            macOS) brew install "$tool" ;;
            *) echo "no installer known for $tool on RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          command -v "$tool"
        done
