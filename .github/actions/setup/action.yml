name: Set up the toolchain
description: >-
  uv with the job's exact Python, Node from .nvmrc, and the programs a catalogue job needs that
  the runner image may lack, for a job of any workflow that runs the catalogue. The job checks
  out the repository first (a local action loads only from a checkout) and keeps its own installs
  (`uv sync`, `npm ci`, which `run-job` runs for a catalogue entry) and its junit upload, which
  runs after its tests: a composite action has no post step.
inputs:
  python-version:
    description: The exact Python (X.Y.Z) setup-uv installs. Empty sets up no uv.
    default: ""
  node:
    description: '"true" sets up Node from .nvmrc.'
    default: "false"
  node-cache:
    description: >-
      setup-node's `cache`. Empty passes none, which leaves setup-node's own default: that caches
      npm too, because package.json's packageManager names npm.
    default: npm
  programs:
    description: >-
      The programs of a catalogue job's toolchain that run-job finds on PATH and does not install
      (tools/ci/plan.py SETUP_PROGRAMS: tmux, shellcheck, dash, ffmpeg, and docker, which it only
      checks for), space-separated, as the plan's matrix names them. Each one PATH lacks is installed
      from the runner's package manager.
      Empty installs none.
    default: ""
runs:
  using: composite
  steps:
    # The one uv release pyproject's [tool.uv] required-version names, with its cache pruned
    # before it is saved, and with the managed Python uv sync installs kept beside it: uncached,
    # 2 to 4 of a merge run's 23 fetches took 20 to 215 s, inside the job's budget
    # (tests/rails/test_ci_uv_cache_is_pruned.py). No release workflow uses this action.
    - name: Install uv
      if: inputs.python-version != ''
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.1"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        prune-cache: true
        cache-python: true
    - name: Install Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.node-cache }}
    # A program that is missing reds here, in this step, rather than as a skip later: run-job
    # refuses a job whose toolchain program is not on PATH, and a test gated on the program
    # would otherwise read its absence as a pass. Only the programs SETUP_PROGRAMS names, each
    # name checked before anything installs, and none read as a pattern (`set -f`).
    - name: Install the programs the job's toolchain names
      if: inputs.programs != ''
      shell: bash
      env:
        PROGRAMS: ${{ inputs.programs }}
      run: |
        set -euf
        for tool in $PROGRAMS; do
          case "$tool" in
            tmux) ;;
            shellcheck) ;;
            dash) ;;
            ffmpeg) ;;
            docker) ;;
            *) echo "the setup action installs tmux, shellcheck, dash and ffmpeg, and checks docker, not $tool" >&2; exit 1 ;;
          esac
        done
        # Each apt-get fetch is retried, and each apt-get is cut off at its bound: the runner's own
        # mirror once hung for 55 min, where this whole step takes under 30 s. Once a job,
        # an update or install that times out or fails finishes what the cut left half done, moves
        # every source off the runner's mirror (azure.archive.ubuntu.com to archive.ubuntu.com, and
        # the arm runner's azure.ports.ubuntu.com to ports.ubuntu.com), warns which host it left
        # for which, and tries again. GitHub's x64 image names no host in ubuntu.sources: it reads
        # them from apt-mirrors.txt, the runner's own first, so the move rewrites that list too,
        # and a file the image lacks is passed over. One that still fails is the package mirror,
        # not the job's code: it fails this step under an `infrastructure` title, before any test
        # runs, so a flaky mirror never reads as a test red.
        # A runner with no coreutils `timeout` (every GitHub image has it) installs as it did before
        # the bound: unbounded, and with no move.
        bound=180
        bounded=""
        if command -v timeout >/dev/null 2>&1; then bounded=yes; fi
        apt_get() {
          if [ -n "$bounded" ]; then
            timeout "$bound" sudo apt-get -o Acquire::Retries=3 "$@"
          else
            sudo apt-get -o Acquire::Retries=3 "$@"
          fi
        }
        infra() { echo "::error title=infrastructure::$1"; exit 1; }
        moved=""
        sources="/etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list"
        sources="$sources /etc/apt/apt-mirrors.txt"
        # mirror: the host the first URI of the apt sources names, past any comment.
        mirror() {
          for f in $sources; do
            if [ -f "$f" ]; then
              while read -r line; do
                case $line in '#'*) continue ;; esac
                if [[ $line =~ ://([^/[:space:]]+) ]]; then echo "${BASH_REMATCH[1]}"; return 0; fi
              done < "$f"
            fi
          done
          echo unnamed
        }
        leave_the_mirror() {
          from=$(mirror)
          bound=300
          timeout "$bound" sudo dpkg --configure -a || true
          for f in $sources; do
            if [ -f "$f" ]; then
              text=$(< "$f")
              text=${text//azure.archive.ubuntu.com/archive.ubuntu.com}
              text=${text//azure.ports.ubuntu.com/ports.ubuntu.com}
              printf '%s\n' "$text" | sudo tee "$f" >/dev/null
            fi
          done
          to=$(mirror)
          echo "::warning title=infrastructure::the runner's package mirror ($from)" \
            "did not answer: installing from $to"
          moved=yes
        }
        # apt_or_leave <what failed> <apt-get arguments>: once a job, off the runner's mirror first.
        apt_or_leave() {
          what=$1
          shift
          apt_get "$@" && return 0
          if [ -z "$bounded" ] || [ -n "$moved" ]; then infra "$what"; fi
          leave_the_mirror
          if [ "$1" != update ]; then
            apt_get update -qq || infra "apt-get update failed from $to: $what"
          fi
          apt_get "$@" || infra "$what"
        }
        updated=""
        for tool in $PROGRAMS; do
          if command -v "$tool" >/dev/null 2>&1; then continue; fi
          # docker is the runner image's (e2e-pinned's pinned browser, #3943): never installed here.
          if [ "$tool" = docker ]; then echo "this runner image has no docker" >&2; exit 1; fi
          case "$RUNNER_OS" in
            Linux)
              if [ -z "$updated" ]; then
                apt_or_leave "apt-get update failed after its retries: $tool is not installed" \
                  update -qq
                updated=yes
              fi
              apt_or_leave "apt-get could not install $tool after its retries" \
                install -y --no-install-recommends "$tool" ;;
            macOS) brew install "$tool" || infra "brew could not install $tool" ;;
            *) echo "no installer known for $tool on RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          command -v "$tool"
        done
