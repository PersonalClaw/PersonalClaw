name: Set up the toolchain
description: >-
  uv with the job's exact Python, Node from .nvmrc, and the programs a catalogue job needs that
  the runner image may lack, for a job of any workflow that runs the catalogue. The job checks
  out the repository first (a local action loads only from a checkout) and keeps its own installs
  (`uv sync`, `npm ci`, which `run-job` runs for a catalogue entry) and its junit upload, which
  runs after its tests: a composite action has no post step.
inputs:
  python-version:
    description: The exact Python (X.Y.Z) setup-uv installs. Empty sets up no uv.
    default: ""
  node:
    description: '"true" sets up Node from .nvmrc.'
    default: "false"
  node-cache:
    description: >-
      setup-node's `cache`. Empty passes none, which leaves setup-node's own default: that caches
      npm too, because package.json's packageManager names npm.
    default: npm
  programs:
    description: >-
      The programs of a catalogue job's toolchain that run-job finds on PATH and does not install
      (tools/ci/plan.py SETUP_PROGRAMS: tmux, shellcheck, dash, ffmpeg, and docker, which it only
      checks for), space-separated, as the plan's matrix names them. Each one PATH lacks is installed
      from the runner's package manager.
      Empty installs none.
    default: ""
runs:
  using: composite
  steps:
    # The one uv release pyproject's [tool.uv] required-version names, with its cache pruned
    # before it is saved, and with the managed Python uv sync installs kept beside it: uncached,
    # 2 to 4 of a merge run's 23 fetches took 20 to 215 s, inside the job's budget
    # (tests/rails/test_ci_uv_cache_is_pruned.py). No release workflow uses this action.
    - name: Install uv
      if: inputs.python-version != ''
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.1"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        prune-cache: true
        cache-python: true
    - name: Install Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.node-cache }}
    # ffmpeg and ffprobe on Linux come from one pinned static build, not from the Ubuntu archive:
    # on 2026-11-19 the runner's mirror and archive.ubuntu.com both failed to serve ffmpeg's
    # packages for over an hour, and every suite shard went red before a test ran. The build is
    # FFmpeg-Builds' month-end release (formerly BtbN/FFmpeg-Builds; ffmpeg.org's download page
    # links it, and month-end tags are kept for years), its GPL variant for the encoders Ubuntu's
    # ffmpeg has (libx264, libopus). tools/ci/pinned-downloads.toml records it: URL, SHA-256,
    # version, provenance, and how to move it. Its bytes are held to the SHA-256 before anything
    # unpacks, a cached copy's included, and other bytes are a red, never a fallback: they are
    # not an outage. A fetch that fails falls back to the programs step below, which installs it
    # from the mirror as before, with a warning that says so. Only a push to main saves the cache,
    # and only a copy this step held to the pin. It is fetched, never re-hosted.
    - name: Restore the pinned ffmpeg build
      id: ffmpeg-cache
      if: runner.os == 'Linux' && contains(format(' {0} ', inputs.programs), ' ffmpeg ')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ffmpeg-build/ffmpeg.tar.xz
        key: ffmpeg-linux64-41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
    - name: Install the pinned ffmpeg build
      id: ffmpeg-install
      if: runner.os == 'Linux' && contains(format(' {0} ', inputs.programs), ' ffmpeg ')
      shell: bash
      env:
        FFMPEG_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
        FFMPEG_SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
        FFMPEG_VERSION: n8.1.3-27-g8dca1586f4-20261031
        FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-build
      run: |
        set -euf
        infra() { echo "::error title=infrastructure::$1"; exit 1; }
        archive="$FFMPEG_DIR/ffmpeg.tar.xz"
        mkdir -p "$FFMPEG_DIR"
        pinned() {
          digest=$(sha256sum "$archive") || return 1
          [ "${digest%% *}" = "$FFMPEG_SHA256" ]
        }
        if [ -f "$archive" ]; then
          # Only a copy this step held to the pin is ever saved: other bytes here were not saved
          # by it, so they are a red, never refetched over.
          pinned || infra "the cached ffmpeg build is not the pinned SHA-256 $FFMPEG_SHA256"
          echo "the pinned ffmpeg build, from the cache"
        else
          if ! curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 300 --output "$archive" "$FFMPEG_URL"; then
            rm -f "$archive"
            echo "::warning title=infrastructure::the pinned ffmpeg build could not be fetched" \
              "from $FFMPEG_URL: this job installs ffmpeg from the package mirror instead"
            echo "ffmpeg: from the package mirror, not the pinned build, which could not be" \
              "fetched from $FFMPEG_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pinned || infra "the ffmpeg build fetched from $FFMPEG_URL is not the pinned SHA-256"
        fi
        # Exactly the two programs, named by the archive's own listing: nothing else unpacks.
        members=$(tar -tJf "$archive") || infra "the pinned ffmpeg build could not be listed"
        wanted=""
        for tool in ffmpeg ffprobe; do
          member=$(printf '%s\n' "$members" | grep -E "^[^/]+/bin/$tool\$") ||
            infra "the pinned ffmpeg build has no bin/$tool"
          wanted="$wanted $member"
        done
        unpacked="$FFMPEG_DIR/unpacked-$FFMPEG_SHA256"
        mkdir -p "$unpacked"
        # shellcheck disable=SC2086 # each member is one word: a listed path under */bin/
        tar -xJf "$archive" -C "$unpacked" $wanted ||
          infra "the pinned ffmpeg build could not be unpacked"
        bin="$FFMPEG_DIR/bin-$FFMPEG_SHA256"
        mkdir -p "$bin"
        for member in $wanted; do
          tool=${member##*/}
          mv "$unpacked/$member" "$bin/$tool"
          chmod 0755 "$bin/$tool"
          # The program on PATH names the pinned build, so no other file can stand in for it.
          said=$("$bin/$tool" -hide_banner -version) || infra "the pinned $tool does not run"
          case "$said" in
            "$tool version $FFMPEG_VERSION "*) ;;
            *) infra "the pinned $tool does not name $FFMPEG_VERSION: ${said%%$'\n'*}" ;;
          esac
        done
        echo "$bin" >> "$GITHUB_PATH"
        echo "pinned=true" >> "$GITHUB_OUTPUT"
    - name: Save the pinned ffmpeg build
      if: >-
        runner.os == 'Linux' && contains(format(' {0} ', inputs.programs), ' ffmpeg ')
        && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        && steps.ffmpeg-install.outputs.pinned == 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ffmpeg-build/ffmpeg.tar.xz
        key: ffmpeg-linux64-41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
    # A program that is missing reds here, in this step, rather than as a skip later: run-job
    # refuses a job whose toolchain program is not on PATH, and a test gated on the program
    # would otherwise read its absence as a pass. Only the programs SETUP_PROGRAMS names, each
    # name checked before anything installs, and none read as a pattern (`set -f`).
    - name: Install the programs the job's toolchain names
      if: inputs.programs != ''
      shell: bash
      env:
        PROGRAMS: ${{ inputs.programs }}
      run: |
        set -euf
        for tool in $PROGRAMS; do
          case "$tool" in
            tmux) ;;
            shellcheck) ;;
            dash) ;;
            ffmpeg) ;;
            docker) ;;
            *) echo "the setup action installs tmux, shellcheck, dash and ffmpeg, and checks docker, not $tool" >&2; exit 1 ;;
          esac
        done
        # Each apt-get fetch is retried, and each apt-get is cut off at its bound: the runner's own
        # mirror once hung for 55 min, where this whole step takes under 30 s. Once a job,
        # an update or install that times out or fails finishes what the cut left half done, moves
        # every source off the runner's mirror (any regional host of the archive, such as
        # azure.archive.ubuntu.com or us-east-2.ec2.archive.ubuntu.com, and the security pocket's
        # security.ubuntu.com, to archive.ubuntu.com, which carries both; any regional ports host,
        # such as the arm runner's azure.ports.ubuntu.com, to ports.ubuntu.com), warns which hosts
        # it left for which, and tries again. GitHub's x64 image names only security.ubuntu.com in
        # ubuntu.sources: it reads the rest from apt-mirrors.txt, the runner's own first, so the
        # move rewrites that list too, and a file the image lacks is passed over. One that still
        # fails is the package mirror, not the job's code: it fails this step under an
        # `infrastructure` title, before any test runs, so a flaky mirror never reads as a test red.
        # A runner with no coreutils `timeout` (every GitHub image has it) installs as it did before
        # the bound: unbounded, and with no move.
        bound=180
        bounded=""
        if command -v timeout >/dev/null 2>&1; then bounded=yes; fi
        apt_get() {
          if [ -n "$bounded" ]; then
            timeout "$bound" sudo apt-get -o Acquire::Retries=3 "$@"
          else
            sudo apt-get -o Acquire::Retries=3 "$@"
          fi
        }
        infra() { echo "::error title=infrastructure::$1"; exit 1; }
        moved=""
        sources="/etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list"
        sources="$sources /etc/apt/apt-mirrors.txt"
        # mirror: the host the first URI of the apt sources names, past any comment.
        mirror() {
          for f in $sources; do
            if [ -f "$f" ]; then
              while read -r line; do
                case $line in '#'*) continue ;; esac
                if [[ $line =~ ://([^/[:space:]]+) ]]; then echo "${BASH_REMATCH[1]}"; return 0; fi
              done < "$f"
            fi
          done
          echo unnamed
        }
        leave_the_mirror() {
          from=$(mirror)
          bound=300
          timeout "$bound" sudo dpkg --configure -a || true
          left=""
          to=""
          for f in $sources; do
            if [ -f "$f" ]; then
              text=$(< "$f")
              # Each regional host of the archive or of ports the file names, whatever its region
              # and cloud, read whole from the `//` that opens it, so a host whose name ends in
              # another's is its own.
              regional=""
              for pool in archive ports; do
                rest=$text
                while [[ $rest =~ //(([A-Za-z0-9-]+\.)+$pool\.ubuntu\.com) ]]; do
                  # The pattern is a variable: bash 3.2 matches no quoted pattern opening `//`.
                  found="//${BASH_REMATCH[1]}"
                  rest=${rest//"$found"/}
                  regional="$regional ${BASH_REMATCH[1]}=$pool.ubuntu.com"
                done
              done
              for move in $regional security.ubuntu.com=archive.ubuntu.com; do
                host=${move%%=*}
                new=${move#*=}
                old="//$host"
                now="//$new"
                case $text in *"$old"*) ;; *) continue ;; esac
                text=${text//"$old"/"$now"}
                case ", $left, " in *", $host, "*) ;; *) left=${left:+$left, }$host ;; esac
                case ", $to, " in *", $new, "*) ;; *) to=${to:+$to, }$new ;; esac
              done
              printf '%s\n' "$text" | sudo tee "$f" >/dev/null
            fi
          done
          if [ -z "$left" ]; then left=$from; to=$(mirror); fi
          echo "::warning title=infrastructure::the runner's package mirror ($left)" \
            "did not answer: installing from $to"
          moved=yes
        }
        # apt_or_leave <what failed> <apt-get arguments>: once a job, off the runner's mirror first.
        apt_or_leave() {
          what=$1
          shift
          apt_get "$@" && return 0
          if [ -z "$bounded" ] || [ -n "$moved" ]; then infra "$what"; fi
          leave_the_mirror
          if [ "$1" != update ]; then
            apt_get update -qq || infra "apt-get update failed from $to: $what"
          fi
          apt_get "$@" || infra "$what"
        }
        updated=""
        for tool in $PROGRAMS; do
          if command -v "$tool" >/dev/null 2>&1; then continue; fi
          # docker is the runner image's (e2e-pinned's pinned browser, #3943): never installed here.
          if [ "$tool" = docker ]; then echo "this runner image has no docker" >&2; exit 1; fi
          case "$RUNNER_OS" in
            Linux)
              if [ -z "$updated" ]; then
                apt_or_leave "apt-get update failed after its retries: $tool is not installed" \
                  update -qq
                updated=yes
              fi
              apt_or_leave "apt-get could not install $tool after its retries" \
                install -y --no-install-recommends "$tool" ;;
            macOS) brew install "$tool" || infra "brew could not install $tool" ;;
            *) echo "no installer known for $tool on RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          command -v "$tool"
        done
