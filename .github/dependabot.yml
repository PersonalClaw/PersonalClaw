# Dependabot — native dependency update PRs (no hosted service). Weekly, grouped
# to keep PR volume low for a solo maintainer (CI-RELEASE-ENGINEERING S4).
version: 2
updates:
  # Python — the packaging metadata + uv.lock (pip ecosystem covers pyproject/uv).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  # Frontend — the single root npm workspace (web + desktop share one lockfile).
  # Merge bar: every npm PR must pass ci.yml's `web` job INCLUDING the render
  # smoke (the built bundle mounted in headless Chromium). The v0.1.0 blank
  # dashboard came from a dependabot React bump whose failure mode was invisible
  # to typecheck/vitest/build — never merge a toolchain/React bump on green
  # static checks alone.
  #
  # The framework/build/test-runtime packages below are DELIBERATELY excluded from
  # the js-deps group so each arrives as its own PR and gets individually
  # validated — a React/vite/vitest/TS major is a migration, not a bump, and must
  # never ride in a group PR where its breakage blocks safe minor/patch updates
  # (see the deferred grouped bump that mixed React 18->19, TS 5->7, vite 6->8,
  # vitest 2->4, jsdom 25->30 into one un-mergeable PR).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      js-deps:
        patterns: ["*"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
          - "@tailwindcss/vite"
          - "esbuild"
          - "rollup"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
    # TypeScript 7 is the native port, and its package main entry is
    # `lib/version.cjs` — `import ts from 'typescript'` exports `version` and
    # `versionMajorMinor` and nothing else, with the classic compiler API moved
    # behind explicitly-`unstable/*` paths. `web/scripts/extractUiProps.mjs` runs on
    # `ts.createProgram`/`ts.ScriptTarget`/`ts.SymbolFlags`/`ts.JsxEmit`, so under 7.x
    # all of them read `undefined` and `uiDocs.drift.test.ts` dies with
    # `TypeError: Cannot read properties of undefined (reading 'ReactJSX')`. That
    # extractor is the compiler-derived half of the UI-docs drift guard AND the
    # build-time source of every documented prop type, so it cannot move onto an
    # unstable API for a version bump. 6.0.3 is the highest release keeping the
    # classic API. Minor/patch on 6.x still arrive; drop this ignore once the
    # extractor has a stable 7.x API to target. Closed twice already: #976.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The GitHub Actions the workflows pin (setup-uv, setup-node, publish, buildx, …).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
