  - text: Documents
  - heading "Documents" [level=#]
  - paragraph: How generated Word, Excel and PowerPoint files behave. Download-only by default — editing one re-creates it, which is a trade worth choosing deliberately.
  - heading "Editing" [level=#]
  - paragraph: Whether an office document opens in an editor or stays download-only.
  - text: Edit documents in place Opens a generated Word document in a structural editor instead of download-only. Saving RE-CREATES the file from the structure PersonalClaw could parse, so constructs its document model cannot hold (comments, footnotes, embedded objects, exact styling) are not in the saved copy. The editor lists them before your first edit and repeats them in the save confirmation, and the version you started from is always restorable from the document's Details › Versions. With this off, office documents are read-only previews and the server refuses a document save outright.
  - status
  - switch "Edit documents in place"
