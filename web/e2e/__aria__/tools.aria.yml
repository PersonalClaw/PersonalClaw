    - paragraph:
      - text: Create a project RUN — an autonomous, multi-cycle execution (a 'loop') — from a plan you shaped with the user. USE WHEN the user wants substantial over-many-cycles work rather than a one-shot chat answer. The
      - code: kind
      - text: "selects the engine: 'code' (SDLC plan→execute in a codebase — feature/refactor/bugfix, gated stages, its own workspace + tasks), 'goal' (open-ended research-or-action toward an outcome — investigate/monitor/drive to done), 'research' (deep web research → a synthesized report), 'design' (a design <theme> — tokens/components/exports), or 'general' (a generic iterative task). Offer it, then create on the user's go. Does NOT start it — call project_run_start on their go. (To create a plain task CONTAINER instead, use project_create.) Args: kind (required), task (str, required, #+ chars — the goal/work), name?, project_id? (bind under an existing Project container), attended?, max_cycles?, success_criteria?. kind 'code': project_kind? (greenfield|brownfield), entry_stage?, workspace_dir? (brownfield needs one to start), stage_plan? ([{stage,title,objective,exit_criteria?,tasks?}]), verify_command?, test_command?. kind goal/research/design/general: sub_goals? ([str]), deliverables? ([str]), scope? ([str]), goal_type? (goal only), rubric? ([str])."
