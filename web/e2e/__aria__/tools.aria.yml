  - 'button "image_generate Asks for approval before it runs Caution Generate an image from a text prompt, using the model bound to the ''image_gen'' use-case in Settings → Models, and save it as a versioned kind=''image'' artifact; returns its slug so it can be shown, referenced, or embedded in a document. To change an existing image, pass its slug: the image is saved as that artifact''s next version instead of as a new artifact. With slug alone the model makes a new image from the prompt and never sees the current one, so the prompt describes the whole picture with the change made. Add edit=true to send the current image to the model to change as the prompt says, which only a model that edits images can do: each result says which way the bound model takes. Requires an image_gen model to be configured; if none is, it says so. # params"':
    - text: image_generate
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph: "Generate an image from a text prompt, using the model bound to the 'image_gen' use-case in Settings → Models, and save it as a versioned kind='image' artifact; returns its slug so it can be shown, referenced, or embedded in a document. To change an existing image, pass its slug: the image is saved as that artifact's next version instead of as a new artifact. With slug alone the model makes a new image from the prompt and never sees the current one, so the prompt describes the whole picture with the change made. Add edit=true to send the current image to the model to change as the prompt says, which only a model that edits images can do: each result says which way the bound model takes. Requires an image_gen model to be configured; if none is, it says so."
    - text: # params
