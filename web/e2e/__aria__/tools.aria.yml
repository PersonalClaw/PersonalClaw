    - img "Asks for approval before it runs"
    - text: Destructive
    - paragraph: "Run a shell command in the workspace — your PRIMARY way to interact with the environment. Use it for git (status/diff/branch/commit — push is blocked), running tests (pytest, npm test, go test, cargo test, make test), linters/type-checkers (ruff, eslint, tsc, go vet), builds, package managers, and any standard CLI. To read, list or search files, use read_file, list_dir, glob and grep instead: they need no approval, and reach the user's allowed working directories, knowledge sources and skill folders too. Runs in a login shell at the workspace root; stdout+stderr are merged and the exit code is reported. Sandboxed + credential/exfiltration deny-list enforced. To use a credential the user stored in Settings → Secrets, write {{secret:NAME}} where its value goes: the value is filled in when the command runs and is masked in the output, so you never see it. What a command leaves running in the background is stopped when this turn ends (in a loop, when the loop ends). Args: command (str), optional timeout (int seconds, default #, max # — raise it for a slow test suite or build)."
    - text: # params
