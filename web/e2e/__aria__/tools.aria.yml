  - button:
    - text: artifact_save
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph:
      - text: Save content as a named, versioned artifact so it persists beyond chat scrollback and can be iterated on by name in a later session. Use for widgets/HTML tools/dashboards (kind='widget'/'html'), live React components (kind='react' — content is JSX defining a top-level
      - code: App
      - text: "component authored against the window React/ReactDOM globals; renders in a sandboxed canvas), infographics (kind='infographic' — content is AntV declarative DSL, see the infographic-syntax skill), editorial long-form documents (kind='document' — the content must be semantic HTML, NOT markdown; see the editorial-document skill), or docs (kind='markdown' for markdown/prose — headings, lists, tables, code fences; or 'json'/'svg'/'text'). Rule of thumb: markdown body → kind='markdown', HTML body → kind='document'. Returns the slug — the stable handle to reference it later. Pass the slug of an existing artifact to save its next version: read it first with artifact_get and pass the base it names, since the save replaces its whole text and a version someone else made after your read is never overwritten."
    - text: # params
  - button "Disable artifact_save"
  - 'button "artifact_get Read a saved artifact by slug: its text, its version and its base. A Word document reads as the markdown document_create takes, a deck as the outline deck_create takes, a spreadsheet as the JSON sheets sheet_create takes, a PDF as its pages'' text, and every other kind as its own text. The base names the version you read; pass it to the tool that writes the next version, which refuses a write over a version someone else made after your read. A long text comes in parts of #,# characters: the reply names the offset of the next. Pass version=N for an earlier version; omit it for the live one. # params"':
    - text: artifact_get
    - paragraph: "Read a saved artifact by slug: its text, its version and its base. A Word document reads as the markdown document_create takes, a deck as the outline deck_create takes, a spreadsheet as the JSON sheets sheet_create takes, a PDF as its pages' text, and every other kind as its own text. The base names the version you read; pass it to the tool that writes the next version, which refuses a write over a version someone else made after your read. A long text comes in parts of #,# characters: the reply names the offset of the next. Pass version=N for an earlier version; omit it for the live one."
    - text: # params
  - button "Disable artifact_get"
  - 'button "artifact_update Asks for approval before it runs Caution Update a saved artifact by slug. New content (inline or via content_file) replaces its whole text as a new version, so it takes the base artifact_get named for the text you changed: a write with no base, or over a version someone else made after your read, is refused and nothing is written. Metadata alone (description/tags/collection) needs no base and cuts no version. An image, video, PDF or office document is not text: only its metadata changes here, and its next version comes from the tool that made it (image_generate, document_create, sheet_create or deck_create with slug). # params"':
    - text: artifact_update
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph: "Update a saved artifact by slug. New content (inline or via content_file) replaces its whole text as a new version, so it takes the base artifact_get named for the text you changed: a write with no base, or over a version someone else made after your read, is refused and nothing is written. Metadata alone (description/tags/collection) needs no base and cuts no version. An image, video, PDF or office document is not text: only its metadata changes here, and its next version comes from the tool that made it (image_generate, document_create, sheet_create or deck_create with slug)."
    - text: # params
