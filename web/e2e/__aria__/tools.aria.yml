  - 'button "sheet_create Asks for approval before it runs Caution Generate a real spreadsheet (.xlsx) and save it as a versioned artifact. Supply sheets (JSON text: {sheet name: rows}) for multiple tabs, or rows (JSON text: an array of row arrays) for a single tab, or csv text. Row # is treated as the header. KEEP NUMBERS AS NUMBERS (not strings) so the result can be summed and charted — that is the main reason to produce a spreadsheet rather than a table. To make the next version of an existing spreadsheet, read it with artifact_get and call this with its slug and the base that read names: a call that names an existing spreadsheet (by slug, or by the same name) with no base, or with a base someone else''s newer version has replaced, is refused and nothing is written. To make a SEPARATE spreadsheet, give it a different name. Returns the slug and where to download the file. # params"':
