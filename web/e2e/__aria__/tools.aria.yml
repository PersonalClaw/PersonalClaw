  - button:
    - text: automation_update
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph:
      - text: Patch an automation. Only settable fields apply (name, spec, gates, workflow, enabled, delivery, failure_delivery, catch_up, …); health/run fields are rejected and reported. A
      - code: workflow
      - text: "patch edits its action: each setting you send in its"
      - code: config
      - text: replaces that one, a setting sent as null is removed, and the ones you leave out stay as saved; naming another provider replaces the action.
      - code: delivery
      - text: is where its results go and
      - code: failure_delivery
      - text: "where its failures go: 'inbox' (a notification in PersonalClaw), 'none' (nothing is sent), or 'channel:<name>' for the owner's direct messages on a chat channel set up here ('channel:<name>:<chat id>' for a chat on it); a channel's own name ('telegram') means its direct messages. Any other value is refused with the channels set up here, so you can ask the owner which. An edit that changes what its action runs switches it off until the owner allows the change on the Triggers page, and letting its agent approve its own tool calls is the owner's to change, not yours. The result says where its results go and whether it runs now, as saved: tell the owner what it says."
      - code: catch_up
      - text: "(true or false) is what a missed time does: For an automation that runs at a time or on a schedule. false (the default): If one of its times is missed because PersonalClaw was stopped or the computer was asleep, it does not run late on its own: it waits on the Triggers page for you to run it or dismiss it. true: If one of its times is missed because PersonalClaw was stopped or the computer was asleep, it runs once by itself within a few minutes of PersonalClaw being back, however many times were missed, and its history says how late it ran. Set it true only when the owner wants a missed time run late rather than asked about ('even if my laptop is closed')."
    - text: # params
