  - 'button "suggest_template Asks for approval before it runs Caution Offer to save a recurring task shape as a reusable workflow template. LOCAL-ONLY: it decides whether the offer is welcome and returns the wording, it never saves anything — workflow_plan then workflow_author do that. Call it when you notice the user has asked for the same SHAPE of work several times (the shape, not the exact words: ''summarize my new issues'' and ''summarize today''s issues'' are one shape). Anti-nag rules are enforced here and the state persists, so a shape the user declined stays declined across restarts and a recently-offered one is in cooldown. When it answers no, do not mention templates in that turn. # params"':
