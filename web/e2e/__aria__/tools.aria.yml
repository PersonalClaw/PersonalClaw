      - code: rows
      - text: "(JSON text: an array of row arrays) for a single tab, or"
      - code: csv
      - text: "text. Row # is treated as the header. KEEP NUMBERS AS NUMBERS (not strings) so the result can be summed and charted — that is the main reason to produce a spreadsheet rather than a table. To make the next version of an existing spreadsheet, read it with artifact_get and call this with its slug and the base that read names: a call that names an existing spreadsheet (by slug, or by the same name) with no base, or with a base someone else's newer version has replaced, is refused and nothing is written. To make a SEPARATE spreadsheet, give it a different name. Returns the slug and where to download the file."
    - text: # params
