  - button "hook_register Asks for approval before it runs Caution Register a webhook listener so an external <theme> can inject a message into a dedicated agent session later. Returns the webhook URL and session key. Use this when you need to hand off to an external process (e.g. submit a PR, then wait for CI to call back with results). The external <theme> POSTs its results to the returned URL with the owner's webhook token, from the machine PersonalClaw runs on (or through an SSH tunnel or a relay there); the result says exactly what to send. The callback does not run until the owner allows it on the Triggers page, so tell them it is waiting; registering it again with other context waits for them again. # params":
