  - text: personalclaw-automation built-in · #
  - button "Disable provider personalclaw-automation"
  - button:
    - text: automation_create
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph:
      - text: Create an automation from ONE natural-language message. Use for 'when a file in ~/notes changes', 'every weekday at #', 'at #pm', 'when my nightly run finishes', 'when the research run #c#c#ab finishes'. The
      - code: when
      - text: "phrase is routed to the right trigger kind (file/clock/web_watch/run_completed/…) — a time runs it once at that time, in the owner's timezone, a cadence becomes a repeating schedule, an event becomes an event trigger, and a run finishing runs it when that run ends: name the run in"
      - code: when
      - text: by its id, or by the automation's or the workflow's name. Give
      - code: when
      - text: +
      - code: name
      - text: +
      - code: message
      - text: "(what the automation should do). When it is to send the owner words they gave ('message me …: …', 'remind me …: …'), give them in"
      - code: say
      - text: instead of
      - code: message
      - text: ": they go out as written, and no agent runs. When the owner named the chat channel ('on Telegram'), give it in"
      - code: via
      - text: ": the words in"
      - code: say
      - text: ", or what the"
      - code: message
      - text: task produced, go out there and on no other channel; a chat on it goes in
      - code: to
      - text: . For a button or anything the owner runs on demand ('make me a button that runs …', 'something I can run when I want'), give
      - code: kind
      - text: "'manual' and no"
      - code: when
      - text: ": it runs only when the owner runs it, and the chat shows it with a Run now button. A chat widget's button cannot run anything: it only sends its action back here. When the job writes something ('summarise it into ~/notes/kitchen.md'), name those files in"
      - code: changes
      - text: ": its agent then may change them and nothing else. Without"
      - code: changes
      - text: its agent only reads. Announced to you on creation with the time it read, and capped by workflows.self_schedule_max_outstanding. One that sends
      - code: say
      - text: is active at once; one that runs
      - code: message
      - text: does not run until the owner allows it on the Triggers page. The result says which, so tell the owner what it says.
    - text: # params
  - button "Disable automation_create"
