  - button:
    - text: notify
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph: "Notify the user via their configured notification channel(s) (dashboard notification, plus any connected messaging channel such as Slack or Discord). By default reaches the owner. Use this whenever you decide someone should be told something — most commonly in silent cron jobs, but any time proactive notification is needed. Delivery contract for cron jobs: Try the originating dashboard session first (session=\"origin\"), so the session agent can react to the message, not just display it. When injection succeeds, the message appears in the chat UI — no extra notification is fired. Fall through to the owner's messaging channel if origin is unreachable (tab closed, history deleted, or cron has no origin — e.g. created from the dashboard UI). On the fallback path (including session=\"channel\" and non-cron callers), a dashboard notification also fires so messages that couldn't reach their origin still surface. Invariant: messages are never silently dropped. session param: \"origin\" — inject into the session that spawned this cron. \"channel\" — explicitly route to the owner's messaging channel, bypassing origin. omitted + cron caller → auto-applies \"origin\" (you usually want this — pick \"channel\" only if the message should specifically reach the messaging channel and not the spawning chat). omitted + non-cron caller → owner channel (default behavior). Explicit channel=..., user=... or via=... always wins and suppresses the auto-default. via: when the owner named the chat channel to reach them on ('message me on Telegram'), give its name. Only that channel sends it. An automation's agent, which may change nothing, can still tell the owner what it found: give only text, title and via."
    - text: # params
