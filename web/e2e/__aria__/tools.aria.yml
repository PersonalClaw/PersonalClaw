  - text: Tool groups · # groups, # tools
  - switch "Tool groups"
  - paragraph: "Every tool schema an agent carries costs context on every turn. Groups let a session load only the groups it needs and pick up the rest on demand — the agent activates them itself mid-task. Currently off: every session loads every group."
  - paragraph: Nothing is ever unavailable — a tool stays callable by name even when its group is not loaded, and the agent can search across all of them.
  - text: Core # always Artifacts # Automation # Calendar # Workflows # Computer Use # Inbox # Knowledge # Memory # Prompts # Subagents # Tasks # Design <theme> # What each surface would start with
  - paragraph: Groups are off, so every surface currently starts with every group. Turning them on would apply the defaults below.
  - text: Chat every group Background tasks core, memory Autonomous runs core, subagents, workflows Subagents core, memory
  - paragraph:
    - text: Tune these with
    - code: tools.group_defaults
    - text: in config. A surface listed as “every group” behaves exactly as it did before groups existed.
  - text: personalclaw-artifacts built-in · #
