  - button:
    - text: document_create
    - img "Asks for approval before it runs"
    - text: Caution
    - paragraph:
      - text: Generate a real Word document (.docx) from MARKDOWN and save it as a versioned artifact the user can download. Write ordinary markdown — headings, paragraphs, bullet and numbered lists, tables, fenced code,
      - code: "---"
      - text: "for a page break — and it is rendered into the document. Do NOT attempt to emit OOXML or base#. Use this when the user wants a file to send, print or hand to someone; use artifact_save with kind='markdown' or 'document' when they just want to read it in the app. To make the next version of an existing document, read it with artifact_get and call this with its slug and the base that read names: a call that names an existing document (by slug, or by the same name) with no base, or with a base someone else's newer version has replaced, is refused and nothing is written. To make a SEPARATE document, give it a different name. Returns the slug and a download URL."
    - text: # params
