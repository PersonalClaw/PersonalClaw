  - button "Settings"
  - text: Usage
  - heading "Usage" [level=#]
  - paragraph: "What you've spent — real tokens and real USD from a per-call ledger: every turn (chat, rooms, subagents, loops, automations) and every call PersonalClaw makes around them, from a chat's title and follow-ups to judges and digests. A call that does not finish writes no row and is recorded only in a separate log; the 'By day and purpose' section states how much that is. Observation only: nothing here caps or throttles a turn (that's Guardrails). A model with no price is shown honestly as 'unpriced', never $#.#, until you give it one under Model prices."
  - radiogroup "Usage period":
    - radio "Today" [checked]
    - radio "# days"
    - radio "# days"
  - text: $#.# cost # tokens # turns
  - heading "By day and purpose" [level=#]
  - paragraph: How today broke down.
  - text: No turns recorded today.
  - heading "Model prices" [level=#]
  - paragraph: "What a model's calls are counted at by the daily dollar cap, this page and cost-aware routing, in the unit the model is billed in: each model your uses are bound to, and each one spent on in the last # days. Your price comes first, for any model, a known one included, and resets to the default it stands in front of. A list price from PersonalClaw's table is the model maker's on the day it was recorded; whoever runs the model may bill differently, so set your own if it does. A model nothing prices counts toward no dollar figure, and a daily dollar cap refuses its calls, until it has one; a price of $# declares it free."
  - text: No models are bound yet. Bind one in Settings → Models, or add a price for one below.
  - button "Add a price"
  - heading "By model" [level=#]
  - paragraph: Which models this period's cost went to.
  - text: No model usage recorded this period.
  - heading "By provider" [level=#]
  - paragraph: Which provider each answer came from, as your model settings name it.
  - text: No provider usage recorded this period.
  - heading "By source" [level=#]
  - paragraph: Which subsystem spent — chat, rooms, subagents, loops, automations.
  - text: No usage recorded this period.
  - heading "Cache savings" [level=#]
  - text: No prompt-cache activity yet — cached tokens appear here once a provider reports them.
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
