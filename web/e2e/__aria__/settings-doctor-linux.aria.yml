  - text: Doctor
  - heading "Doctor" [level=#]
  - paragraph: Health probes across every subsystem — memory, channels, local models, app backends, the SPA symlink, and model-provider breakers. A degraded capability never means the gateway is down; only a core failure does. Probing changes nothing on your machine; the two controls that do are a failed probe's Fix, which confirms first and is written to the security audit, and Maintenance → Run now, which also confirms and lists its exact plan above the button.
