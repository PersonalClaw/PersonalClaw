  - group: "Agents no chat started ask before they act Approval mode is Ask each time: an agent no chat started (a trigger's Invoke Agent agent, a subagent started outside a chat) asks you in your Inbox before each call that needs approval, unless its automation or loop was allowed to run on its own."
  - text: Sandbox
  - button "Investigate in chat"
  - group: Sandbox pids/RSS enforcement pids and RSS ceilings are NOT enforced on this host — no live systemd user bus (DBUS_SESSION_BUS_ADDRESS unset and $XDG_RUNTIME_DIR/bus absent) — 'systemd-run --user' cannot connect. The NOFILE limit still applies to every spawn. No pids or RSS ceiling is configured, so nothing is being silently dropped.
  - group: POSIX resource-limits (rlimit) availability POSIX resource limits (rlimit) available — the gateway raises its own NOFILE ceiling at boot and the sandbox shim can apply rlimit ceilings.
