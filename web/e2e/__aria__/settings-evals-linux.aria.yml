  - region "Evaluations":
    - heading "Evaluations" [level=#]
    - paragraph: Measure whether a change actually helped — paired A/B studies over prompt templates, retrieval and judge benchmarks, and monthly ablations that ask whether a component earns its keep. Nothing runs on a schedule you did not set; every result is a file you can read.
    - heading "The substrate" [level=#]
    - paragraph:
      - text: Off by default. Turn it on and the results appear on
      - link "Learning":
        - /url: "#/learning"
      - text: ", which is where the four eval panels live."
    - text: Evals enabled Turn on the offline eval substrate — pre-registered studies, ablation reports, the retrieval/judge benchmarks. Off by default; nothing runs until you invoke a study or benchmark. Results are files under ~/.personalclaw/evals/, never a background service. Enabling it spends nothing; the studies it unlocks spend real model calls — the judge that scores them is a model too, so set a budget below first.
    - status
    - switch "Evals enabled"
    - heading "The model the evals score against" [level=#]
    - paragraph: Paired evals call a model directly, and they are the one place that will not borrow the one your chats use without being told to. Leave it empty to fall back to your default chat model.
    - text: Benchmark model The Provider:model the paired evals score against — the loop-# gate, the ablation report and the skills bench. Empty falls back to your default chat model; when neither resolves, a run REFUSES to score instead of reporting a zero it never measured. It is named here rather than inherited because an eval cell is spawned with no ambient credentials, so the model it uses has to be expressed for the run's pin to record what actually answered.
    - textbox "Benchmark model":
      - /placeholder: Provider:model
    - button "Save" [disabled]
    - status
    - heading "Study defaults" [level=#]
    - paragraph: What a study assumes when it does not say otherwise. Each study still declares its own k and budget at registration; these are the values it inherits.
    - text: Study runs per arm (k) How many paired runs per arm a template A/B study takes by default. k≈# is the smallest paired design that survives judge noise; higher k buys confidence at a linear cost in runs and judge calls.
    - spinbutton "Study runs per arm (k)": "#"
    - status
    - text: Judge agreement floor Below this position-swap agreement rate a study's verdict is 'judge_unreliable' — it files a judge-calibration item instead of a template verdict, so a noisy judge never produces a fake win.
    - spinbutton "Judge agreement floor": "#.#"
    - status
    - text: Default eval budget (USD) The default hard spend cap a matrix/study run refuses to exceed. # means no default cap — each study still declares its own budget at registration.
    - spinbutton "Default eval budget (USD)": "#"
    - status
    - heading "Ablation" [level=#]
    - paragraph: Turning one component off — or down to a declared cheaper form — and replaying the benchmark, so its delta says whether it earns its keep.
    - text: Ablation cadence (days) How often the harness-ablation runner picks one component to measure keep/remove/lighten. Monthly by default — component payoff drifts on the timescale of model upgrades, not days.
    - spinbutton "Ablation cadence (days)": "#"
    - status
  - region "AI feedback":
    - heading "AI feedback" [level=#]
    - paragraph: Every 👍/👎 you leave on an AI judgment (inbox triage, drafts, digests, loop findings) is attributed to the source that produced it — the bound prompt, judge, or rule. A source that keeps being wrong asks to be reviewed; where that kind of source has a surfacing gate (today, skills) it also stops surfacing. Everything here is deterministic counting; nothing leaves this machine.
    - heading "Judgment sources" [level=#]
    - paragraph: Rolling #-day window · accuracy shown after # verdicts. History restarts when you rebind a prompt (a new prompt is a new source).
    - text: No feedback yet — 👍/👎 appear on inbox classifications, drafted replies, digests, loop findings, and synthesized skills. Verdicts collect here per judgment source.
    - heading "Tuning" [level=#]
    - paragraph: When a source has enough verdicts to judge, how far back they count, and how bad it has to get before PersonalClaw asks you to retire it.
    - text: Collect feedback Show 👍/👎 on AI judgment outputs and track per-source accuracy. Off means the thumbs never render, so nothing new is attributed — verdicts already recorded are kept.
    - status
    - switch "Collect feedback" [checked]
    - text: Minimum verdicts How many verdicts a source needs before its accuracy is shown or acted on. Below this the row reads “collecting” and no number is shown.
    - spinbutton "Minimum verdicts": "#"
    - status
    - text: Attribution window (days) How far back verdicts count toward a source's rolling accuracy. Older verdicts stop counting rather than being deleted.
    - spinbutton "Attribution window (days)": "#"
    - status
    - text: Retire threshold Accuracy below which a source (with enough verdicts) earns a “retire this rule?” proposal — and stops surfacing where that kind of source has a surfacing gate. #.# means “wrong more than # times in #”.
    - spinbutton "Retire threshold": "#.#"
    - status
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
