  - text: Ambient surfaces
  - heading "Ambient surfaces" [level=#]
  - paragraph: Your composable home and agent-authored widgets. Nothing here is enabled behind your back — agent tiles are proposals you accept.
  - heading "Composable home" [level=#]
  - paragraph: Pin saved artifacts as self-refreshing dashboard tiles.
  - text: Composable home Turn saved artifacts into pinnable dashboard tiles. Off leaves the dashboard as its fixed default layout and refuses new pins — the tiles you already pinned are kept, and come back when you turn this on.
  - status
  - switch "Composable home" [checked]
  - text: Max tiles per view Cap on how many artifact tiles a single view can hold — an unbounded home is an unreadable one.
  - spinbutton "Max tiles per view": "#"
  - status
  - text: Default tile refresh (seconds) How often a TTL-mode tile re-runs its bound data workflow. A view-trigger binding overrides this.
  - spinbutton "Default tile refresh (seconds)": "#"
  - status
  - heading "Generative UI" [level=#]
  - paragraph: Agent-authored widgets, rendered through the typed component registry.
  - text: Generative UI Let agent-authored widgets render through the typed component registry alongside markdown. Off refuses every widget request — in chat, in a workflow node and on a tile — and says so instead of producing one.
  - status
  - switch "Generative UI" [checked]
