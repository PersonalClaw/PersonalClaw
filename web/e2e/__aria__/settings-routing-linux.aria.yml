  - button "Settings"
  - text: Routing & Efficiency
  - heading "Routing & Efficiency" [level=#]
  - paragraph: "Real per-model efficiency for each kind of request — success rate, feedback, latency, and cost per call, measured as models handle work. A model is on the frontier when no other model beats it on all of quality, speed, and cost. Routing policy, below, turns that observation into a decision: which of your bound models this use case tries first."
  - heading "Router" [level=#]
  - paragraph: Whether PersonalClaw may reorder your bound models at all, and how much evidence it needs before it does.
  - text: Adaptive routing Master switch. Off means every use case resolves in the exact order you bound its models. On lets PersonalClaw prefer a local model for work it handles well and fall back to a cloud model when it can't.
  - status
  - switch "Adaptive routing"
  - text: Local attempt timeout (seconds) How long a local model gets before the call falls back to the next model you bound. Keeps a slow local model from stalling background work.
  - spinbutton "Local attempt timeout (seconds)": "#"
  - status
  - text: Minimum samples How many recorded calls a model needs for a kind of request before its measured score may influence order. Below this, the simple local-first rule stands.
  - spinbutton "Minimum samples": "#"
  - status
  - text: Hysteresis margin How much better a model's score must be before the order actually changes. Prevents flip-flopping between two near-equal models.
  - spinbutton "Hysteresis margin": "#.#"
  - status
  - text: Cloud quality margin How much better a cloud model must score than a local one to be tried first. Free and private wins ties.
  - spinbutton "Cloud quality margin": "#.#"
  - status
  - text: Re-proposal cooldown (days) After you reject a suggestion below, how long before the same change may be suggested again.
  - spinbutton "Re-proposal cooldown (days)": "#"
  - status
  - text: Use case
  - radiogroup "Routing use case":
    - radio "Chat" [checked]
    - radio "Code & tools"
    - radio "Reasoning"
  - text: Request kind
  - combobox "Request kind":
    - option "Short chat" [selected]
    - option "Code"
    - option "Summarize"
    - option "Extract structured"
    - option "Long reasoning"
  - heading "Model efficiency" [level=#]
  - text: No routing telemetry recorded for this yet. On this axis only the calls automation makes are measured, such as a loop’s judge or a knowledge step, so it fills in as they run. The turns you type here stay outside the model-call guard.
  - heading "Proposed routing changes" [level=#]
  - text: Nothing proposed. When measurements show one of your models clearly beating another for a request kind, the change is proposed here — routing never rewrites your table on its own.
  - status
  - heading "Routing policy" [level=#]
  - paragraph: Which of your bound models this use case tries first. Routing only reorders the models you already bound — it never adds or removes one, and an unavailable model still reports an error rather than being quietly swapped. Routing is currently off globally, so this order is not applied yet.
  - text: Routing doesn't apply to this use case — it runs on background work (reasoning, loops, orchestration), not on interactive chat.
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
