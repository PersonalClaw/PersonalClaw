  - text: Import / Export
  - heading "Import / Export" [level=#]
  - paragraph: Take your data out of this instance, or bring an archive in from another one.
  - heading "Export" [level=#]
  - paragraph: Download your data as a portable archive. Credentials are never included.
  - button "Export everything"
  - text: Every non-derived store PersonalClaw holds. Credentials never travel.
  - button "Export knowledge"
  - text: Your documents — the files/ originals, plus the knowledge and lexicon stores.
  - button "Export memory"
  - text: "The assistant's own memory: what it recorded about you, and its learning log."
  - paragraph: Rebuildable caches (search indexes, model files) are left out — they regenerate, and a stale index restored next to newer data is worse than none. Large workspaces can take a minute to package.
  - heading "Import" [level=#]
  - paragraph: Bring settings and data in from another PersonalClaw instance.
  - text: Importing merges the archive's data into this instance — nothing you already have is overwritten. Choosing a file checks it first and shows what it contains.
  - button "Choose archive…"
  - button "Import" [disabled]
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
