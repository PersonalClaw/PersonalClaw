  - region "Needs you":
    - region "Waiting on your answer #":
      - heading "Waiting on your answer #" [level=#]
      - list:
        - listitem:
          - button "Show the details of bash"
          - group "Permission needed to run bash":
            - text: Permission needed Destructive From automation “Nightly”
            - paragraph: bash(rm -rf build)
            - paragraph: Clear the build folder
            - paragraph: Answer it in the panel
        - listitem:
          - button "Show the details of Ship v#.#?"
          - text: Workflow release
          - paragraph: Ship v#.#?
          - 'button "Approve: Ship v#.#?, release"': Approve
          - 'button "Deny: Ship v#.#?, release"': Deny
        - listitem:
          - button "Show the details of Sign in to the bank’s site"
          - text: Automation Bank statements
          - paragraph: Sign in to the bank’s site
          - 'button "Approve: Sign in to the bank’s site, Bank statements"': Approve
          - 'button "Deny: Sign in to the bank’s site, Bank statements"': Deny
        - listitem:
          - button "Show the details of May I archive last year’s mail?"
          - text: Loop Sort the inbox
          - paragraph: May I archive last year’s mail?
          - 'link "Answer it where it asks: May I archive last year’s mail?, Sort the inbox"':
            - /url: "#/loops/l-e#e"
            - text: Answer it where it asks
          - textbox "Reply to May I archive last year’s mail?, Sort the inbox":
            - /placeholder: "Reply in one line: Enter sends"
    - region "To review #":
      - heading "To review #" [level=#]
      - list:
        - listitem:
          - 'button "Show the details of Skill: incident-writeup"'
          - text: New skill
          - paragraph: "Skill: incident-writeup"
          - paragraph: Write up an incident from its timeline and its fixes.
          - 'button "Accept: Skill: incident-writeup"': Accept
          - 'button "Reject: Skill: incident-writeup"': Reject
        - listitem:
          - button "Show the details of Keep a weekly digest of what the agents did"
          - text: Proposal Learning
          - paragraph: Keep a weekly digest of what the agents did
          - 'link "Open it in the Inbox: Keep a weekly digest of what the agents did, Learning"':
            - /url: "#/inbox?open=ib-e#e-#"
            - text: Open it in the Inbox
  - region "bash":
    - button "Close"
    - heading "bash" [level=#]
    - group "Permission needed to run bash":
      - text: Permission needed Destructive From automation “Nightly”
      - paragraph: bash(rm -rf build)
      - paragraph: Clear the build folder
      - button "Allow bash — automation “Nightly” — Clear the build folder": Allow
      - button "Deny bash — automation “Nightly” — Clear the build folder": Deny
    - term: Asked by
    - definition: Automation “Nightly”
    - term: Asked
    - definition: #:# <am/pm>
- contentinfo "Status":
