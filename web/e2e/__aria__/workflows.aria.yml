  - heading "No workflow runs yet" [level=#]
  - paragraph: A run is one execution of a workflow — every step, its output, and where it stopped. Pick a starting point and the next screen asks for what it needs.
  - button "Work on code — code-project": "Work on code code-project Build or fix software behind four structural gates: a gated initializer, WIP=#, a reproduction before any edit on a bug, a baseline captured before the first mutation, and a deliverable gate that runs the metric AND the regression command."
  - button "Research a topic — deep-research": "Research a topic deep-research Research a question in judged rounds: sweep search angles, read the sources, fold cited evidence into the run's own RESEARCH.md, and stop when a round adds nothing new."
  - button "Design something — design-project": Design something design-project Explore a design through divergent framings, then converge by minimal diff.
  - button "Pursue a goal — goal-pursuit-open-ended": Pursue a goal goal-pursuit-open-ended Pursue an open-ended goal in judged cycles until progress dries up.
  - button "Plan a project — project-planning": "Plan a project project-planning Turn a goal into a plan: understand the scope, research the domain and audit what exists in parallel, then design an approach and stage it for review."
  - button "Loop until done — general-project": Loop until done general-project Iterate on any task in judged steps until it is genuinely done.
  - button "Browse all definitions"
  - complementary "A tip from Discover":
    - paragraph: Start a conversation
    - paragraph: Chat is the front door — ask a question, hand over a task, or think out loud, and PersonalClaw picks the tools and agents it needs on its own.
