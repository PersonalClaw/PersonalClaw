    - 'button "Mode: <theme>"': <theme>
    - 'button "Mode: <theme>" [pressed]': <theme>
    - 'button "Mode: Auto"': Auto
    - text: Personality
    - paragraph: "A personality is a whole identity, not just a palette: it sets the colors, the wordmark, the tab title, the interface density, and the motion and backdrop dials together — and can offer the assistant a matching name. Every one of those stays yours to adjust afterwards, and picking one never changes your saved configuration without asking."
    - button "PersonalClaw The default identity — coral, the claw wordmark, no persona." [pressed]:
      - text: PersonalClaw
      - paragraph: The default identity — coral, the claw wordmark, no persona.
