      - radio "All" [checked]
      - radio "Needs You"
      - radio "Running Now"
      - radio "Recent and completed"
    - region "Needs You":
      - heading "Needs You" [level=#]
      - paragraph: Nothing is waiting on you.
      - button "Show health-check status"
      - button "Break a goal into tasks"
      - button "Save a note to my knowledge base"
      - button "Run a command and explain the output"
      - button "What can you help me with?"
      - button "Set up a daily briefing"
      - button "Refresh"
    - region "Running Now":
      - heading "Running Now" [level=#]
      - paragraph: Nothing is running right now.
    - region "Recent and completed":
      - heading "Recent and completed" [level=#]
      - paragraph: Nothing has finished lately, and you have no threads yet.
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
