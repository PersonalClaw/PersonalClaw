  - text: Your patterns # user additions on top of the baseline
  - textbox "Add a shell denylist pattern (regex)":
    - /placeholder: e.g. my-secret-tool .*
  - button "Add" [disabled]
  - heading "Git push" [level=#]
  - paragraph: "Off by default: no agent may push. When on, an agent may push a branch with an ordinary push written as one command (git -C <dir> push … from another folder; cd <dir> && … is refused). Each push still asks you first in a chat, and is refused in a run nobody watches unless your own rules allow it. A force push without an explicit lease (--force-with-lease=<ref>:<expected-sha>), --mirror, deletes, :<ref> and +<ref> refspecs, --all, --tags, --prune and --no-verify stay refused. Only you can change this, here or from your own terminal."
  - text: Let agents push a branch
  - status
  - switch "Let agents push a branch"
  - heading "Credential storage" [level=#]
  - paragraph: Where this instance keeps provider credentials. The default is the .env file in this instance's home folder, at mode #; the OS keychain (macOS Keychain, <platform> Secret Service, Windows Credential Locker) is an opt-in upgrade. A machine with no usable secret service keeps using .env and says so — there is never a third location.
  - text: .env at mode # # in the keychain · # still in .env
  - switch "Store credentials in the OS keychain" [disabled]
  - text: Store credentials in the OS keychain This install of PersonalClaw has no keychain support, so there is no OS keychain to keep credentials in. Installing PersonalClaw with its keychain extra (personalclaw[keychain]) adds it. Credentials stay in .env at mode #.
  - button "Move to keychain" [disabled]
  - heading "Child process ceilings" [level=#]
  - paragraph: Limits applied to processes the agent can influence — bash tools, app backends, MCP servers, hook and cron scripts. They take effect on the next spawn; a running child keeps the limits it was started with. # disables an individual limit.
  - paragraph: Here, Max memory bounds each process of a child on its own, and Max processes counts every process you run, so neither contains a child's whole process tree. Bounding the whole tree needs cgroup scopes, which this machine can't run (no live systemd user bus (DBUS_SESSION_BUS_ADDRESS unset and $XDG_RUNTIME_DIR/bus absent) — 'systemd-run --user' cannot connect). Max open files is enforced.
  - text: Max open files Open-file ceiling for an agent child process. # disables the cap. Connected CLI agents are exempt by profile — they multiplex many pipes and would hit it immediately.
  - spinbutton "Max open files": "#"
  - status
  - text: "Max memory (MB) Address-space ceiling for an agent child. # disables it, which is the default: the limit is coarse and can break memory-mapped toolchains, so it is opt-in."
  - spinbutton "Max memory (MB)": "#"
  - status
  - text: Max processes Process ceiling for an agent child. # disables it, and leaving it at # is the recommendation — this limit counts ALL of your existing processes, not just the child's, so an absolute cap can make a busy machine fail with “cannot fork”. Real per-child containment is the cgroup tier below.
  - spinbutton "Max processes": "#"
  - status
  - text: Cgroup scopes (<platform>) Wrap each agent-influenced spawn in a transient systemd user scope carrying the ceilings above, so they bound the child's WHOLE process tree instead of one process. This is the fork-bomb containment the process limit cannot give. <platform> only, and a no-op where a systemd user manager is unavailable (macOS, most containers).
  - status
  - switch "Cgroup scopes (<platform>)"
  - text: "Child environment passthrough Extra environment VARIABLE NAMES a child may inherit, on top of the minimal base (PATH, locale, home, proxy/CA settings). A child is anything PersonalClaw starts to run code it didn't write: an agent's command, a hook, a script, and an app's installs, hooks and servers. Everything else is withheld, and a proxy address reaches a child without its password. A name added here is passed as it is, password included. Names matching the credential floor (AWS secrets, SSH agent socket, GPG home, git askpass) are refused even when declared here."
  - textbox "Add to child environment passthrough":
    - /placeholder: Add name…
  - status
  - heading "Network egress" [level=#]
  - paragraph: "The agent's outbound fetches, scrapes, and webhooks are blocked from reaching non-public addresses (loopback, LAN, cloud metadata) by default — SSRF protection. Shell commands reach only the allowed hosts below without a person saying yes (the built-in agent's always, an agent CLI's when it asks first), and so do the programs apps start: a chat asks you about any other host, an unattended run (a loop, a schedule) is refused it, and an app's program is stopped unless its install review named the host. A deny always wins over an allow."
  - text: Allowed hosts Fetches reach these even if they resolve to a private/LAN address (e.g. a homelab service), and a shell command or an app's program reaches them without asking. Bare domain covers subdomains.
  - textbox "Add a host to allowed hosts":
    - /placeholder: e.g. nas.local
  - button "Add" [disabled]
  - text: Denied hosts Never reachable, even if public. Overrides an allow.
  - textbox "Add a host to denied hosts":
    - /placeholder: e.g. nas.local
  - button "Add" [disabled]
  - checkbox "Allow all private networks Let fetches reach any private/LAN address, not just the allow-list. Only on a fully trusted network — this removes SSRF protection for the whole LAN. A shell command still reaches only the allowed hosts without asking."
  - text: Allow all private networks Let fetches reach any private/LAN address, not just the allow-list. Only on a fully trusted network — this removes SSRF protection for the whole LAN. A shell command still reaches only the allowed hosts without asking.
  - heading "Outside PersonalClaw's home" [level=#]
  - paragraph: PersonalClaw reads and writes only inside its own home. It reads something another tool keeps on this computer only when you ask it to look there, such as Look in on the Tools page, or once you turn that place on below. It never writes to or deletes anything there.
  - text: Skills other AI tools share Your agents can also use the skills in this folder, and the Skills page lists them. PersonalClaw installs skills into its own home and never changes or deletes anything here. ~/.agents/skills
  - switch "Skills other AI tools share"
  - text: The Hugging Face folder other tools share Model apps can use models already downloaded here, and the token saved by huggingface-cli login is used when a model needs one. PersonalClaw still downloads into its own home and never deletes anything here. ~/.cache/huggingface
  - switch "The Hugging Face folder other tools share"
  - text: Your Claude Code setup The Tools page and the Bring your setup over step list what Claude Code has as soon as they open, instead of when you press Look in Claude Code. The place also covers, in each project Claude Code lists, the project's CLAUDE.md files, its .mcp.json and its .claude settings. PersonalClaw only reads it, and nothing comes over until you import it. ~/.claude, ~/.claude.json
  - switch "Your Claude Code setup"
  - text: Your Codex setup The Tools page and the Bring your setup over step list what Codex has as soon as they open, instead of when you press Look in Codex. PersonalClaw only reads it, and nothing comes over until you import it. ~/.codex, ~/.agents/skills
  - switch "Your Codex setup"
  - heading "Desktop capabilities" [level=#]
  - paragraph: Native permissions the PersonalClaw desktop app holds on this machine. Each one is granted by macOS, not by PersonalClaw — revoking it in <theme> Settings takes effect immediately, and nothing here can grant itself.
  - text: Desktop app not connected You are viewing this in a browser tab. Native capabilities — microphone, notifications, the menu-bar item — exist only while the PersonalClaw desktop app is running, so there is nothing to show or grant here.
