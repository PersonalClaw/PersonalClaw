  - text: Security
  - heading "Security" [level=#]
  - paragraph: The enforcement posture protecting this self-hosted instance. Built-in protections are managed in code; you can extend the shell denylist below.
  - heading "Active protections" [level=#]
  - text: # Denied commands Shell patterns blocked from execution # Suspicious patterns Prompt-injection / exfiltration signatures watched # Tool schemas Tools with enforced argument validation # Redaction paths Sensitive paths redacted from output
  - heading "Signed-in devices" [level=#]
  - paragraph: Every browser, paired device and token that can reach this gateway is listed under Devices, where you can sign any of them out — or all but this one.
  - text: # device is signed in, and # tokens are live.
  - link "Review signed-in devices":
    - /url: "#/settings/devices"
  - heading "Sign-in lifetime" [level=#]
  - text: "Sign-ins last How long a browser stays signed in after a password, a device code, a pairing, or the link the gateway opens at start, before it must sign in again. At most # days: the longer a sign-in keeps working, the longer anyone who copies it can use your dashboard. A change applies to the next sign-in; a device already signed in keeps the lifetime it signed in with. A link from personalclaw token keeps its own lifetime instead: # hours, unless it was made with --ttl (at most # days)."
  - combobox "Sign-ins last":
    - option "# hours"
    - option "# day"
    - option "# days"
    - option "# days"
    - option "# days — the default" [selected]
    - option "# days"
    - option "# days — the limit"
  - status
  - heading "Sign-in lockout" [level=#]
  - paragraph: How many wrong passwords, device codes or pairing codes a device may try before PersonalClaw stops accepting them from it for a while. Fewer attempts and a longer lockout make guessing slower; a lockout you trip yourself ends on its own.
  - text: Stop accepting sign-ins after Wrong attempts from one address, counted over the lockout below.
  - combobox "Stop accepting sign-ins after":
    - option "# wrong attempts"
    - option "# wrong attempts — the default" [selected]
    - option "# wrong attempts"
    - option "# wrong attempts"
  - status
  - text: Lockout lasts How long sign-ins from that address are refused — and the window its wrong attempts are counted over.
  - combobox "Lockout lasts":
    - option "# minutes"
    - option "# minutes — the default" [selected]
    - option "# minutes"
    - option "# hour"
    - option "# hours"
    - option "# day"
  - status
  - heading "Sign-in key" [level=#]
  - paragraph: "Every sign-in to this gateway is signed with one key. If you think the key, or a sign-in, was copied, replace it: every browser, paired device and token is signed out at once, and nothing signed with the old key works again."
  - text: "Replace the key and sign everyone out This browser is signed out too. Sign back in the way you signed in: your password, a pairing, or a new personalclaw token link."
  - button "Replace the key"
  - heading "Shell denylist" [level=#]
  - paragraph: Regexes matched against every command PersonalClaw runs for an agent or an automation, and every command an agent CLI asks it to run, before anyone is asked to approve one. The packaged baseline is always enforced and read-only; your patterns are added to it, never subtracted from it.
  - text: Baseline (#) — always enforced, not editable here
  - 'status "Baseline v# matches what shipped: # patterns verified against the release sha#"':
    - text: Baseline v# matches what shipped — # patterns, sha#
    - code: #df#a#e#…
  - paragraph: The baseline ships with PersonalClaw and is re-checked against the sha# recorded at release on every read, so nothing running inside the agent — the model included — can quietly shorten it. That catches drift and tampering from the inside; it is not a lock. Anyone who can edit the installed package before PersonalClaw starts owns the baseline.
  - group "Baseline shell denylist patterns (#), read-only":
    - code: aws s# cp .* s#://.*
    - code: aws s# mv .* s#://.*
    - code: aws s# sync .* s#://.*
    - code: .*echo.*\$AWS_SECRET.*
    - code: .*echo.*\$AWS_SESSION.*
    - code: .*echo.*\$AWS_ACCESS.*
    - code: .*printenv.*AWS.*
    - code: .*personalclaw.*token
    - code: .*\bgh\s+auth\s+token\b.*
    - code: .*\bglab\s+auth\s+token\b.*
    - code: .*\bgcloud\s+auth\s+print-(access|identity)-token\b.*
    - code: .*\baws\s+.*\bget-login-password\b.*
    - code: .*\baz\s+account\s+get-access-token\b.*
    - code: .*\bsecurity\s+find-generic-password\b.*\s-w(\s|$).*
    - code: .*env.*grep.*AWS.*
    - code: .*python.*boto#.*get_credentials.*
    - code: .*python.*botocore.*credentials.*
