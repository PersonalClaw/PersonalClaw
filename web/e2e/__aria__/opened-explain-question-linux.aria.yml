- dialog "How should I explain things?":
  - text: How should I explain things?
  - button "Close"
  - paragraph: I can shape how I explain things to you. That never changes a fact, a caveat or a refusal.
  - button "Briefly"
  - text: The short answer first. Details when you ask.
  - button "Step by step"
  - text: Numbered steps you can follow.
  - button "With the background"
  - text: The why and the context, then the answer.
  - button "Use the default"
  - text: "No preference: I explain things my usual way."
  - paragraph: Change this any time in Settings → Agent → Agent defaults → Explanations. For one chat only, use Chat preferences, the gear on the chat box.
