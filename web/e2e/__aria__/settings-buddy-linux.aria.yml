    - paragraph: Alerts may interrupt you now.
    - paragraph:
      - text: Mute, quiet hours and which alerts reach you are your notification settings. Change them in
      - link "Settings → Notifications":
        - /url: "#/settings/notifications"
      - text: .
  - group "Reduced motion":
    - paragraph: Your <theme> does not ask for reduced motion.
    - paragraph: "The buddy follows your <theme>’s setting. Change it in its Accessibility settings: on a Mac, <theme> Settings → Accessibility → Display → Reduce motion; on Windows, Settings → Accessibility → Visual effects → Animation effects."
