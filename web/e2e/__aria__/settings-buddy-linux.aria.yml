  - text: Buddy
  - heading "Buddy" [level=#]
  - paragraph: The companion that shows what your agents are doing and asks you when one needs you.
  - heading "Buddy status" [level=#]
  - text: "Buddy status Show the buddy: its window, its tray and dock faces and its alerts’ notifications. Off takes every buddy surface away at once, in every window."
  - status
  - switch "Buddy status"
  - heading "Where it shows" [level=#]
  - paragraph: These apply once Buddy status is on.
  - text: Buddy window Its own window, docked at the top of the screen or floating where you left it.
  - status
  - switch "Buddy window" [checked]
  - text: Tray face Its state on the menu bar or tray icon.
  - status
  - switch "Tray face" [checked]
  - text: Dock face Its state on the app’s dock icon.
  - status
  - switch "Dock face" [checked]
  - text: Alert notifications Let its alerts raise <theme> notifications, under your notification rules, mute and quiet hours.
  - status
  - switch "Alert notifications" [checked]
  - heading "When you’re away" [level=#]
  - text: Steps back after Docked it hides, floating it dozes. Alerts still appear.
  - 'button "When you’re away: # min"': # min
  - 'button "When you’re away: # min" [pressed]': # min
  - 'button "When you’re away: # min"': # min
  - 'button "When you’re away: # min"': # min
  - 'button "When you’re away: # min"': # min
