  - button "Settings"
  - text: Prompts
  - heading "Prompts" [level=#]
  - paragraph: Bind which prompt serves each runtime context. Edit the prompts themselves on the Prompts page; unset uses each context's bundled default.
  - heading "Agent <theme> prompts" [level=#]
  - paragraph: The default-agent <theme> prompt for a runtime context.
  - text: Chat Interactive sessions — dashboard, messaging channels, personalclaw run
  - combobox "Prompt for Chat":
    - option "Default (<theme>-chat)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Background Unattended runs — automations, subagents, heartbeat, webhooks
  - combobox "Prompt for Background":
    - option "Default (<theme>-background)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - heading "Internal task prompts" [level=#]
  - paragraph: One-shot LLM tasks the <theme> runs on your behalf.
  - text: Title Generate a short conversation title from the recent transcript.
  - combobox "Prompt for Title":
    - option "Default (task-title)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Suggestions Generate contextual dashboard prompt suggestions from the user's recent context.
  - combobox "Prompt for Suggestions":
    - option "Default (task-suggestions)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Followups Suggest #-# short follow-up messages the user might send next, from the last chat exchange.
  - combobox "Prompt for Followups":
    - option "Default (task-followups)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Natural language → schedule Read a natural-language scheduling request as a #-field cron expression, or as the one time it names.
  - combobox "Prompt for Natural language → schedule":
    - option "Default (task-nl-to-cron)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Prompt optimizer <theme> prompt for the prompt optimizer — rewrites vague prompts into specific, scoped instructions.
  - combobox "Prompt for Prompt optimizer":
    - option "Default (task-prompt-optimizer)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Side chat <theme> envelope for a side-chat turn — read-only Q&A against a frozen conversation snapshot.
  - combobox "Prompt for Side chat":
    - option "Default (task-side-chat)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: History compression Compress a long chat transcript into a dense summary, preserving facts/decisions/code/errors.
  - combobox "Prompt for History compression":
    - option "Default (task-history-compression)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Memory consolidation Memory consolidation agent: extract history/semantic/episodic/lessons/persona/skills from a session. Envelope; the per-key instructions are composed at runtime."
  - combobox "Prompt for Memory consolidation":
    - option "Default (task-memory-consolidation)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Contradiction judge Judge whether two saved lessons directly contradict (following both is impossible).
  - combobox "Prompt for Contradiction judge":
    - option "Default (task-contradiction-judge)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Inbox classify Sort a batch of new inbox messages, each into needs_reply/fyi/noise + a confidence (JSON out).
  - combobox "Prompt for Inbox classify":
    - option "Default (task-inbox-classify)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Inbox draft Draft a reply to an inbox message in the user's voice (or SKIP if none needed).
  - combobox "Prompt for Inbox draft":
    - option "Default (task-inbox-draft)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Inbox digest Summarize recent channel messages into a short catch-up digest.
  - combobox "Prompt for Inbox digest":
    - option "Default (task-inbox-digest)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Triage classify The triage digest's cheap relevance gate: give each collected item a drop/surface/propose disposition against the user's own per-source filter rules."
  - combobox "Prompt for Triage classify":
    - option "Default (task-triage-classify)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Triage propose The triage digest's ONE strict-JSON proposal call: bind at most N tiered action proposals to the exact ordinals of the collect manifest."
  - combobox "Prompt for Triage propose":
    - option "Default (task-triage-propose)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Digest Recurring multi-source digest: gather the named sources over a window, correlate/dedup, narrate, and deliver to a channel/inbox/knowledge target. Fire it on a schedule via a run-prompt trigger."
  - combobox "Prompt for Digest":
    - option "Default (task-digest)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Navigation links Label a batch of numbered URLs with short human-readable titles ('<index>: <title>' per line)."
  - combobox "Prompt for Navigation links":
    - option "Default (task-nav-links)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Folder icon Pick a single emoji that represents a project folder name.
  - combobox "Prompt for Folder icon":
    - option "Default (task-folder-icon)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Channel title Channel thread auto-title: name the topic in #-# words, or reply SKIP if too vague."
  - combobox "Prompt for Channel title":
    - option "Default (task-channel-title)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Knowledge extraction Extract entities + relations + category + summary from a knowledge text chunk (JSON out).
  - combobox "Prompt for Knowledge extraction":
    - option "Default (task-knowledge-extraction)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Knowledge insights Extract structured insights (title/summary/key_points/topics/action_items) from content (JSON out).
  - combobox "Prompt for Knowledge insights":
    - option "Default (task-knowledge-insights)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Knowledge intent match Decide if a knowledge item is relevant to a user's NL intent and, if so, extract a takeaway + typed fields (JSON out).
  - combobox "Prompt for Knowledge intent match":
    - option "Default (task-knowledge-intent-match)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: Knowledge skill synthesis Turn an intent's goal + gathered outcomes into a reusable SKILL.md (DESCRIPTION/TRIGGERS/PROCEDURE delimited sections).
  - combobox "Prompt for Knowledge skill synthesis":
    - option "Default (task-knowledge-skill-synthesis)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - heading "Loop & orchestration prompts" [level=#]
  - paragraph: Autonomous loop and orchestration prompts — classifiers, judges, planning briefs.
  - text: "Grill flat Grill (flat shape): decompose a goal into distinct, first-principles sub-goals (JSON array out)."
  - combobox "Prompt for Grill flat":
    - option "Default (task-grill-flat)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Grill tree Grill (tree shape): produce phases of clarifying questions that scope the work (JSON object out)."
  - combobox "Prompt for Grill tree":
    - option "Default (task-grill-tree)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Grill assess Grill (assess): decide whether a goal is clear enough to decompose or needs clarifying questions (JSON object out)."
  - combobox "Prompt for Grill assess":
    - option "Default (task-grill-assess)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Orchestrator skill The always-loaded orchestrator SKILL.md: agent-delegation guidance + the installed specialist roster."
  - combobox "Prompt for Orchestrator skill":
    - option "Default (task-orchestrator-skill)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Parallel worker nudge Per-cycle trigger for a parallel loop task-worker: work only its task in its own checkout, mark it done, write a finding."
  - combobox "Prompt for Parallel worker nudge":
    - option "Default (task-parallel-worker-nudge)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Goal step brief Goal-loop planning: the brief for ONE stepwise-walkthrough step (intent/sub_goals/quorum/execution_plan), carrying prior approved artifacts + re-draft comments."
  - combobox "Prompt for Goal step brief":
    - option "Default (task-goal-step-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Code design brief Code (SDLC) planning pass #: design the ordered step list for the target after investigating real context."
  - combobox "Prompt for Code design brief":
    - option "Default (task-code-design-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Code step brief Code (SDLC) planning pass #: the brief for ONE step's artifact, carrying prior approved artifacts + re-draft comments + workspace."
  - combobox "Prompt for Code step brief":
    - option "Default (task-code-step-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Design design brief Design-loop planning pass #: design the ordered design-phase step list, working through every reference input (URL/image/video/HTML/React/DESIGN.md)."
  - combobox "Prompt for Design design brief":
    - option "Default (task-design-design-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Design step brief Design-loop planning pass #: the brief for ONE design-planning step's artifact, carrying prior approved artifacts + re-draft comments + workspace."
  - combobox "Prompt for Design step brief":
    - option "Default (task-design-step-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Research step brief Research-loop planning: the research-specific artifact contract appended to the (goal-derived) step brief for the subtopics/output step kinds (empty for intent/execution_plan)."
  - combobox "Prompt for Research step brief":
    - option "Default (task-research-step-brief)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Goal classify Goal-loop intake classifier: read a goal + installed-capability catalog, return goal_type/rigor/execution/roster/sub_goals/deliverables/execution_plan (JSON out)."
  - combobox "Prompt for Goal classify":
    - option "Default (task-goal-classify)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Code classify Code (SDLC) intake classifier: read a software task + capability catalog, return entry_stage/project_kind/rigor/execution/stage_plan with per-stage tasks (JSON out)."
  - combobox "Prompt for Code classify":
    - option "Default (task-code-classify)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Cycle judge Open-ended cycle judge: a third-party assessor scores one loop cycle's done-ness/marginal-value/quality/regression (JSON out)."
  - combobox "Prompt for Cycle judge":
    - option "Default (task-cycle-judge)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Cycle judge (skeptic) Adversarial cycle judge: a second, skeptical assessor that tries to REFUTE a claimed completion/regression before the supervisor trusts it (JSON out, same shape as cycle_judge)."
  - combobox "Prompt for Cycle judge (skeptic)":
    - option "Default (task-cycle-judge-skeptic)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Subgoal judge Verifiable-goal sub-goal gate: after the automated check passes, confirm EVERY sub-goal is met from cycle evidence (PASS/FAIL out)."
  - combobox "Prompt for Subgoal judge":
    - option "Default (task-subgoal-judge)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "Design phases Design-loop phase planner: tailor the canonical design-<theme> phases (foundations/palette/typography/components/export) to a task (JSON out)."
  - combobox "Prompt for Design phases":
    - option "Default (task-design-phases)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - text: "SDLC stage gate Strict SDLC stage gate: a pass, fail or can't-tell verdict, with its reason, for each of a stage's exit criteria, on what the supervisor observed of the stage's work."
  - combobox "Prompt for SDLC stage gate":
    - option "Default (task-sdlc-stage-gate)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
  - heading "Evaluation prompts" [level=#]
  - paragraph: Evaluation-harness prompts.
  - text: "Eval judge LLM judge: score an assistant response #-# on a scenario's memory/context criteria (JSON out)."
  - combobox "Prompt for Eval judge":
    - option "Default (eval-judge)" [selected]
    - option "<theme> Background"
    - option "<theme> Chat"
    - option "Task Orchestrator Skill"
    - option "Task Prompt Optimizer"
    - option "Task Side Chat"
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
