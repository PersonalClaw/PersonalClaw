  - button "Back to Settings"
  - button "Settings"
  - text: Providers
  - heading "Providers" [level=#]
  - paragraph: Everything pluggable in the <theme>, organized by the entity each provider plugs into. Enable a provider and configure it inline; a provider that serves two entities appears under each.
  - heading "Agent providers #" [level=#]
  - paragraph: Runtimes that drive a chat — the in-process native agent and external agent CLIs (Claude Code, Codex). Enable one, then sign in to any CLI that needs it.
  - text: Native Agents v#.#.# crud acp
  - paragraph: Filesystem-based agent definitions using ACP protocol. Create, edit, and manage agent configurations.
  - text: Ready Always on
  - heading "Model providers #" [level=#]
  - paragraph: Contribute models to the pool you bind to use cases in Models. Native bundled models run in-process; every other provider is an instance you add, test, edit and remove here.
  - text: Native (bundled) Bundled offline model v#.#.# chat
  - paragraph: "A small Apache-#.# chat model, SmolLM#-#M-Instruct, that PersonalClaw downloads when you ask — # MiB, once — so a fresh install can hold a conversation before any provider is bound. After that one download it runs on your machine with no account, no API key and no network. It is deliberately tiny, with no tools, so it is only ever the floor: bind a real model in Settings → Models and this stops being used."
  - text: Always on
  - 'button "Configure: Bundled offline model"'
  - text: Models (#/# downloaded)
  - switch "Hide models this device can't run" [checked]
  - text: Hide models this device can't run SmolLM#-#M-Instruct
  - img "Fits — fits comfortably in ~#.# GiB": Fits
  - text: unsloth/SmolLM#-#M-Instruct-GGUF — the small model PersonalClaw can run with no account and no API key, so a fresh install can chat before anything is set up. One-time download; it runs on the CPU afterwards with no network. It is tiny, so expect short, shaky answers and no tool use. · # MiB
  - button "Download SmolLM#-#M-Instruct"
  - text: Instances Scripted scripted chat code_tools No connection test
  - 'button "Test connection: Scripted"'
  - 'button "View models: Scripted"'
  - 'button "Edit: Scripted"'
  - 'button "Remove: Scripted"'
  - button "Add instance"
  - heading "Inbox providers #" [level=#]
  - paragraph: Each contributes its own items into the unified inbox you pull into chats.
  - text: <theme> Inbox v#.#.# approvals inputs
  - paragraph: Filesystem-backed inbox for agent approval requests, input requests, and <theme> notifications.
  - text: Always on
  - heading "Tool providers #" [level=#]
  - paragraph: Contribute tools the native agent can call. MCP and OpenAI-compatible servers are multi-instance.
  - text: MCP Tool Servers v#.#.# multi-instance # instances
  - paragraph: "Connect Model Context Protocol (MCP) servers to provide tools: one PersonalClaw starts with a command (stdio), or one at a URL over Streamable HTTP or the older SSE transport."
  - switch "Toggle mcp-tools" [checked]
  - paragraph: No instances yet. Add one to start using this provider.
  - button "Add instance"
  - text: Artifacts Tools v#.#.# artifacts
  - paragraph: Operate the Artifacts entity — save, fetch, update, list, version, and delete named versioned artifacts (widgets, React components, docs).
  - text: Always on Automation Tools v#.#.# automation_management
  - paragraph: Create and manage automations in chat — 'when a file in ~/notes changes', 'every weekday at #'. Routes each request to the right trigger kind over the unified trigger store.
  - text: Always on Calendar Tools v#.#.# calendar
  - paragraph: "Read the calendars in the folders you share with PersonalClaw (an .ics file in an allowed working directory, or in a knowledge source that takes .ics files in): what is on a day, and when or where something is, with repeating events expanded in your time zone. It only reads."
  - text: Always on Code Map v#.#.# code_map
  - paragraph: Navigate a codebase by symbol instead of by grep — look up where a function or class is defined, which files reference it, or what one file contains, from a tree-sitter index that answers in one call.
  - text: Always on Computer Use v#.#.# desktop_automation
  - paragraph: Drive the operator's own desktop applications through the OS accessibility tree — list apps, walk a window into numbered elements, then act on an element by index. Off until the operator arms it out-of-band; every call runs the keystone, app allowlist, index-freshness and secure-field screens and is written to the security event log.
  - text: Always on Inbox Tools v#.#.# inbox
  - paragraph: Surface a message to the user's Inbox triage queue — notifications, questions, and FYIs the agent raises when no one is watching the chat — and read what is waiting there.
  - text: Always on Knowledge Tools v#.#.# knowledge
  - paragraph: Operate the Knowledge entity — search the library, create/get/update items, and read library stats for gap detection.
  - text: Always on Memory Tools v#.#.# memory
  - paragraph: Operate persistent memory — remember lessons/corrections, list and forget them, and recall query-relevant facts on demand.
  - text: Always on Projects Tools v#.#.# projects
  - paragraph: Operate autonomous project runs — create/start/list and read live progress of code (SDLC), goal, research, design, and general runs. Loops are the project feature's autonomous execution kinds.
  - text: Always on Prompts Tools v#.#.# prompts
  - paragraph: "Render the saved, parameterized Prompts you maintain — load a prompt by name, fill its {{variable}} placeholders, and act on the result."
  - text: Always on Questions for you v#.#.# questions
  - paragraph: "Lets the agent ask you a question with choices when it needs your decision to go on, and wait for your answer: the question shows as a card in the chat, in Mission Control's Your turn and in the Inbox. You choose an option, write your own answer, or skip it; stopping the turn withdraws it."
  - text: Always on Subagents Tools v#.#.# subagents
  - paragraph: Spawn and track background subagents — run tasks in parallel (results arrive as completion events), list running agents, and fetch a finished agent's full output.
  - text: Always on Tasks Tools v#.#.# task
  - paragraph: Operate the Tasks entity — create/list/get/update/search tasks, list ready tasks, and create projects and task lists.
  - text: Always on Core Tools v#.#.# skills notification <theme>
  - paragraph: Built-in cross-cutting agent tools — skill invocation, notifications, webhook listeners, the wait primitive, and loop control. (Web search/fetch live in Web Tools; subagents, memory, artifacts, and prompts each have their own provider.)
  - text: Always on UI Docs Tools v#.#.# ui_docs
  - paragraph: Search, list and read the web/src/ui design-<theme> kit as documentation-as-data — find the right component or design token to reach for instead of hand-rolling markup.
  - text: Always on Workflow Tools v#.#.# workflows
  - paragraph: Author, run, steer and inspect composable workflows — save a DAG of stages, start runs, watch progress, edit or rewind a run mid-flight, and answer the gates it stops on.
  - text: Always on Filesystem & Shell Tools v#.#.# filesystem shell
  - paragraph: The always-on platform tools — read/write/edit/list/glob/grep/repo_map, bash, and full-result retrieval. Required by the agent; can't be disabled.
  - text: Always on
  - heading "Task providers #" [level=#]
  - paragraph: Contribute tasks into one combined pool the agent and you manage.
  - text: Native Tasks v#.#.# crud comments labels dependencies
  - paragraph: Filesystem-backed task management. Create, edit, and organize tasks with labels, priorities, and dependencies.
  - text: Always on
  - heading "Action providers #" [level=#]
  - paragraph: Actions a trigger can fire when it runs, grouped by what they act on.
  - text: Task actions Create Task Hook v#.#.# execute
  - paragraph: File a task (via the task provider) when an agent's lifecycle event fires — e.g. open a follow-up on Error or Stop. A native action, no shell-out. Attach to an agent to activate.
  - text: Always on
  - 'button "Configure: Create Task Hook"'
  - text: Agent actions Invoke Agent Hook v#.#.# execute
  - paragraph: Spawn a child agent when a lifecycle event fires — e.g. a coder's Stop hook spawns a code-reviewer. Bounded by a recursion-depth cap, a concurrency cap, and the subagent approval gate; always fire-and-forget so the lifecycle never blocks. Attach to an agent to activate.
  - text: Always on
  - 'button "Configure: Invoke Agent Hook"'
  - text: Run Prompt v#.#.# execute
  - paragraph: Run a saved Prompt on a trigger's cadence — the native equivalent of a recurring saved command. The prompt is resolved, rendered through the prompt engine (includes/loops/conditionals), framed as an autonomous run, and executed as an unattended turn. Works on schedule, lifecycle, and event triggers.
  - text: Always on
  - 'button "Configure: Run Prompt"'
  - text: Run Workflow v#.#.# execute
  - paragraph: Start one of your workflows when a trigger fires, with the inputs you set here. The workflow runs in the background and records its own outcome; the workflow's own overlap policy decides what happens when it is already running.
  - text: Always on
  - 'button "Configure: Run Workflow"'
  - text: Messaging actions Send Message Hook v#.#.# execute
  - paragraph: Deliver a message to a channel (via the configured channel provider) when an agent's lifecycle event fires. Falls back to a dashboard notification when no channel is configured. Attach to an agent to activate.
  - text: Always on
  - 'button "Configure: Send Message Hook"'
  - text: Notification actions Notify Hook v#.#.# execute
  - paragraph: Raise a dashboard notification when an agent's lifecycle event fires. A native action — no shell-out. Attach to an agent to activate.
  - text: Always on
  - 'button "Configure: Notify Hook"'
  - text: Shell actions Bash Hooks v#.#.# execute blocking
  - paragraph: Run shell commands on agent lifecycle events. Supports the ACP exit-code-# contract for blocking PreToolUse calls.
  - text: Always on
  - 'button "Configure: Bash Hooks"'
  - text: Script actions Run Script v#.#.# execute
  - paragraph: Run a sandboxed Python script (file.py:func under ~/.personalclaw/crons/) deterministically on a trigger — the zero-token counterpart to Invoke Agent.
  - text: Always on
  - 'button "Configure: Run Script"'
  - text: Other actions Browse the Web v#.#.# execute
  - paragraph: "Drive a real browser toward a goal: read pages, follow links, fill and submit forms. Every page is read as untrusted data, every navigation passes the BROWSE egress policy, and a run that exhausts its steps or its budget stops and asks you rather than guessing."
  - text: Always on
  - 'button "Configure: Browse the Web"'
  - text: Other actions Inbox Operation Hook v#.#.# execute reverse
  - paragraph: Archive, mark read, mute a thread, dismiss, or write a draft reply on an inbox item when a trigger fires. Every operation is reversible, so an auto-executed one always keeps a one-click undo. A native action, no shell-out.
  - text: Always on
  - 'button "Configure: Inbox Operation Hook"'
  - heading "Skill providers #" [level=#]
  - paragraph: Marketplaces you install skills from; installed skills live on the filesystem for agents to reference.
  - text: Native Skills v#.#.# crud triggers auto_generation
  - paragraph: Filesystem-based skill definitions. Create, edit, and manage agent skills with markdown procedures.
  - text: Always on
  - heading "Knowledge providers #" [level=#]
  - paragraph: Contribute knowledge entities into one shared pool the <theme> draws on.
  - text: Native Knowledge v#.#.# bookmarks documents search
  - paragraph: The built-in knowledge library — typed items (notes, gists, bookmarks, files) ingested by the node-graph pipeline and reachable by agents via tools.
  - text: Always on
  - heading "Memory providers #" [level=#]
  - paragraph: Ordered fallbacks providing memory CRUD — the primary serves unless it is unavailable.
  - text: Vector Memory v#.#.# semantic_search episodic preferences
  - paragraph: Native in-process vector memory (SQLite + FAISS) for semantic search over agent memory. Runs locally, no external service; embeddings come from the active embedding model.
  - text: Always on
  - heading "Prompt providers #" [level=#]
  - paragraph: Contribute prompts into the <theme>.
  - text: Native Filesystem Prompts v#.#.# list read write render
  - paragraph: "Stores prompt templates as YAML files under ~/.personalclaw/prompts/. Supports typed variables and {{var}} substitution."
  - text: Always on
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
