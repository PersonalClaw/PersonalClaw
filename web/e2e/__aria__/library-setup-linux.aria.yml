- navigation:
  - button "PersonalClaw, Home":
    - img "PersonalClaw"
    - text: PersonalClaw
  - button "Chat"
  - button "Projects"
  - button "Library"
  - group "Chat history":
    - button "New chat"
    - button "Open Chat history"
    - searchbox "Search chats"
    - 'button "Sort and filter: Recent activity · Active"'
    - status
    - text: No chats yet
  - text: Platform
  - button "Inbox"
  - button "Automations"
  - button "Capabilities"
  - button "Settings"
- separator "Resize navigation — arrow keys to resize"
- main:
  - button "Collapse sidebar"
  - button "Open terminal"
  - button "Notifications"
  - 'button "Theme: <theme> — switch to <theme>"'
  - button "Choose a model"
  - radiogroup "Library":
    - radio "Library" [checked]
    - radio "Memory"
    - radio "Files"
  - heading "Library" [level=#]
  - button "Power user view"
  - button "More actions"
  - button "Add"
  - region "Library items":
    - paragraph: # items
    - status
    - heading "Your library is empty" [level=#]
    - paragraph: Files, links and notes you add show up here. So do the pages and documents your chats make.
    - button "Upload files"
    - button "Add a link"
    - button "Write a note"
    - paragraph: Or drop files anywhere on this page.
    - complementary "A tip from Discover":
      - paragraph: Start a conversation
      - paragraph: Chat is the front door — ask a question, hand over a task, or think out loud, and PersonalClaw picks the tools and agents it needs on its own.
      - link "Open Chat":
        - /url: "#/chat/new"
      - button "Dismiss this tip"
  - region "Feeds, intents and reports":
    - heading "Feeds, intents and reports" [level=#]
    - paragraph: These add to your library on their own. Pausing one keeps everything it added.
    - button "Close Feeds, intents and reports"
    - region "Intents":
      - heading "Intents · things the agent looks out for in everything you add" [level=#]
      - button "New intent"
    - region "Reports":
      - heading "Reports · questions answered on a schedule" [level=#]
      - button "Schedule a report"
    - region "Feeds, folders and apps":
      - heading "Feeds, folders and apps · they bring new things in" [level=#]
      - button "Follow a feed or folder"
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
