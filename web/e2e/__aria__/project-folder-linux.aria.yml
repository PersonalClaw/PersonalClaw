    - button "New chat"
    - button "Open Chat history"
    - searchbox "Search chats"
    - 'button "Sort and filter: Recent activity · Active"'
    - status
    - list:
      - listitem:
        - button "When to sow the beans"
  - text: Platform
  - button "Inbox"
  - button "Automations"
  - button "Capabilities"
  - button "Settings"
- separator "Resize navigation — arrow keys to resize"
- main:
  - button "Collapse sidebar"
  - button "Open terminal"
  - button "# waiting on your answer, open Needs you"
  - button "Notifications"
  - 'button "Theme: <theme> — switch to <theme>"'
  - button "Choose a model"
  - button "Projects"
  - heading "Garden" [level=#]
  - searchbox "Search Garden"
  - button "More actions"
  - button "New"
  - button "/srv/code/garden"
  - textbox "Message input"
  - button "Attach files"
  - 'button "Agent and model: Agent · Auto"': Agent · Auto
  - button "Chat preferences"
  - 'button "Task mode: Agent"': Agent
  - 'button "Execution boundary: Normal"': Normal
  - button "Send message" [disabled]
  - region "Needs you":
    - heading "Needs you" [level=#]
    - text: "#"
    - list:
      - listitem:
        - button "Show the details of bash"
        - group "Permission needed to run bash":
          - text: Permission needed
          - paragraph: bash(npm run sensor:calibrate)
          - paragraph: Calibrate the soil sensors after the rain
          - button "Allow bash — Calibrate the soil sensors after the rain": Allow
          - button "Deny bash — Calibrate the soil sensors after the rain": Deny
  - region "Running now":
    - heading "Running now" [level=#]
    - text: "#"
    - list:
      - listitem "Fix the irrigation sensor tests":
        - 'button "Code session: Fix the irrigation sensor tests, working"'
        - paragraph: Fix the irrigation sensor tests
        - text: Working # of # passed Code session Updated #:# <am/pm>
  - region "Tasks":
    - heading "Tasks" [level=#]
    - text: # open
    - button "New task"
    - button "See all tasks"
    - list:
      - listitem:
        - 'button "Task: Order the soil, not started"'
        - text: Not started Order the soil high priority
      - listitem:
        - 'button "Task: Plant the beans, in progress"'
        - text: In progress Plant the beans medium priority
  - region "Results":
    - heading "Results" [level=#]
    - link "See all # in Library":
      - /url: "#/library?project=p-#a#b#c#d&store=artifacts"
    - list:
      - listitem:
        - button "Spring bed plan, From When to sow the beans · Today": Spring bed plan From When to sow the beans · Today
      - listitem:
        - button "Soil moisture, last week, Yesterday": Soil moisture, last week Yesterday
  - region "Recent":
    - heading "Recent" [level=#]
    - list:
      - listitem:
        - 'button "Chat: When to sow the beans"': Chat When to sow the beans
  - status
  - region "/srv/code/garden":
    - heading "/srv/code/garden" [level=#]
    - text: Docked on the right of the work
    - status
    - button "Move folder"
    - button "Expand folder"
    - button "Close folder"
    - button "Open in Files"
    - navigation "Where in the folder":
      - button "garden"
    - list:
      - 'button "Folder: beds"'
      - text: beds
      - 'button "Folder: sensors"'
      - text: sensors
      - 'button "File: README.md"'
      - text: README.md
    - separator "Resize folder — arrow keys to resize"
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
