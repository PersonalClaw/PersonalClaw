  - paragraph: Sync PersonalClaw state between your machines with rsync over ssh. Any host you can already log into works — a home server, a NAS, a VPS. No object store, no credentials beyond your existing ssh key. Shards are encrypted end-to-end by default, and secrets are excluded upstream so they never reach the host. · by PersonalClaw
  - text: sync bundled
  - button "Install"
  - button "S# Sync — details"
  - text: S# Sync v#.#.# Sync provider git
  - paragraph: Sync PersonalClaw state between your machines through an S#-compatible store. Use AWS S#, a self-hosted MinIO, a NAS gateway, or any object store that speaks the S# API — one you own. Requests are signed with AWS Signature V# and travel through PersonalClaw's guarded egress chokepoint, pinned to the one endpoint you configure. Shards are encrypted end-to-end by default (the store never sees plaintext), and secrets are excluded upstream so they never reach it. · by PersonalClaw
  - text: sync bundled
  - button "Install"
