  - button "Browser Connector — details"
  - text: Browser Connector v#.#.# git
  - paragraph: "Attach your own everyday browser to a PersonalClaw you already run. A browse task with target 'user_browser' can then act inside a session you are already logged into, and only in a tab it opens for itself: when you allow a task, the extension opens a new background tab in a tab group named after the task (or a window of its own, in a browser without tab groups), and the run never touches a tab you already have open. Close the group to stop the run; bring its tab to the front to take over, which pauses it. If the extension cannot open a tab of the run's own, the task is refused. The extension pairs with the gateway the way your phone does and talks to it over loopback only: its host permissions are loopback-only, and it opens no listening surface of its own. In your browser it asks for tabs (to open the run's tab and act on it), tab groups (to name the run's group and notice when you close it) and storage (its settings, and which tab belongs to which run). It speaks a narrow, closed contract: navigate, read-outline, click, type, close. It never reads, stores, or types into a password field. · by PersonalClaw"
  - text: Tested No UI companion browse automation … # more tags
  - button "Install"
  - button "Claude (Subscription) — details"
  - text: Claude (Subscription) v#.#.# Model provider git
  - paragraph: Claude models over your existing Claude Code sign-in — no API key. Reads the CLI's own credential store read-only. · by PersonalClaw
  - text: model llm subscription
  - button "Install"
  - button "Claude Code — details"
  - text: Claude Code v#.#.# Agent provider git
  - paragraph: "Run Anthropic's Claude Code as an agent (acp:claude-code) via the Zed ACP adapter. It runs with a Claude config of its own that starts empty, and loads nothing from the folder it works in (no .claude settings, .mcp.json servers, CLAUDE.md or skills), so no auto-approve rule of yours or of a repository's comes along: apart from the file reads and read-only commands Claude Code allows itself, every tool asks through PersonalClaw's approval gate. Sign in to Claude once for it (Settings → Providers → Claude Code → Sign in); PersonalClaw stores no key. Turn off Isolated Claude settings to use your own ~/.claude, rules included, and the Claude settings of the folder it works in. Enabling it installs its ACP adapter (@agentclientprotocol/claude-agent-acp) from npm into your PersonalClaw home when no copy is installed; a failed install says why on its card, with Retry. · by PersonalClaw"
  - text: agent acp claude-code
  - button "Install"
