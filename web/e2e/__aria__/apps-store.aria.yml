  - text: Code Review v#.#.# Tool provider git
  - paragraph: Deep-review a GitHub pull request one file at a time, riskiest changes first. It works through the GitHub CLI you are already signed in to. Findings stay in a local log on your machine — nothing is ever posted back to the PR. · by PersonalClaw
