  - button "Lima Sandbox — details"
  - text: Lima Sandbox v#.#.# Sandbox provider git
  - paragraph:
    - text: The isolated (virtual-machine) execution-isolation tier, backed by Lima. Lima runs <platform> virtual machines on macOS and <platform>. It runs an agent-influenced command inside a Lima instance through
    - code: limactl shell
    - text: instead of on the host, so the virtual machine — not a host path filter — is the boundary. Registers as a
    - code: sandbox
    - text: "provider through the SandboxProvider seam: a cached availability probe greys the tier out with a reason when the instance is stopped, and host paths are translated to their in-guest mount location so a run opened \"inside the sandbox\" resolves the same working directory. · by PersonalClaw"
  - text: sandbox isolation vm … # more tags
