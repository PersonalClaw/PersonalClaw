  - text: Local Image Generation v#.#.# Model provider git
  - paragraph: "Generate images with a ComfyUI server you run on your own machine. PersonalClaw does not install or start ComfyUI: start it yourself on this machine, then set its address on this app's Configure page (default http://#.#.#.#:#). Bind a checkpoint you pulled into ComfyUI to the Image Generation use case in Models. No cloud and no API key: no prompt or pixel leaves the host, and this app downloads no weights. Recommended permissive default: FLUX.#-schnell (Apache-#.#). · by PersonalClaw"
