  - button "Research Lab — details"
  - text: Research Lab v#.#.# Tool provider git
  - paragraph: Unattended research campaigns as an agent tool. One question becomes a tree of sub-questions that hourly cycles work down through subagents, recording findings with their sources. When the tree is answered — or the cycle budget runs out — it synthesizes everything into one markdown report on your machine. · by PersonalClaw
  - text: tool research unattended
