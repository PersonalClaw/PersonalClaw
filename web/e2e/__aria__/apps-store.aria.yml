  - button "Mail Inbox — details"
  - text: Mail Inbox v#.#.# Inbox provider git
  - paragraph: IMAP mail as an inbox source. Polls a mailbox, surfaces messages from a fail-closed sender allowlist as inbox items, reads multipart and HTML mail, and hands each attachment to the Inbox as a file to list and download. Purpose-specific addresses can each carry a stored prompt, so mail to them runs it against the fenced mail body. Replies are composed as threaded drafts and are NOT sent until you turn sending on. Passwords are kept in the credential store, never in the settings file. · by PersonalClaw
  - text: inbox email
  - button "Install"
  - button "Menu Bar Companion — details"
  - text: Menu Bar Companion v#.#.# git
  - paragraph: A macOS menu-bar companion for a PersonalClaw you already run. It lives in the status bar on YOUR Mac (not on the server), shows the loops running right now and the tool approvals waiting on you, each with what it would run, where it came from and what it can touch before you Approve or Deny it, and deep-links a loop that needs your input straight into the PersonalClaw dashboard. A badge counts what is actually blocked on you. It holds ONE /api/ws connection and treats every frame as nothing but a doorbell — it re-reads state over HTTP and never renders anything out of a socket payload. Native notifications can be muted from its Settings menu. Your gateway URL and token are stored locally in a # file on your own machine, or supplied by environment variable and never persisted, and the token travels only in a request header, never in a link it opens. · by PersonalClaw
  - text: Tested No UI companion macos approvals … # more tags
