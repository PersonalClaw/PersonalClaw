  - button "Settings"
  - text: Notifications
  - heading "Notifications" [level=#]
  - paragraph: Control how and when PersonalClaw notifies you.
  - status
  - heading "Delivery" [level=#]
  - text: Mute all notifications Pause every notification regardless of severity.
  - switch "Mute all notifications"
  - text: Minimum severity Only notify at or above this level.
  - 'button "Minimum severity: All" [pressed]': All
  - 'button "Minimum severity: Warnings+"': Warnings+
  - 'button "Minimum severity: Errors only"': Errors only
  - heading "Quiet hours" [level=#]
  - paragraph: Only errors ping you during these hours. A notice your rules send to the digest or as a badge still arrives that way, and one that needs your answer waits silently in the bell.
  - text: Enable quiet hours
  - switch "Enable quiet hours"
  - heading "Approvals on chat channels" [level=#]
  - paragraph: "A chat that started on a chat channel is always asked in that chat. This setting decides where the rest ask you: when Approval needed below delivers to Channel DM, and when a subagent asks to start. Approve and Deny on the channel answer it, and so does PersonalClaw."
  - text: Send approvals to A chat that started on a chat channel is asked in that chat. When Approval needed below delivers to Channel DM, everything else (a chat here, an unattended run, a trigger) waits here in PersonalClaw, because no chat channel knows you yet. Pair yourself as a channel's owner on its Configure page to be asked there.
  - combobox "Send approvals to":
    - option "The first connected channel that knows you" [selected]
  - heading "Per-kind delivery" [level=#]
  - paragraph: What happens to each kind of notification once it passes the settings above. Never = dropped; Badge = kept in the list without interrupting; Notify = a toast; Digest = batched into the daily summary. By default only approvals, questions and errors notify; everything else is a badge.
  - text: agent Agent message
  - 'button "Delivery mode for Agent message: Never"': Never
  - 'button "Delivery mode for Agent message: Badge" [pressed]': Badge
  - 'button "Delivery mode for Agent message: Notify"': Notify
  - 'button "Delivery mode for Agent message: Digest"': Digest
  - button "Show delivery detail for Agent message": detail
