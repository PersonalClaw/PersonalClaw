  - text: Packs
  - heading "Packs" [level=#]
  - paragraph: Importable capability bundles — skills, templates, agents and connector declarations one user can hand to another.
  - heading "Discovery" [level=#]
  - paragraph: How packs get proposed for a project. Fingerprinting only ever proposes — it never installs anything on its own.
  - text: Project fingerprinting Let the zero-LLM scanner propose matching packs for a project (e.g. a Terraform-shaped dir). Off stops scanning.
  - status
  - switch "Project fingerprinting" [checked]
  - heading "Suggested for your projects" [level=#]
  - paragraph: Matched by file shape only — no model reads your code. A suggestion never installs anything, and declining one is remembered for that project.
  - button "Suggest packs"
  - text: No pack matches any project's workspace. Bind a project to a codebase directory to get suggestions.
  - heading "Pack store" [level=#]
  - paragraph: The packs shipped in this build. Installing one scans every component, lands its triggers disabled, and stages its roster until you deploy it.
  - text: "Health OS #.#.# An honest health log: daily capture that records rather than advises, a routine-checkup cadence tracker, a weekly assembly template, and a two-tier health roster."
  - button "Install Health OS": Install
  - text: "Infra Ops #.#.# Review infrastructure-as-code changes honestly: plan counts before commentary, the destroy/replace list first, and a drift audit that names the attribute behind every divergence."
  - button "Install Infra Ops": Install
  - text: "Personal CFO #.#.# Close each month honestly: statement collection, a budget review that separates measurement from inference, a weekly spending digest, and a two-tier finance roster."
  - button "Install Personal CFO": Install
  - heading "Installed packs" [level=#]
  - paragraph: Each imported pack, its skipped-connector markers, a re-runnable setup interview when it ships one, and an update or uninstall that never touches a component you have edited.
  - text: No packs installed yet — install one from the pack store below and it shows up here with its setup state.
