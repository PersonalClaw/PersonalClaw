- listbox "Slash commands":
  - option "/help List available slash commands" [selected]
  - option "/optimize Optimize a prompt, then send it"
  - option "/clear Start a fresh chat"
  - option "/prompts Open the saved-prompt palette"
  - option "/model Switch the model for this chat"
  - option "/agent Switch the agent for this chat"
  - option "/effort Set reasoning effort for this chat"
  - option "/project Scope this new chat to a project"
  - option "/goal Start a goal loop on a task, from a new chat"
  - option "/tools Open the Tools page"
  - option "/undo Roll back the last N conversation turns"
  - option "/rewind-to-turn Put back the agent's file edits after turn N (not a command's)"
  - option "/compact Compact the conversation to free context"
  - option "/context Show what fills the context window, part by part"
