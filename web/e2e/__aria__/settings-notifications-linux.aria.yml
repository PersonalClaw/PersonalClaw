    - heading "Daily digest" [level=#]
    - paragraph: When batched notifications are collected into one summary.
    - text: Schedule A #-field cron expression in server-local time. Default # # * * * (#:# daily).
    - textbox "Digest schedule": # # * * *
  - region "Inbox":
    - heading "Inbox" [level=#]
    - paragraph: What gets flagged in the unified inbox, and how long items are kept.
    - status
    - heading "Alerts" [level=#]
    - paragraph: Keyword and name-mention alerts are now per-notification-kind.
    - text: Where to configure One place for every kind of notification, not just inbox items.
    - link "Open notification rules":
      - /url: "#/settings/notifications"
    - heading "Collection" [level=#]
    - paragraph: What the inbox gathers, and how it is ordered.
    - text: "Poll the drop folder Collect the messages a program on this machine drops as JSON files in the inbox's incoming folder. Off unless you use one: anything that can write to this machine can drop a file there. Inbox apps you install (Mail Inbox, Slack) are collected while they are enabled, and agents can always post here directly."
    - switch "Poll the drop folder"
    - text: "Sort new messages The background model reads each new message and sorts it into Needs reply, FYI or Noise, a few messages per call, inside your daily budget. Off: messages arrive unsorted, nothing is sent to a model for them, and you sort them yourself."
    - switch "Sort new messages" [checked]
    - text: Engagement ranking Rank the inbox by how much you engage with each channel/sender (favorites, opens, replies boost; dismisses lower) on top of recency. Off = pure newest-first.
    - switch "Engagement ranking"
    - heading "Proactive triage" [level=#]
    - paragraph: One scheduled digest of what accumulated, with proposals you answer. Off by default; nothing is collected or spent while it is off.
    - text: Morning triage digest Collect, filter and propose on a schedule. Turning this off retires the schedule and keeps every rule you taught — turning it back on is lossless.
    - switch "Morning triage digest"
    - text: Auto-execute the trivial tier Let the digest perform reversible inbox actions (archive, mark read, mute) on its own, inside your daily budget and per-run cap. Every one is a ledger row with a one-click undo.
    - switch "Auto-execute the trivial tier" [disabled]
    - heading "Triage rules" [level=#]
    - paragraph: What you taught the digest by answering “always” — one row per pattern. Deny beats approve, and the most specific pattern wins.
    - paragraph: You haven't taught the digest any rules yet. Answer “Always” or “Never” on a digest proposal and the pattern shows up here, where you can revoke it.
    - heading "Retention" [level=#]
    - paragraph: Automatically clean up old inbox items.
    - text: Auto-cleanup Remove items past their retention window.
    - switch "Auto-cleanup" [checked]
    - text: Retention How long to keep inbox items (all sources).
    - spinbutton "Retention (days)": "#"
    - text: days
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
