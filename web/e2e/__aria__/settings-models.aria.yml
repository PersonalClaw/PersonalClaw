  - heading "HuggingFace token" [level=#]
  - paragraph: Gated models (e.g. pyannote diarization) need a HuggingFace token with the model's license accepted. PersonalClaw checks each source below and uses the first one HuggingFace confirms is valid.
  - text: Saved token not set Environment (HF_TOKEN) not set huggingface-cli login PersonalClaw has not been allowed to read the Hugging Face folder other tools share. Turn it on in Settings → Security → Outside PersonalClaw's home.
  - textbox "HuggingFace token":
    - /placeholder: hf_…  paste a token to save
  - button "Save" [disabled]
  - heading "On this machine" [level=#]
  - paragraph: Models currently held in memory, and how much of this machine they are using.
  - progressbar "<theme> memory in use"
  - text: #.# GiB of #.# GiB in use · #.#% No models are loaded right now. One loads on its first use.
  - heading "Local runtime" [level=#]
  - paragraph: Memory headroom for local inference, what the browse list shows, and the timeouts around a model sidecar.
  - text: Hide models this device cannot run Keep models that do not fit this machine's memory out of the browse list. On by default; turn it off to see the whole catalog.
  - status
  - switch "Hide models this device cannot run" [checked]
  - text: Memory reserve (GiB) Memory held back for your OS and the inference runtime, subtracted before any model-fit verdict. Raise it if models fit on paper but your machine struggles — verdicts get more cautious. It never blocks anything.
  - spinbutton "Memory reserve (GiB)": "#"
  - status
  - text: Memory pressure warning (%) Percent of <theme> RAM in use at which the loaded-models bar above warns. Advisory only — nothing is unloaded for you.
  - spinbutton "Memory pressure warning (%)": "#"
  - status
  - text: Sidecar restart limit How many times in a row a crashed model sidecar is respawned before the runner gives up and reports the failure instead.
  - spinbutton "Sidecar restart limit": "#"
  - status
  - text: Model Test timeout (seconds) How long a model's Test may run before it is stopped and reported as timed out — any model, hosted or on this machine. A Test makes one small real call on click, so this bounds a model that hangs while it loads.
  - spinbutton "Model Test timeout (seconds)": "#"
  - status
  - text: HuggingFace token check interval (seconds) How long a HuggingFace token's validity is cached after a successful check, so listing models does not re-call HuggingFace every time. # re-checks on every read.
  - spinbutton "HuggingFace token check interval (seconds)": "#"
  - status
  - heading "Prompt caching" [level=#]
  - paragraph: Reuse the stable part of the prompt across turns on providers that support it.
  - text: Prompt caching Ask providers that support it to cache the stable prompt prefix, cutting cost and latency on multi-turn work. Providers without cache support are unaffected. Turn it off to rule caching out when debugging a provider — what the model is shown, and in what order, is identical either way.
  - status
  - switch "Prompt caching" [checked]
