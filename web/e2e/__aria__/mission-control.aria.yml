- navigation:
  - img "PersonalClaw"
  - text: PersonalClaw
  - button "Home"
  - button "Chat"
  - button "Projects"
  - button "Library"
  - group "Threads":
    - text: Threads
    - button "New thread"
    - searchbox "Search threads"
    - status
    - button "Personal, no threads": Personal #
    - button "Repeatable, no threads": Repeatable #
  - text: Platform
  - button "Inbox"
  - button "Automations"
  - button "Capabilities"
  - button "Settings"
- separator "Resize navigation — arrow keys to resize"
- main:
  - button "Collapse sidebar"
  - button "Open terminal"
  - 'button "Content width: Full"'
  - button "Notifications"
  - 'button "Theme: <theme> — switch to <theme>"'
  - button "Choose a model"
  - heading "Mission Control" [level=#]
  - region "Mission Control":
    - paragraph: Everything wanting your attention, in the order it wants it. Approve, reject, and answer from here — you do not have to open the run.
    - region "Needs approval":
      - heading "Needs approval" [level=#]
      - text: "#"
      - list:
        - listitem:
          - group "Permission needed to run bash":
            - alert: Permission needed
            - text: Destructive bash(rm -rf build)
            - paragraph: Clear the build folder
            - paragraph: From automation “Nightly”
            - button "Allow bash — automation “Nightly” — Clear the build folder": Allow
            - button "Deny bash — automation “Nightly” — Clear the build folder": Deny
        - listitem:
          - paragraph: Workflow “release”
          - paragraph: Ship v#.#?
          - button "Approve Ship v#.#? — Workflow “release”": Approve
          - button "Deny Ship v#.#? — Workflow “release”": Deny
        - listitem:
          - paragraph: Automation “Bank statements”
          - paragraph: Sign in to the bank’s site
          - button "Approve Sign in to the bank’s site — Automation “Bank statemen…": Approve
          - button "Deny Sign in to the bank’s site — Automation “Bank statemen…": Deny
    - region "Your turn":
      - heading "Your turn" [level=#]
      - text: "#"
      - list:
        - listitem:
          - paragraph: Loop “Sort the inbox”
          - paragraph: May I archive last year’s mail?
          - 'link "Open loop: May I archive last year’s mail? — Loop “Sort the inbox”"':
            - /url: "#/loops/l-e#e"
            - text: Open it to answer
    - region "Working":
      - heading "Working" [level=#]
      - text: "#"
      - paragraph: Nothing is running right now.
    - region "Idle":
      - heading "Idle" [level=#]
      - text: "#"
      - paragraph: Nothing is idle.
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
