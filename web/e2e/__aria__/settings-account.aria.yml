  - 'button "Theme: <theme> — switch to <theme>"'
  - button "Choose a model"
  - button "Back to Settings"
  - button "Settings"
  - text: Account
  - heading "Account" [level=#]
  - paragraph: "PersonalClaw is self-hosted and single-user. Below: how the <theme> addresses you, and — if you reach this box from outside your home network — an optional password sign-in."
  - heading "Identity" [level=#]
  - text: Your name Used in greetings and where the <theme> refers to you. Saved on the server, so it follows you across browsers and machines.
  - textbox "Your name": Keyur
  - 'button "Save: Your name" [disabled]': Save
  - text: Username A short handle stamped onto things you create (tasks, comments) so contributions stay attributable later. Lowercase letters, digits, - and _ — anything else is normalized. It's a label, not a login. Leave it empty to keep records unattributed.
  - textbox "Username":
    - /placeholder: keyur
  - 'button "Save: Username" [disabled]': Save
  - text: "Assistant name What the assistant calls itself in prompts and greetings ({{bot_name}}). Empty uses the default, PersonalClaw."
  - textbox "Assistant name":
    - /placeholder: PersonalClaw
  - 'button "Save: Assistant name" [disabled]': Save
  - text: Run setup again Walks through first-run setup once more. Your name, handle and everything already set up are kept.
  - button "Run setup"
  - heading "Sign in from outside your network" [level=#]
  - paragraph: Off by default. Turn this on only if you reach this dashboard over a tunnel or from the internet — on your home network the token link is simpler and safer.
  - text: "Set a sign-in username and password Both are saved together, in one step — so changing the username means entering the password again. At least # characters: length matters more than symbols. Stored as an argon#id hash; it is never shown again, and never leaves this box."
  - textbox "Sign-in username":
    - /placeholder: you
  - textbox "New password"
  - textbox "Confirm password"
  - button "Save sign-in" [disabled]
  - text: Offer password sign-in Set a password first. Turning this on without one would show a form nobody can pass.
  - switch "Offer password sign-in" [disabled]
  - text: Require a #FA code Enroll an authenticator first with
  - code: personalclaw auth totp setup
  - text: ", then turn this on — verify a code works before requiring it."
  - switch "Require a #FA code" [disabled]
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
