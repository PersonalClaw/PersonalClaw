  - text: Guardrails
  - heading "Guardrails" [level=#]
  - paragraph: The personal safety floor — a daily spend ceiling, an outbound secret scan, circuit breakers for a failing provider and a failing tool loop, and a kill switch. The budget, scan and kill switch bind unattended work only; the breakers apply to any run, including this chat.
  - heading "Incident kill switch" [level=#]
  - paragraph: Suspend ALL unattended work — cron jobs, hooks, event triggers, subagent spawns — at once. Interactive chat keeps working. Resume is explicit.
  - text: Incident mode Off — automation runs normally.
  - switch "Incident mode"
  - heading "Daily budget" [level=#]
  - paragraph: Cap what your automations, Unattended loops, subagents and background work spend in a day; your chat turns and Attended loops, whose calls you answer, are not capped. Each ceiling resets at midnight. # = unlimited.
  - text: Max tokens / day Counts every unattended call, local models' too. At the ceiling, unattended runs are skipped (a cron fire is paused, a subagent spawn refused) until it resets.
  - status
  - spinbutton "Max tokens / day": "#"
  - text: Max dollars / day A call that costs money starts only when what it may cost fits in what is left beside what the calls already running have set aside, so calls running together stay within it; one can still cost more than it set aside. A model with no price is refused, and one that costs nothing keeps running. Prices are estimates, set in Settings → Usage → Model prices.
  - status
  - text: $
  - spinbutton "Max dollars / day": "#"
  - text: Max tokens / run Per single unattended run (a goal-loop cycle, a cron fire). # = unlimited.
  - status
  - spinbutton "Max tokens / run": "#"
  - heading "Outbound scan" [level=#]
  - paragraph: How a prompt bound for a model that runs off this machine is handled when it contains secrets or PII. A model that runs on this machine always warns (its prompt never leaves your machine); a model your Ollama answers from its cloud runs off it.
  - text: Scan mode warn = log & send · redact = substitute & send · block = refuse the call.
  - 'button "Scan mode: Warn"': Warn
  - 'button "Scan mode: Redact" [pressed]': Redact
  - 'button "Scan mode: Block"': Block
  - heading "Provider circuit breaker" [level=#]
  - paragraph: "Per-provider fail-fast: after N consecutive failures a provider's breaker opens, so unattended runs fail in microseconds during an outage instead of stacking timeouts."
  - text: Failure threshold Consecutive failures before the breaker opens.
  - status
  - spinbutton "Failure threshold": "#"
  - text: Recovery seconds How long an open breaker waits before a half-open probe.
  - status
  - spinbutton "Recovery seconds": "#"
  - heading "Tool-loop breaker" [level=#]
  - paragraph: A run that keeps failing the same tool is told to change approach, then refused, and finally stopped outright. This is that last step — the point where the whole run is abandoned rather than allowed to spend the rest of its budget repeating a failure.
  - text: Abort after tool failures Counts every failing tool call in one run, not just repeats of the same one. Applies to built-in tools and to an external CLI agent's alike.
  - status
  - spinbutton "Abort after tool failures": "#"
  - heading "Earned autonomy" [level=#]
  - paragraph: Every automated action starts at the rung it was declared with and can only climb when you say so. A single rejection, thumbs-down or undo drops it back immediately and starts a cooldown.
