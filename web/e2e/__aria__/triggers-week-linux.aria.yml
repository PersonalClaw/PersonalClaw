- navigation:
  - img "PersonalClaw"
  - text: PersonalClaw
  - button "Home"
  - button "Chat"
  - button "Projects"
  - button "Library"
  - group "Threads":
    - text: Threads
    - button "New thread"
    - searchbox "Search threads"
    - status
    - button "Personal, no threads": Personal #
    - button "Repeatable, no threads": Repeatable #
  - text: Platform
  - button "Inbox"
  - button "Automations"
  - button "Capabilities"
  - button "Settings"
- separator "Resize navigation — arrow keys to resize"
- main:
  - button "Collapse sidebar"
  - button "Open terminal"
  - button "Notifications"
  - 'button "Theme: <theme> — switch to <theme>"'
  - button "Choose a model"
  - radiogroup "Automations":
    - radio "Automations" [checked]
    - radio "Workflows"
  - heading "Automations" [level=#]
  - button "New trigger"
  - radiogroup "Triggers view":
    - radio "List"
    - radio "Week" [checked]
  - status
  - text: <month> # – # # fires this week · # suppressed
  - button "Previous week"
  - button "Next week"
  - table "Scheduled trigger fires by day and hour. Shaded cells are suppressed by a quiet window or a skip date.":
    - caption: Scheduled trigger fires by day and hour. Shaded cells are suppressed by a quiet window or a skip date.
    - rowgroup:
      - row "Hour Mon # Tue # Wed # Thu # Fri # Sat # Sun #":
        - columnheader "Hour"
        - columnheader "Mon #"
        - columnheader "Tue #"
        - columnheader "Wed #"
        - columnheader "Thu #"
        - columnheader "Fri #"
        - columnheader "Sat #"
        - columnheader "Sun #"
    - rowgroup:
      - 'row "# Mon, <month> # #:# — <fires> Tue, <month> # #:# — <fires> Wed, <month> # #:# — <fires> Thu, <month> # #:# — # fire, all suppressed (skip date #-#-#): Morning briefing Fri, <month> # #:# — <fires> Sat, <month> # #:# — no fires Sun, <month> # #:# — no fires"':
        - rowheader "#"
        - 'button "Mon, <month> # #:# — <fires>"': "#"
        - 'button "Tue, <month> # #:# — <fires>"': "#"
        - 'button "Wed, <month> # #:# — <fires>"': "#"
        - 'button "Thu, <month> # #:# — # fire, all suppressed (skip date #-#-#): Morning briefing"': "#"
        - 'button "Fri, <month> # #:# — <fires>"': "#"
        - cell "Sat, <month> # #:# — no fires"
        - cell "Sun, <month> # #:# — no fires"
      - 'row "# Mon, <month> # #:# — no fires Tue, <month> # #:# — no fires Wed, <month> # #:# — no fires Thu, <month> # #:# — no fires Fri, <month> # #:# — <fires> Sat, <month> # #:# — no fires Sun, <month> # #:# — no fires"':
        - rowheader "#"
        - cell "Mon, <month> # #:# — no fires"
        - cell "Tue, <month> # #:# — no fires"
        - cell "Wed, <month> # #:# — no fires"
        - cell "Thu, <month> # #:# — no fires"
        - 'button "Fri, <month> # #:# — <fires>"': "#"
        - cell "Sat, <month> # #:# — no fires"
        - cell "Sun, <month> # #:# — no fires"
      - 'row "# Mon, <month> # #:# — no fires Tue, <month> # #:# — # fire, all suppressed (quiet hours #:#–#:#): Evening digest Wed, <month> # #:# — no fires Thu, <month> # #:# — no fires Fri, <month> # #:# — no fires Sat, <month> # #:# — # fires, # suppressed (quiet hours #:#–#:#): Evening digest, Weekly backup Sun, <month> # #:# — no fires"':
        - rowheader "#"
        - cell "Mon, <month> # #:# — no fires"
        - 'button "Tue, <month> # #:# — # fire, all suppressed (quiet hours #:#–#:#): Evening digest"': "#"
        - cell "Wed, <month> # #:# — no fires"
        - cell "Thu, <month> # #:# — no fires"
        - cell "Fri, <month> # #:# — no fires"
        - 'button "Sat, <month> # #:# — # fires, # suppressed (quiet hours #:#–#:#): Evening digest, Weekly backup"': "#"
        - cell "Sun, <month> # #:# — no fires"
  - text: Will run Partly suppressed Quiet hours Skip date
- contentinfo "Status":
  - button "<theme> status — Gateway connected"
