          - 'link "Review it in Skills: Skill: incident-writeup — Skills — Write up an inciden…"':
            - /url: "#/skills?mode=proposals"
            - text: Review it in Skills
          - 'button "Accept Skill: incident-writeup — Skills — Write up an inciden…"': Accept
          - 'button "Reject Skill: incident-writeup — Skills — Write up an inciden…"': Reject
        - listitem:
          - button "Show the details of Keep a weekly digest of what the agents did"
          - paragraph: Learning
          - paragraph: Keep a weekly digest of what the agents did
          - 'link "Open it in the Inbox: Keep a weekly digest of what the agents did — Learning"':
