  - text: personalclaw-code-planner built-in Built-in investigative planner for the Code engine (reads real context, then plans; never executes).
  - button "personalclaw-coder"
  - text: personalclaw-coder built-in Built-in worker for the Code SDLC engine (plans + writes code).
  - button "personalclaw-goal-planner"
  - text: personalclaw-goal-planner built-in Built-in intake planner for autonomous goal loops (plans, never executes).
  - button "personalclaw-lite"
  - text: personalclaw-lite built-in Built-in background worker for titles, suggestions, and consolidation.
  - button "personalclaw-loop"
  - text: personalclaw-loop built-in Built-in worker for autonomous goal loops.
  - button "personalclaw-template-refiner"
  - text: personalclaw-template-refiner built-in Built-in propose-only refiner for workflow templates (read + propose).
