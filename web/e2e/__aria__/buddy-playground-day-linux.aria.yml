- main:
  - heading "Buddy playground" [level=#]
  - paragraph: "The buddy's real state machine and orb, played with made-up work. Nothing here reaches the gateway: an answer is only written in the log."
  - radiogroup "Playground view":
    - radio "Play"
    - radio "A day" [checked]
    - radio "Card"
    - radio "Poses"
  - radiogroup "Screen width":
    - radio "# wide"
    - radio "# wide"
    - radio "# wide"
    - radio "Full" [checked]
  - paragraph: "Nothing shows: the buddy is hidden."
  - paragraph: Hidden.
  - region "Waiting on you":
    - heading "Waiting on you · #" [level=#]
    - paragraph: Nothing is waiting on you.
  - region "Running now":
    - heading "Running now · #" [level=#]
    - paragraph: Nothing is running.
  - region "Focused work":
    - heading "Focused work" [level=#]
    - paragraph: No work is in focus.
  - region "Event log":
    - heading "Event log · #" [level=#]
    - list:
      - listitem: "#:#.# Buddy status on: hidden"
  - group "Play the day":
    - heading "Clock · #:#.# of #:#.#" [level=#]
    - button "Play"
    - button "Pause" [disabled]
    - button "Next step"
    - button "Start again"
    - radiogroup "Speed":
      - radio "#×" [checked]
      - radio "#×"
      - radio "#×"
  - region "The day's steps":
    - heading "The day · hidden" [level=#]
    - list:
      - listitem: #:#.# Release notes starts (next)
      - listitem: #:#.# It searches
      - listitem: #:#.# Nightly digest starts beside it
      - listitem: #:#.# Release notes asks to run git push
      - listitem: #:#.# The owner allows it
      - listitem: #:#.# Nightly digest moves on
      - listitem: #:#.# Release notes asks which branch
      - listitem: #:#.# The owner answers
      - listitem: #:#.# Release notes finishes
      - listitem: #:#.# Nightly digest fails
      - listitem: #:#.# The failure is cleared
      - listitem: #:#.# The owner holds push-to-talk
      - listitem: #:#.# and lets go
      - listitem: #:#.# Tidy downloads starts
      - listitem: #:#.# The owner steps away
      - listitem: #:#.# Tidy downloads finishes while they are away
      - listitem: #:#.# The owner comes back to a summary
      - listitem: #:#.# Inbox sweep starts
      - listitem: #:#.# The connection drops
      - listitem: #:#.# and comes back
      - listitem: #:#.# The gateway restarts
      - listitem: #:#.# and is back
      - listitem: #:#.# Quiet hours start
      - listitem: #:#.# An approval arrives, quietly
      - listitem: #:#.# The owner denies it
      - listitem: #:#.# Quiet hours end
      - listitem: #:#.# Inbox sweep finishes
  - group "Look":
    - heading "Look" [level=#]
    - paragraph: These are the app's own settings, as in Settings → Design.
    - radiogroup "Colour scheme":
      - radio "Coral" [checked]
      - radio "Jade"
      - radio "Mono"
    - radiogroup "<theme> or <theme>":
      - radio "<theme>" [checked]
      - radio "<theme>"
    - text: Bounciness
    - slider "Bounciness": "#"
    - text: Expressiveness
    - slider "Expressiveness": "#.#"
    - paragraph: Reduced motion is off, from your <theme>'s setting.
